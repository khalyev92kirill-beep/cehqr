<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Технолог 3D</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1e2226"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Технолог 3D"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: рабочий инструмент цеха — узкая колонка с крупными целями нажатия; номер детали и размеры набраны моноширинным, как на этикетке */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --sunk:#eae8e2; --line:#d9d6cd; --ink:#1d1f1e; --muted:#6a6c66;
  --accent:#0f6b63; --accent-ink:#ffffff; --accent-soft:#dcece9;
  --edge:#c98a1b; --edge-soft:#f5e6c8; --hole:#26302e; --hole-b:#7a8582;
  --ok:#2f7d32; --warn:#a86a00; --bad:#b3261e;
  --board:#efe4cf; --board-line:#b9a983;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151716; --surface:#1d201f; --sunk:#252928; --line:#343a38; --ink:#e9ebe7; --muted:#9aa19c;
  --accent:#4fb8ab; --accent-ink:#0b1a18; --accent-soft:#1d3532;
  --edge:#e0a744; --edge-soft:#3a2f1a; --hole:#dfe5e2; --hole-b:#8c9894;
  --ok:#6cc070; --warn:#e2a93b; --bad:#ef7a70;
  --board:#3a3326; --board-line:#7d6c4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151716; --surface:#1d201f; --sunk:#252928; --line:#343a38; --ink:#e9ebe7; --muted:#9aa19c;
  --accent:#4fb8ab; --accent-ink:#0b1a18; --accent-soft:#1d3532;
  --edge:#e0a744; --edge-soft:#3a2f1a; --hole:#dfe5e2; --hole-b:#8c9894;
  --ok:#6cc070; --warn:#e2a93b; --bad:#ef7a70;
  --board:#3a3326; --board-line:#7d6c4b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.01em;cursor:pointer;background:none;border:0;padding:4px 0}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.brand-mark svg{display:block}
.find{flex:1 1 260px;display:flex;gap:6px;min-width:0}
.find input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-family:var(--f-mono);letter-spacing:.03em}
.find input:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.role{font-size:12px;color:var(--muted);padding:4px 8px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}

.nav{display:flex;gap:4px;margin-block:16px 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.nav button{background:none;border:0;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}

h1{font-size:26px;line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:17px;margin:0 0 10px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px;margin-bottom:16px}
.banner.warn{background:var(--edge-soft)}

/* orders */
.orders{display:grid;gap:10px}
.order{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;width:100%}
.order:hover{border-color:var(--muted)}
.order-name{font-weight:600;min-width:0}
.order-meta{font-size:13px;color:var(--muted)}
.order .bar{grid-column:1/-1}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--edge-soft);color:var(--ink);font-weight:600;letter-spacing:.02em}

/* order page */
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);letter-spacing:.02em}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.stage i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* part page */
.part-top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;margin-bottom:18px}
.code{font-family:var(--f-mono);font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1}
.part-name{font-size:19px;font-weight:600;margin-top:6px}
.qr-box{background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line);width:104px}
.qr-box svg{display:block;width:100%;height:auto}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.fact{background:var(--surface);padding:10px 14px;min-width:0}
.fact b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.fact span{font-weight:600;overflow-wrap:anywhere}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.stages button{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.stages button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stages button i{width:9px;height:9px;border-radius:50%;display:inline-block}
.panels{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.mapbox{overflow-x:auto}
.mapbox svg{display:block;width:100%;height:auto;min-width:420px}
.fv-box{position:relative;overflow:hidden;border-radius:10px}
.fv-box svg{min-width:0;cursor:grab;touch-action:pan-y;user-select:none}
.fv-box.zoomed svg{touch-action:none}
.fv-box svg.grab{cursor:grabbing}
.fv-zoom{position:absolute;right:8px;top:8px;display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--glass,rgba(255,255,255,.85));box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.fv-zoom button{border:0;background:transparent;border-radius:8px;min-width:34px;height:32px;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer}
.fv-zoom button:hover{background:var(--sunk)}
.fv-tip{font-size:12px;color:var(--muted);margin:6px 2px 0}
.fv-mod{border-top:1px solid var(--line);padding:8px 0}
.fv-mod>summary{cursor:pointer;padding:6px 2px;font-size:15px}
.fv-mod>summary .muted{font-size:13px;margin-left:6px}
.asm{position:relative;margin-bottom:18px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--sunk),var(--bg))}
.asm canvas{display:block;width:100%;height:min(62vh,560px);touch-action:none;cursor:grab}
.asm-tools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.asm-tools button{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;font-weight:500}
.asm-tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.asm-pick{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.asm-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.asm-labels span{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:11px;font-weight:600;line-height:1;padding:3px 5px;border-radius:4px;background:rgba(255,255,255,.88);color:#1d1f1e;white-space:nowrap;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.asm-labels span.sel{background:var(--accent);color:var(--accent-ink)}
.asm-labels b.pos{position:absolute;transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 4px;box-sizing:border-box;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10.5px;font-weight:700;line-height:1;background:#fff;color:#1d1f1e;border:1.3px solid #1d1f1e;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.asm-labels .meas{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:2px;font-family:var(--f-mono);font-size:12.5px;font-weight:700;line-height:1;padding:4px 4px 4px 7px;border-radius:7px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:auto}
.asm-labels .meas.pre{opacity:.75;padding-right:7px}
.asm-labels .meas button{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 4px;cursor:pointer}
.asm-labels .snap{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--accent);pointer-events:none}
.asm-labels .snap.a{width:14px;height:14px;margin:-7px 0 0 -7px}
.asm-labels b.pos.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tex-list{display:grid;gap:8px}
.tex-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tex-thumb{width:48px;height:48px;border-radius:8px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);flex:none}
.tex-name{flex:1 1 220px;min-width:0;font-weight:500}
.tex-name small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tex-act{display:flex;gap:6px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,11,.45);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);padding:20px;width:min(420px,100%);max-height:100%;overflow:auto}
.size-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.size-pick label{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:500}
.qr-big{background:#fff;border-radius:12px;padding:10px;width:min(300px,100%);margin:0 auto}
.qr-big svg{display:block;width:100%;height:auto}
.fv summary{cursor:pointer;list-style-position:inside}
.fv-box svg{min-width:520px}
.plist summary{cursor:pointer;font-weight:600;padding:10px 0;list-style-position:inside}
.asm-hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--muted);pointer-events:none}
#three{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:8px;background:var(--sunk);touch-action:none;cursor:grab;display:block}
.edges-list{display:grid;gap:6px;font-size:14px}
.edge-row{display:flex;gap:10px;align-items:center}
.edge-row i{width:22px;height:6px;border-radius:2px;background:var(--edge);flex:none}
.edge-row i.none{background:var(--sunk)}

/* import */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-block:14px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.steps{display:grid;gap:12px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
code{font-family:var(--f-mono);font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.empty{padding:28px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:720px){
  .panels{grid-template-columns:1fr}
  .code{font-size:24px}
  .qr-box{width:84px}
  h1{font-size:22px}
}

/* ---------- полировка ---------- */
:root{--shadow:0 1px 2px rgba(30,32,28,.06),0 4px 14px rgba(30,32,28,.06);--shadow-lg:0 10px 30px rgba(20,22,20,.16),0 2px 6px rgba(20,22,20,.08);--glass:rgba(255,255,255,.82)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--shadow-lg:0 10px 30px rgba(0,0,0,.45);--glass:rgba(29,32,31,.82)}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--shadow-lg:0 10px 30px rgba(0,0,0,.45);--glass:rgba(29,32,31,.82)}
.btn,.order,.stages button,.asm-tools button,tbody tr{transition:background-color .15s,border-color .15s,box-shadow .15s,transform .15s,color .15s}
.btn{border-radius:10px}
.btn.primary{box-shadow:0 1px 0 rgba(0,0,0,.08)}
.card,.tablebox,.order,.facts,.empty{box-shadow:var(--shadow);border-color:transparent}
.order{padding:16px 18px;border-radius:14px}
.order:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.order-name{font-size:16px}
.card{border-radius:14px;padding:16px}
.tablebox{border-radius:14px}
.top{backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);background:color-mix(in srgb,var(--bg) 86%,transparent)}
.find input{border-radius:10px}
.find input::placeholder{color:var(--muted);opacity:.8}

/* 3D */
.asm{border:0;border-radius:16px;box-shadow:var(--shadow);background:radial-gradient(120% 90% at 50% 35%,var(--surface) 0%,var(--sunk) 70%,var(--bg) 100%)}
.asm canvas{height:min(66vh,620px)}
.asm.full{position:fixed;inset:0;z-index:40;margin:0;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.asm.full canvas{height:100%}
body.has-full{overflow:hidden}
.asm-tools{top:12px;left:12px;right:12px;gap:8px}
.asm-tools .grp{display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow);pointer-events:auto}
.asm-tools .grp.end{margin-left:auto}
.asm-tools .grp{flex-wrap:wrap;max-width:100%}
.asm-tools button span{white-space:nowrap}
.asm-tools button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:9px;padding:8px 10px;color:var(--ink)}
.asm-tools button:hover{background:var(--sunk)}
.asm-tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.asm-tools svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.asm-pick{left:50%;right:auto;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));border:0;border-radius:14px;padding:12px 14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow-lg);animation:pickIn .18s ease-out}
.asm-pick .pc{display:grid;gap:2px;min-width:0}
.asm-pick .pc b{font-size:15px}
.asm-pick .pc small{color:var(--muted);font-size:13px}
.asm-pick.tag{left:0;top:0;right:auto;bottom:auto;width:auto;max-width:min(380px,calc(100% - 16px));transform:translate(-50%,-100%);display:flex;flex-wrap:nowrap;align-items:center;gap:6px;padding:5px 5px 5px 6px;border-radius:12px;font-size:13px;animation:none;z-index:5}
.asm-pick.tag:not(.dock):not(.clamp)::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1}
.asm-pick.tag .tg-pos{flex:none;min-width:26px;height:26px;padding:0 5px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);font:700 12px/1 var(--f-mono)}
.asm-pick.tag .tg-pos.furn{background:var(--sunk);color:var(--ink)}
.asm-pick.tag .tg-t{display:grid;gap:1px;min-width:0;padding-right:2px}
.asm-pick.tag .tg-t b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asm-pick.tag .tg-t small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.asm-pick.tag .tg-st{display:inline-block;width:8px;height:8px;border-radius:50%}
.asm-pick.tag .tg-b{flex:none;display:inline-flex;align-items:center;gap:4px;height:30px;min-width:30px;padding:0 7px;border:0;border-radius:9px;background:transparent;color:var(--ink);cursor:pointer;font:600 12.5px var(--f-sans,inherit)}
.asm-pick.tag .tg-b:hover{background:var(--sunk)}
.asm-pick.tag .tg-b.main{background:var(--accent);color:var(--accent-ink)}
.asm-pick.tag .tg-b svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

    const q=Math.max(1,Math.min(500,parseInt(p.qty||1,10)||1));
    for(let i=0;i<q;i++){
      n++;
      out.push({
        code: orderId+"-"+pad(n,3),
        name:p.name||"Деталь", art:p.art||"", L:+p.L||0, W:+p.W||0, T:+p.T||0,
        material:p.material||"", edges:p.edges||{}, edgesRaw:p.edgesRaw||[],

function shrinkImage(dataUrl, maxPx, q){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,maxPx/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); }; img.onerror=()=>rej(new Error("картинка не читается")); img.src=dataUrl; });
}
async function saveTextures(textures){

/* ---------- карта присадки ---------- */
function drillMap(p, mode){
  const L=p.L||1, W=p.W||1;
  const VW=720, M={l:92,r:40,t:46,b:96};
  const s=Math.min((VW-M.l-M.r)/L, 340/W);
  const pw=L*s, ph=W*s, VH=M.t+ph+M.b;
  const X=x=>M.l+x*s, Y=y=>M.t+ph-y*s;
  let g="";
  // панель
  g+=`<rect x="${X(0)}" y="${Y(W)}" width="${pw}" height="${ph}" fill="var(--board)" stroke="var(--board-line)" stroke-width="1"/>`;
  // кромка
  const e=p.edges||{}, ew=5;
  const edgeLine={L1:[X(0),Y(0)+ew/2+1,X(L),Y(0)+ew/2+1],L2:[X(0),Y(W)-ew/2-1,X(L),Y(W)-ew/2-1],W1:[X(0)-ew/2-1,Y(0),X(0)-ew/2-1,Y(W)],W2:[X(L)+ew/2+1,Y(0),X(L)+ew/2+1,Y(W)]};
  Object.keys(edgeLine).forEach(k=>{ if(e[k]){ const [a,b,c,d]=edgeLine[k];
    g+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="var(--edge)" stroke-width="${e[k].t>=1?ew:2.5}" stroke-linecap="butt"/>`; }});
  // подписи кромки
  const lab=(k,x,y,anchor,rot)=>{ if(!e[k]) return; g+=`<text x="${x}" y="${y}" font-size="11" fill="var(--edge)" font-family="var(--f-mono)" font-weight="700" text-anchor="${anchor}" ${rot?`transform="rotate(-90 ${x} ${y})"`:""}>${k} · ${fmt(e[k].t)}</text>`; };
  lab("L2",X(L/2),Y(W)-10,"middle"); lab("W2",X(L)+18,Y(W/2),"middle",true);
  // отверстия
  const xs=new Set(), ys=new Set();
  (p.holes||[]).forEach(h=>{
    const r=Math.max(2.2,h.d/2*s);
    if(h.face==="A"||h.face==="B"){
      xs.add(+h.x); ys.add(+h.y);
      const through=h.depth>=p.T;
      g+= h.face==="A"
        ? `<circle cx="${X(h.x)}" cy="${Y(h.y)}" r="${r}" fill="${through?"var(--surface)":"var(--hole)"}" stroke="var(--hole)" stroke-width="1.4"/>`
        : `<circle cx="${X(h.x)}" cy="${Y(h.y)}" r="${r}" fill="none" stroke="var(--hole-b)" stroke-width="1.4" stroke-dasharray="3 2"/>`;
    } else {
      const dep=Math.max(6,h.depth*s), hw=Math.max(2.5,h.d/2*s);
      if(h.face==="W1"||h.face==="W2"){ ys.add(+h.y); const x0=h.face==="W1"?X(0):X(L)-dep;
        g+=`<rect x="${x0}" y="${Y(h.y)-hw}" width="${dep}" height="${hw*2}" fill="none" stroke="var(--hole)" stroke-width="1.2" stroke-dasharray="4 2"/>`; }
      else { xs.add(+h.x); const y0=h.face==="L1"?Y(0)-dep:Y(W);
        g+=`<rect x="${X(h.x)-hw}" y="${y0}" width="${hw*2}" height="${dep}" fill="none" stroke="var(--hole)" stroke-width="1.2" stroke-dasharray="4 2"/>`; }
    }
  });
  // размеры
  const dimC="var(--muted)", tx=(x,y,t,rot,anchor="middle")=>`<text x="${x}" y="${y}" font-size="11" fill="var(--ink)" font-family="var(--f-mono)" text-anchor="${anchor}" ${rot?`transform="rotate(-90 ${x} ${y})"`:""}>${t}</text>`;
  const sx=[...xs].filter(v=>v>0&&v<L).sort((a,b)=>a-b), sy=[...ys].filter(v=>v>0&&v<W).sort((a,b)=>a-b);
  const yb=Y(0)+22, xl=X(0)-22;
  if(mode==="base"){
    // координатный способ от базы (угол Д1/Ш1)
    g+=`<line x1="${X(0)}" y1="${yb}" x2="${X(L)}" y2="${yb}" stroke="${dimC}"/>`;
    [0,...sx].forEach(v=>{ g+=`<line x1="${X(v)}" y1="${Y(0)+4}" x2="${X(v)}" y2="${yb+4}" stroke="${dimC}"/>`; if(v>0) g+=tx(X(v)+4,yb+8,fmt(v),true,"end"); });
    g+=`<line x1="${xl}" y1="${Y(0)}" x2="${xl}" y2="${Y(W)}" stroke="${dimC}"/>`;
    [0,...sy].forEach(v=>{ g+=`<line x1="${X(0)-4}" y1="${Y(v)}" x2="${xl-4}" y2="${Y(v)}" stroke="${dimC}"/>`; if(v>0) g+=tx(xl-8,Y(v)+4,fmt(v),false,"end"); });
    g+=`<text x="${X(0)-6}" y="${Y(0)+16}" font-size="10" fill="var(--accent)" font-weight="700" text-anchor="end">0</text>`;
  } else {
    // цепочкой
    const cx=[0,...sx,L], cy=[0,...sy,W];
    g+=`<line x1="${X(0)}" y1="${yb}" x2="${X(L)}" y2="${yb}" stroke="${dimC}"/>`;
    cx.forEach(v=> g+=`<line x1="${X(v)}" y1="${Y(0)+4}" x2="${X(v)}" y2="${yb+4}" stroke="${dimC}"/>`);
    for(let i=1;i<cx.length;i++){ const d=cx[i]-cx[i-1], m=(X(cx[i])+X(cx[i-1]))/2; g+= (X(cx[i])-X(cx[i-1])>26)? tx(m,yb-4,fmt(d)) : tx(m+3,yb+8,fmt(d),true,"end"); }
    g+=`<line x1="${xl}" y1="${Y(0)}" x2="${xl}" y2="${Y(W)}" stroke="${dimC}"/>`;
    cy.forEach(v=> g+=`<line x1="${X(0)-4}" y1="${Y(v)}" x2="${xl-4}" y2="${Y(v)}" stroke="${dimC}"/>`);
    for(let i=1;i<cy.length;i++){ const d=cy[i]-cy[i-1], m=(Y(cy[i])+Y(cy[i-1]))/2; g+= (Y(cy[i-1])-Y(cy[i])>18)? tx(xl-6,m+4,fmt(d),false,"end") : tx(xl-26,m+4,fmt(d),false,"end"); }
  }
  // габариты
  const yo=Y(0)+(mode==="base"?74:58), xo=X(0)-(mode==="base"?78:70);
  g+=`<line x1="${X(0)}" y1="${yo}" x2="${X(L)}" y2="${yo}" stroke="var(--ink)"/><line x1="${X(0)}" y1="${yo-5}" x2="${X(0)}" y2="${yo+5}" stroke="var(--ink)"/><line x1="${X(L)}" y1="${yo-5}" x2="${X(L)}" y2="${yo+5}" stroke="var(--ink)"/>`;
  g+=`<text x="${X(L/2)}" y="${yo-5}" font-size="13" font-weight="700" fill="var(--ink)" font-family="var(--f-mono)" text-anchor="middle">${fmt(L)}</text>`;
  g+=`<line x1="${xo}" y1="${Y(0)}" x2="${xo}" y2="${Y(W)}" stroke="var(--ink)"/><line x1="${xo-5}" y1="${Y(0)}" x2="${xo+5}" y2="${Y(0)}" stroke="var(--ink)"/><line x1="${xo-5}" y1="${Y(W)}" x2="${xo+5}" y2="${Y(W)}" stroke="var(--ink)"/>`;
  g+=`<text x="${xo-6}" y="${Y(W/2)}" font-size="13" font-weight="700" fill="var(--ink)" font-family="var(--f-mono)" text-anchor="middle" transform="rotate(-90 ${xo-6} ${Y(W/2)})">${fmt(W)}</text>`;
  // базовый угол
  g+=`<path d="M${X(0)} ${Y(0)} l14 0 l-14 -14 z" fill="var(--accent)"/>`;
  g+=`<text x="${X(0)+18}" y="${Y(0)-4}" font-size="10" fill="var(--accent)" font-weight="700">БАЗА</text>`;
  return `<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Карта присадки, вид на пласть A">${g}</svg>`;
}

let three=null;

function disposeThree(){ if(three){ cancelAnimationFrame(three.raf); three.ro&&three.ro.disconnect(); three.renderer.dispose(); three=null; } }
function mount3D(p){
  disposeThree();

    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r,dep+0.004,20),hm);

    else if(h.face==="W2"){ cyl.rotation.z=Math.PI/2; cyl.position.set(L*k/2-dep/2+0.002,y,0); }

  });
  grp.rotation.set(-0.95,0.0,-0.35);
  let drag=null, zoom=16;
  canvas.onpointerdown=ev=>{ drag={x:ev.clientX,y:ev.clientY,rx:grp.rotation.x,rz:grp.rotation.z}; canvas.setPointerCapture(ev.pointerId); };
  canvas.onpointermove=ev=>{ if(!drag) return; grp.rotation.z=drag.rz+(ev.clientX-drag.x)*0.01; grp.rotation.x=drag.rx+(ev.clientY-drag.y)*0.01; };
  canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
  canvas.onwheel=ev=>{ ev.preventDefault(); zoom=Math.max(6,Math.min(30,zoom+ev.deltaY*0.01)); cam.position.z=zoom; };

}

// служебные тела Базиса (стены комнаты, розетки, корпуса техники) — не фурнитура, если не входят в сборный комплект
const NOT_FURN=/^(профиль\d*|вращение\d*|вычитание.*|сложение.*|пересечение.*|тело.*|\d+)$/i;
let _fcSrc=null, _fcOut=[];
function curFasteners(){ const src=S.current.fasteners || ((S.orders[S.current.orderId]||{}).fasteners) || [];
  if(src!==_fcSrc){ _fcSrc=src; _fcOut=src.filter(f=>f.g||!NOT_FURN.test(String(f.n).trim())); } return _fcOut; }
// крепёж (конфирматы, шканты, эксцентрики, полкодержатели, шурупы, уголки) — отдельно от фурнитуры, своей кнопкой
const KREP_RE=/конфирмат|евровинт|шкант|эксцентрик|минификс|рафикс|стяжк|полкодерж|шуруп|саморез|винт|дюбел|уголок|заглушк|ригель|^\d+([,.]\d+)?([xх×*]\d+([,.]\d+)?)*$/i;

  return KREP_RE.test(n)||mx<=16; }
// диаметр сверления как в Базисе: по типу крепежа; face — отверстие в пласти (true) или в торце (false)
function drillD(name, face, crossMin){ const n=String(name||"").toLowerCase(), num=(n.match(/(\d+(?:[.,]\d+)?)\s*[xх×*]/)||[])[1];
  if(/конфирмат|евровинт/.test(n)) return face?7:5;
  if(/эксцентрик|минификс|рафикс/.test(n)) return face?15:8;
  if(/петл|чашк/.test(n)&&crossMin>=30) return 35;
  if(/полкодерж/.test(n)) return 5;
  if(/шкант|шуруп|саморез|винт|дюбел/.test(n)&&num) return +num.replace(",",".");
  if(/^\d/.test(n)&&num&&+num.replace(",",".")<=20) return +num.replace(",",".");
  return Math.min(35,Math.max(2,crossMin)); }
function fastenerColor(n){ n=String(n).toLowerCase();
  if(/петл/.test(n)) return 0x23a455; if(/евровинт|конфирмат/.test(n)) return 0xd83a2e; if(/шкант/.test(n)) return 0xd18b00;

// Контейнер — пара стоек одной высоты (корпус, секция, приставка). Внутри:
//  • высоты горизонталей от низа стойки — отдельная размерная линия на каждую, лесенкой;
//  • горизонтальные размеры от внутренней грани левой стойки до осей внутренних перегородок;
//  • высоты направляющих ящиков от низа перегородок блока (если в выгрузке есть крепёж).
const RUNNER_OFF=22;
// отдельный чертёж на каждый модуль (кухня): модуль поворачиваем так, чтобы смотреть на него спереди
function moduleViews(parts, fasteners, mode, wire, hinges, pos){
  const withBox=parts.filter(p=>p.box), groups=new Map();
  withBox.forEach(p=>{ if(!p.mod) return; if(!groups.has(p.mod)) groups.set(p.mod,[]); groups.get(p.mod).push(p); });
  const one=()=>{ const fv=frontView(parts,{mode,fasteners,wire,hinges,pos}); return fv&&fv.sections?[{title:"",size:"",svg:fv.svg}]:[]; };
  if(groups.size<2) return one();
  const bb=ps=>{ const lo=[1e9,1e9,1e9], hi=[-1e9,-1e9,-1e9]; ps.forEach(p=>{ for(let i=0;i<3;i++){ lo[i]=Math.min(lo[i],p.box[i]); hi[i]=Math.max(hi[i],p.box[i+3]); } }); return {lo,hi,c:[0,1,2].map(i=>(lo[i]+hi[i])/2)}; };

  [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0],"ru",{numeric:true})).forEach(([mod,ps])=>{
    const m=bb(ps);
    // задняя стенка — тонкая большая деталь: её тонкая ось и есть глубина модуля
    const back=ps.filter(p=>{ const d=[0,1,2].map(i=>p.box[i+3]-p.box[i]); const t=Math.min(...d); return t<=8&&d[1]>=200&&Math.max(d[0],d[2])>=100; })
      .sort((a,b)=>{ const A=(a.box[3]-a.box[0])*(a.box[4]-a.box[1])*(a.box[5]-a.box[2]), B=(b.box[3]-b.box[0])*(b.box[4]-b.box[1])*(b.box[5]-b.box[2]); return B-A; })[0];

      const thinX=sides.filter(p=>p.box[3]-p.box[0]<=40&&p.box[5]-p.box[2]>40).length, thinZ=sides.filter(p=>p.box[5]-p.box[2]<=40&&p.box[3]-p.box[0]>40).length;

    const loose=ps.map(p=>Object.assign({},p,{box:tf(p.box)}));
    const fs=(fasteners||[]).filter(f=>f.b[0]>=m.lo[0]-5&&f.b[3]<=m.hi[0]+5&&f.b[1]>=m.lo[1]-5&&f.b[4]<=m.hi[1]+5&&f.b[2]>=m.lo[2]-5&&f.b[5]<=m.hi[2]+5).map(f=>{ const r=Object.assign({},f,{b:tf(f.b)}); if(f.o) r.o=tf(f.o.concat(f.o)).slice(0,3); return r; });
    if(Math.min(m.hi[0]-m.lo[0],m.hi[2]-m.lo[2])>720) return;   // угловой модуль или каркас из длинных планок — спереди его не нарисовать
    const fv=frontView(loose,{mode,fasteners:fs,wire,hinges,pos}); if(!fv||!fv.sections) return;

  });

}
function frontView(parts, opt){
  opt=opt||{};
  const P=parts.filter(p=>p.box).map(p=>{ const b=p.box; return {p,x0:b[0],y0:b[1],z0:b[2],x1:b[3],y1:b[4],z1:b[5],sx:b[3]-b[0],sy:b[4]-b[1],sz:b[5]-b[2]}; });
  if(!P.length) return "";
  const isFacade=q=>/фасад|дверь/i.test(q.p.name), isBack=q=>q.sz<=8&&q.sx>100&&q.sy>100, isDrawer=q=>/ящик/i.test(q.p.name);

  const r1=v=>Math.round(v*10)/10, fmtv=v=>String(r1(v)).replace(".",",");
  const verts=body.filter(q=>q.sx<=40&&q.sy>=60&&q.sz>=D*0.5&&!isDrawer(q)).sort((a,b)=>a.x0-b.x0);
  const hor=body.filter(q=>q.sy<=40&&q.sx>=80&&q.sz>=D*0.4&&!isDrawer(q));
  const yOver=(a,b)=>Math.max(0,Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0));

  const conts=[];
  verts.forEach((L,i)=>{
    for(let k=i+1;k<verts.length;k++){ const R=verts[k];
      const hmin=Math.min(L.sy,R.sy), similar=Math.abs(L.sy-R.sy)<=Math.max(L.sy,R.sy)*0.06&&yOver(L,R)>=hmin*0.9;

      if(similar){ conts.push({L,R,xl:L.x1,xr:R.x0,base:Math.min(L.y0,R.y0),top:Math.min(L.y1,R.y1),h:hmin}); break; }

  if(!conts.length&&verts.length&&hor.length){
    const V=verts.slice().sort((a,b)=>b.sy-a.sy)[0];
    const left=hor.filter(h=>(h.x0+h.x1)/2<V.x0), right=hor.filter(h=>(h.x0+h.x1)/2>V.x1);
    const ghost=x=>({x0:x,x1:x,y0:V.y0,y1:V.y1,sy:V.sy,sx:0});
    if(left.length>=right.length&&left.length){ const hx0=Math.min(...left.map(h=>h.x0)); if(V.x0-hx0>=60) conts.push({L:ghost(hx0),R:V,xl:hx0,xr:V.x0,base:V.y0,top:V.y1,h:V.sy}); }
    else if(right.length){ const hx1=Math.max(...right.map(h=>h.x1)); if(hx1-V.x1>=60) conts.push({L:V,R:ghost(hx1),xl:V.x1,xr:hx1,base:V.y0,top:V.y1,h:V.sy}); }
  }
  // рамка чертежа
  const HM=!!opt.hinges, facs=P.filter(q=>isFacade(q)&&q.sz<=40), frameSet=HM?body.concat(facs):body;
  const X0=Math.min(...frameSet.map(q=>q.x0)), X1=Math.max(...frameSet.map(q=>q.x1)), Y0=Math.min(...frameSet.map(q=>q.y0)), Y1=Math.max(...frameSet.map(q=>q.y1));

    c.groups=[...gm.values()].map(vs=>({top:Math.max(...vs.map(v=>v.y1)),axes:[...new Set(vs.map(v=>r1((v.x0+v.x1)/2-c.xl)))].sort((a,b)=>a-b)}));

  conts.forEach(c=>{ c.nested=conts.some(o=>o!==c&&o.xl<=c.xl+1&&o.xr>=c.xr-1&&(o.xr-o.xl)>(c.xr-c.xl)+1&&o.base<=c.base+1&&o.top>=c.top-1); });

  const vb0=verts.length?Math.min(...verts.map(v=>v.y0)):0, xMin=Math.min(...body.map(q=>q.x0)), xMax=Math.max(...body.map(q=>q.x1));
  const ords=[]; let prev=null;

    if(Math.max(sx,sy,b[5]-b[2])<15||b[0]<X0-5||b[3]>X1+5||b[1]<Y0-5||b[4]>Y1+5) return;
    g+=`<rect x="${X(b[0])}" y="${Y(b[4])}" width="${Math.max(0.8,sx*s)}" height="${Math.max(0.8,sy*s)}" fill="#8a9096" fill-opacity="0.25" stroke="#5f666c" stroke-width="0.6" stroke-dasharray="3 2"><title>${esc(f.g||f.n)}</title></rect>`; });
  const label=(x,y,t,rot,anchor)=>`<text x="${x}" y="${y}" font-size="11.5" font-weight="700" fill="${A}" font-family="var(--f-mono)" text-anchor="${anchor||"middle"}" paint-order="stroke" stroke="var(--surface)" stroke-width="3" ${rot?`transform="rotate(-90 ${x} ${y})"`:""}>${t}</text>`;
  const arrowV=(x,ya,yb)=>`<line x1="${x}" y1="${ya}" x2="${x}" y2="${yb}" stroke="${A}" stroke-width="0.9"/><path d="M${x-2.5} ${yb+5} L${x} ${yb} L${x+2.5} ${yb+5}" fill="none" stroke="${A}" stroke-width="0.9"/>`;
  const fast=(opt.fasteners||[]).filter(f=>/направл|tandem|movento|legrabox|unihopper/i.test(f.n+" "+(f.g||"")));

  if(HM){

    // сначала все фасады, потом поверх — петли и размеры, чтобы ничего не перекрывалось

const LABEL_SIZES=[[58,40],[58,30],[75,50],[100,50]];
function labelSize(){ try{ const v=localStorage.getItem("cehqr-label"); if(v){ const [w,h]=v.split("x").map(Number); if(w&&h) return [w,h]; } }catch(_){} return [58,40]; }

function fitFont(c, text, weight, family, maxPx, maxW){

}
async function labelsPdf(parts, title, size){
  if(!window.jspdf || typeof qrcode!=="function"){ toast("Не загрузились модули для PDF. Обновите страницу."); return; }
  try{ await document.fonts.ready; }catch(_){}
  const [Wmm,Hmm]=size||labelSize(), PX=12, m=1.6*PX;
  const pdf=new window.jspdf.jsPDF({unit:"mm", format:[Wmm,Hmm], orientation:Wmm>=Hmm?"landscape":"portrait"});
  const cv=document.createElement("canvas"); cv.width=Wmm*PX; cv.height=Hmm*PX; const c=cv.getContext("2d");
  const W=cv.width, H=cv.height, MONO='"JetBrains Mono", monospace', SANS='"Onest", sans-serif';
  const order=S.orders[orderIdOf(parts[0]&&parts[0].code||"")]||{};
  parts.forEach((p0,i)=>{
    const p=withRules(p0), e=p.edges||{};
    c.fillStyle="#fff"; c.fillRect(0,0,W,H); c.fillStyle="#000"; c.strokeStyle="#000"; c.textBaseline="alphabetic"; c.textAlign="left";
    // нижняя строка: код, позиция, заказ
    const footH=Math.max(2.2*PX, H*0.085);
    // QR слева
    const qs=Math.min(H-2*m-footH-0.6*PX, W*0.42);
    const q=qrMatrix(partUrl(p.code)), n=q.getModuleCount(), cell=qs/n;
    for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) c.fillRect(Math.floor(m+k*cell),Math.floor(m+r*cell),Math.ceil(cell),Math.ceil(cell));
    const x0=m+qs+1.4*PX, rw=W-x0-m;
    // название

    const nameSz=Math.min(H*0.12, 4.2*PX);
    c.font=`700 ${nameSz}px ${SANS}`;
    const name=p.name+(p.copy?` · ${p.copy}`:"");
    y+=nameSz*0.95; wrapText(c, name, x0, y, rw, nameSz*1.05, 2);
    const lines=c.measureText(name).width>rw?2:1; y+=nameSz*1.05*(lines-1);
    // размер — самое крупное

    const dSz=fitFont(c, dims, 700, MONO, Math.min(H*0.17, 6*PX), rw);
    y+=dSz*1.1; c.fillText(dims, x0, y);
    const sub=`толщ. ${fmt(p.T)} · поз. ${p.art||"—"}`, subSz=fitFont(c, sub, 600, MONO, Math.max(1.6*PX,dSz*0.45), rw);

    const ratio=Math.max(0.25,Math.min(0.6,(p.W||1)/(p.L||1)));
    let bw=Math.min(rw*0.62, avail/ratio), bh=bw*ratio; if(bh>avail){ bh=avail; bw=bh/ratio; }
    const bx=x0+1.4*PX, by=top+(avail-bh)/2+0.4*PX;
    if(bh>1.2*PX){
      c.setLineDash([0.6*PX,0.5*PX]); c.lineWidth=0.18*PX; c.strokeRect(bx,by,bw,bh); c.setLineDash([]);
      const thick=0.75*PX, fs=Math.max(1.5*PX,Math.min(2.2*PX,bh*0.45)); c.font=`700 ${fs}px ${MONO}`;
      const side=(k,x1,y1,x2,y2,lx,ly,al)=>{ if(!e[k]) return; c.lineWidth=thick; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.textAlign=al; c.fillText(fmt(e[k].t),lx,ly); c.textAlign="left"; };
      side("L1",bx,by+bh,bx+bw,by+bh,bx+bw/2,by+bh+fs*1.05,"center");
      side("L2",bx,by,bx+bw,by,bx+bw/2,by-fs*0.25,"center");
      side("W1",bx,by,bx,by+bh,bx-0.5*PX,by+bh/2+fs*0.35,"right");
      side("W2",bx+bw,by,bx+bw,by+bh,bx+bw+0.5*PX,by+bh/2+fs*0.35,"left");
      const nh=(p.holes||[]).length;
      if(nh){ c.font=`600 ${Math.max(1.4*PX,fs*0.8)}px ${SANS}`; c.fillText(`${nh} отв.`, bx+bw+ (e.W2?2.6*PX:1*PX), by+bh*0.3+fs*0.3); }
    }

    c.fillStyle="#fff";
    const foot=`${p.code}  ·  ${order.name||""}  ·  ${String(p.material||"").split(",").pop().trim()}`;
    fitFont(c, foot, 600, MONO, footH*0.62, W-2*m); c.fillText(foot, m, H-footH*0.28);
    if(i>0) pdf.addPage([Wmm,Hmm],Wmm>=Hmm?"landscape":"portrait");
    pdf.addImage(cv.toDataURL("image/png"),"PNG",0,0,Wmm,Hmm);
  });
  try{
    await saveFileReq({filename:`Этикетки ${title} ${Wmm}x${Hmm}.pdf`, data:pdf.output("blob")});

  }catch(e){ if(e&&e.code!=="declined") toast("Не удалось сохранить файл: "+(e.code||"ошибка")); }
}
function wrapText(c,text,x,y,maxW,lh,maxLines){
  const words=String(text||"").split(/\s+/); let line="", ln=0;
  for(let i=0;i<words.length;i++){
    const t=line?line+" "+words[i]:words[i];
    if(c.measureText(t).width>maxW && line){ c.fillText(ln===maxLines-1?line+"…":line,x,y+ln*lh); ln++; line=words[i]; if(ln>=maxLines) return; }
    else line=t;

}

/* ---------- импорт ---------- */
function numOf(v){ if(v==null) return 0; const m=String(v).replace(",",".").match(/-?\d+(\.\d+)?/); return m?+m[0]:0; }
function edgeFrom(v){ if(v==null||v==="") return null; if(typeof v==="object") return v.t?{m:v.m||v.material||"",t:+v.t}:null; const t=numOf(v); return t>0?{m:String(v).trim(),t}:null; }
function parseJSON(text){
  const j=JSON.parse(text.replace(/^﻿/,""));
  const list=Array.isArray(j)?j:(j.parts||[]);
  if(!list.length) throw new Error("В файле нет деталей");
  const parts=list.map(p=>{
    const L=numOf(p.L??p.length), W=numOf(p.W??p.width);
    const out={mod:typeof p.mod==="string"?p.mod:"", name:p.name||"", art:p.art||"", qty:p.qty||1, L:Math.max(L,W), W:Math.min(L,W), T:numOf(p.T??p.thickness), material:p.material||"", edges:{}, edgesRaw:[], holes:Array.isArray(p.holes)?p.holes:[], box:Array.isArray(p.box)&&p.box.length===6?p.box.map(Number):null, grain:Array.isArray(p.grain)?p.grain.map(Number):null};
    if(Array.isArray(p.edges)){
      p.edges.forEach(e=>{ const r={elem:e.elem,m:e.material||e.m||"",t:+e.t||0};
        if(/^(L1|L2|W1|W2)$/.test(e.side||"")) out.edges[e.side]={m:r.m,t:r.t}; else out.edgesRaw.push(r); });

}
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"";
  const delim=[";","\t",","].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===delim){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(ch!=="\r") cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  const head=(rows.shift()||[]).map(h=>h.trim().toLowerCase());
  const find=re=>head.findIndex(h=>re.test(h));
  const col={name:find(/наимен|^name|деталь/), art:find(/артик|^поз|^art|^№/), L:find(/^длин|^l$|length/), W:find(/^шир|^w$|width/), T:find(/толщ|^t$|thick/), qty:find(/кол|qty|шт/), mat:find(/матер|material/),

  if(col.L<0||col.W<0) throw new Error("Не нашёл столбцы «Длина» и «Ширина» в первой строке");
  const parts=rows.filter(r=>r.some(c=>c.trim())).map(r=>{
    const L=numOf(r[col.L]), W=numOf(r[col.W]), g=k=>col[k]>=0?r[col[k]]:"";
    const edges={}; ["L1","L2","W1","W2"].forEach(k=>{ const e=edgeFrom(g(k)); if(e) edges[k]=e; });
    return {name:g("name").trim(), art:g("art").trim(), qty:numOf(g("qty"))||1, L:Math.max(L,W), W:Math.min(L,W), T:numOf(g("T")), material:g("mat").trim(), edges, holes:[]};
  }).filter(p=>p.L>0&&p.W>0);

}

function viewOrder(){

  if(!o&&S.current.loading) return `<p class="muted">Загружаю заказ ${esc(oid)}…</p>`;
  if(S.current.locked) return `<div class="empty"><h2>Проект закрыт</h2><p class="muted">Этот заказ открывается только по своему QR-коду. Попросите QR у технолога.</p><button class="btn" data-act="home">На главную</button></div>`;
  if(!o||S.current.missing) return `<div class="empty"><h2>Заказ ${esc(oid)} не найден</h2><p class="muted">Проверьте, что файл заказа загружен на сайт.</p><button class="btn" data-act="home">К заказам</button></div>`;
  const sb=stageBar(oid,o.count||1);
  let h=`<div class="tblock"><div class="tb-name"><span class="tb-l">Изделие</span><h1>${esc(o.name)}</h1></div>
    <div class="tb-c"><span class="tb-l">Заказ</span><b class="mono">${esc(oid)}</b></div><div class="tb-c"><span class="tb-l">Деталей</span><b class="mono">${o.count}</b></div>
    <div class="tb-c tb-client"><span class="tb-l">Клиент</span><b>${esc(o.client||"не указан")}</b></div>
    <div class="head-actions tb-act"><button class="btn primary" data-act="order-qr">QR проекта для мастеров</button>
    ${S.canEdit? (S.confirmDelete? `<button class="btn danger" data-act="del-yes">Удалить навсегда</button><button class="btn" data-act="del-no">Отмена</button>` : `<button class="btn danger" data-act="del">Удалить</button>`):""}</div></div>`;
  h+=`<div style="margin-bottom:16px">${sb.bar}<div class="legend">${STAGES.map((s,i)=>`<span><i style="background:${s.color}"></i>${s.name} · ${sb.cnt[i]}</span>`).join("")}</div></div>`;
  if(S.current.loading) return h+`<p class="muted">Загружаю детали…</p>`;
  if(S.current.parts.some(p=>p.box)) h+=asmBlock(matchMedia("(pointer:fine)").matches?"левая кнопка — вращать · колесо — приблизить к курсору · правая кнопка — сдвинуть · двойной щелчок — центр сюда · Ctrl + щелчок — выделить несколько":"один палец — вращать · двумя — приблизить и сдвинуть · нажмите на деталь");
  else if(S.current.parts.length) h+=`<div class="banner">3D всего изделия появится после выгрузки новой версией скрипта: в этом заказе нет положения деталей.</div>`;
  if(S.current.parts.some(p=>p.box)){ const fvm=S.fvMode||"mid", fvw=S.fvWire!==false, views=moduleViews(S.current.parts, curFasteners(), fvm, fvw, !!S.fvHinge, S.fvPos!==false);
    const tip=matchMedia("(pointer:fine)").matches?"Колесо мыши — приблизить к курсору, зажать и тянуть — сдвинуть, двойной щелчок — весь чертёж.":"Двумя пальцами — приблизить, потом одним — сдвинуть. Кнопка ⤢ — весь чертёж.";
    const box=v=>`<div class="mapbox fv-box" data-key="${esc(S.current.orderId+"|"+v.title+"|"+(S.fvHinge?"h":"n"))}">${v.svg}<div class="fv-zoom"><button type="button" data-z="meas" title="Поставить свой размер: две точки" aria-label="Поставить размер" aria-pressed="false">📏</button><button type="button" data-z="in" title="Приблизить" aria-label="Приблизить">+</button><button type="button" data-z="out" title="Отдалить" aria-label="Отдалить">−</button><button type="button" data-z="reset" title="Весь чертёж" aria-label="Весь чертёж">⤢</button><button type="button" data-z="full" title="Во весь экран" aria-label="Во весь экран">⛶</button></div></div>`;
    if(views.length) h+=`<details class="card fv" ${S.fvOpen===false?"":"open"} style="margin-bottom:18px"><summary><h2 style="display:inline;margin:0">Вид спереди с размерами${views.length>1?` · ${views.length} модул${views.length<5?"я":"ей"}`:""}</h2></summary><div class="card-head" style="margin:8px 0"><span class="note">Фасады и задняя стенка скрыты. Высоты — от низа стойки, по горизонтали — от внутренней стороны стойки до оси перегородки, мм. Высоты полок:</span>
      <div class="seg" role="group" aria-label="До какой грани полки"><button type="button" data-act="fv-mode" data-m="bottom" aria-pressed="${fvm==="bottom"}">до низа полки</button><button type="button" data-act="fv-mode" data-m="mid" aria-pressed="${fvm==="mid"}">до середины</button><button type="button" data-act="fv-mode" data-m="top" aria-pressed="${fvm==="top"}">до верха</button></div>
      <div class="seg" role="group" aria-label="Вид чертежа"><button type="button" data-act="fv-wire" data-w="1" aria-pressed="${fvw&&!S.fvHinge}">Каркас</button><button type="button" data-act="fv-wire" data-w="0" aria-pressed="${!fvw&&!S.fvHinge}">Заливка</button><button type="button" data-act="fv-hinge" aria-pressed="${!!S.fvHinge}">Петли на фасадах</button></div>
      <div class="seg" role="group" aria-label="Номера деталей"><button type="button" data-act="fv-pos" aria-pressed="${S.fvPos!==false}">Позиции</button></div></div>
      ${views.length===1?box(views[0]):views.map((v,i)=>`<details class="fv-mod" ${i===0?"open":""}><summary><b>${esc(v.title)}</b> <span class="muted mono">${v.size}</span></summary>${box(v)}</details>`).join("")}
      <div class="fv-tip">${tip}</div></details>`; }
  const fl=furnList(curFasteners());
  if(fl.length) h+=`<details class="plist" style="margin-bottom:12px"><summary>Фурнитура · ${fl.length} наим.</summary><div class="tablebox"><table><thead><tr><th>Наименование</th><th class="num">Кол-во</th></tr></thead><tbody>${fl.map(r=>`<tr><td>${esc(r.name)}</td><td class="num mono">${r.qty}</td></tr>`).join("")}</tbody></table></div></details>`;
  h+=`<details class="plist" ${S.listOpen?"open":""}><summary>Список деталей · ${S.current.parts.length}</summary>`;
  h+=`<div class="tablebox"><table><thead><tr><th>Код</th><th>Наименование</th><th>Поз.</th><th class="num">Д×Ш×Т, мм</th><th>Материал</th><th>Кромка</th><th class="num">Отв.</th><th>Этап</th></tr></thead><tbody>`;
  S.current.parts.forEach(p=>{ const st=STAGES[stageOf(p.code)];
    const ek=Object.keys(p.edges||{}); const edge= ek.length? ek.join(" ") : (p.edgesRaw&&p.edgesRaw.length? p.edgesRaw.length+" торц.":"—");
    h+=`<tr data-act="part" data-code="${esc(p.code)}"><td class="mono">${esc(p.code)}</td><td>${esc(p.name)}${p.copy?` <span class="muted">${esc(p.copy)}</span>`:""}</td><td>${esc(p.art)}</td>
      <td class="num mono">${fmt(p.L)}×${fmt(p.W)}×${fmt(p.T)}</td><td>${esc(p.material)}</td><td class="mono">${esc(edge)}</td><td class="num mono">${(p.holes||[]).length||"—"}</td>
      <td><span class="stage"><i style="background:${st.color}"></i>${st.name}</span></td></tr>`; });
  h+=`</tbody></table></div></details>`;
  return h;
}
function viewPart(){
  const p=withRules(partByCode(S.partCode));
  if(S.current.loading) return `<p class="muted">Загружаю деталь ${esc(S.partCode)}…</p>`;
  if(!p) return `<div class="empty"><h2>Деталь ${esc(S.partCode)} не найдена</h2><p class="muted">Проверьте код на этикетке. Код выглядит так: <code>Z0001-012</code>.</p><button class="btn" data-act="home">К заказам</button></div>`;
  const oid=orderIdOf(p.code), o=S.orders[oid]||{}, stage=stageOf(p.code), e=p.edges||{};
  const area=(p.L*p.W/1e6).toFixed(3).replace(".",",");
  let h=`<div class="part-view"><div class="part-top"><div><div class="eyebrow"><button class="btn sm" data-act="order" data-id="${esc(oid)}">← ${esc(o.name||oid)}</button></div>
    <div class="code" style="margin-top:12px">${esc(p.code)}</div><div class="part-name">${esc(p.name)}${p.copy?` <span class="muted">· ${esc(p.copy)}</span>`:""}</div></div>
    <div class="qr-box">${qrSvg(partUrl(p.code))}</div></div>`;
  if(S.current.parts.some(x=>x.box)&&p.box) h+=`<h2 style="margin-top:4px">Где стоит в изделии</h2>`+asmBlock("деталь подсвечена · нажмите на соседнюю, чтобы открыть");
  h+=`<div class="facts">
    <div class="fact"><b>Длина × ширина</b><span class="mono">${fmt(p.L)} × ${fmt(p.W)}</span></div>
    <div class="fact"><b>Толщина</b><span class="mono">${fmt(p.T)} мм</span></div>
    <div class="fact"><b>Материал</b><span>${esc(p.material||"—")}</span></div>
    <div class="fact"><b>Позиция в Базисе</b><span class="mono">${esc(p.art||"—")}</span></div>
    <div class="fact"><b>Площадь</b><span class="mono">${area} м²</span></div>
    <div class="fact"><b>Отверстий</b><span class="mono">${(p.holes||[]).length}</span></div></div>`;
  h+=`<h2>Этап</h2><div class="stages" role="group" aria-label="Этап производства">${STAGES.map((s,i)=>`<button type="button" data-act="stage" data-n="${i}" aria-pressed="${i===stage}" ${S.canWrite||S.demo?"":"disabled"}><i style="background:${s.color}"></i>${s.name}</button>`).join("")}</div>`;
  h+=`<div class="panels"><div class="card"><div class="card-head"><h2 style="margin:0">Присадка · вид на пласть A</h2>
      <div class="seg" role="group" aria-label="Способ простановки размеров"><button type="button" data-act="mode" data-m="base" aria-pressed="${S.mapMode==="base"}">От базы</button><button type="button" data-act="mode" data-m="chain" aria-pressed="${S.mapMode==="chain"}">Цепочкой</button></div></div>
      <div class="mapbox">${drillMap(p,S.mapMode)}</div>
      <p class="note">Сплошной круг — отверстие с пласти A, пунктир — с пласти B, пунктирный прямоугольник — в торце. Белый круг — сквозное.</p></div>
    <div class="card"><div class="card-head"><h2 style="margin:0">Деталь в 3D</h2><span class="note">тяните, чтобы повернуть</span></div><canvas id="three" aria-label="Трёхмерная модель детали"></canvas></div></div>`;
  h+=`<div class="cols"><div class="card"><h2>Кромка</h2><div class="edges-list">`;
  const raw=p.edgesRaw||[];
  if(raw.length){
    raw.forEach(r=> h+=`<div class="edge-row"><i></i><span><b class="mono">${fmt(r.t)} мм</b> · ${esc(r.m)} <span class="muted">· торец №${esc(r.elem)}</span></span></div>`);
    h+=`<p class="note">Сторона не определена: деталь не прямоугольная или выгружена старой версией скрипта.</p>`;
  }
  if(Object.keys(e).length || !raw.length) ["L1","L2","W1","W2"].forEach(k=> h+=`<div class="edge-row"><i class="${e[k]?"":"none"}"></i><span><b class="mono">${k}</b> ${SIDES[k]}: ${e[k]?`<b class="mono">${fmt(e[k].t)} мм</b> · ${esc(e[k].m)}`:'<span class="muted">без кромки</span>'}</span></div>`);
  h+=`</div></div><div class="card"><h2>Отверстия</h2>`;
  if(!(p.holes||[]).length) h+=`<p class="muted">Присадки нет.</p>`;
  else { const grp={}, rows=[];
    p.holes.forEach(x=>{ const k=[x.face,x.d,x.depth,x.name||"",x.note||"",x.approx?1:0].join("|"); if(!grp[k]){ grp[k]={...x,n:0}; rows.push(k); } grp[k].n++; });
    const fromBazis=p.holes.some(x=>x.name), anyApprox=p.holes.some(x=>x.approx);
    h+=`<div class="tablebox"><table><thead><tr><th>Грань</th>${fromBazis?"<th>Крепёж</th>":""}<th class="num">Ø</th><th class="num">Глубина</th><th class="num">Шт</th></tr></thead><tbody>`;
    rows.forEach(k=>{ const x=grp[k], f=x.face, through=+x.depth>=p.T&&(f==="A"||f==="B");
      h+=`<tr><td>${FACE_NAMES[f]||esc(f)}</td>${fromBazis?`<td>${esc(x.name)}${x.note?`<div class="note">${esc(x.note)}</div>`:""}</td>`:""}<td class="num mono">${x.approx?"≈":""}${fmt(x.d)}</td><td class="num mono">${through?"сквозное":(x.approx?"≈":"")+fmt(x.depth)}</td><td class="num mono">${x.n}</td></tr>`; });
    h+=`</tbody></table></div>`;
    if(anyApprox) h+=`<p class="note">≈ — для этого крепежа нет правила, размер взят по габариту из Базиса. Правила настраиваются во вкладке «Импорт из Базиса».</p>`; }
  h+=`</div></div>`;
  h+=`</div>`;
  return h;
}

    <p class="note" style="margin-top:0">QR на этикетке открывает эту ссылку с кодом детали. Вставьте ссылку на это приложение из кнопки «Поделиться».</p>

    <label>Клиент<input id="impClient" value=""></label></div>
    <p class="muted">Файл: ${esc(d.file)} · текстур ${Object.keys(d.textures||{}).length} · строк ${d.parts.length} · деталей с учётом количества ${d.parts.reduce((a,p)=>a+(p.qty||1),0)}</p>
    <div class="tablebox" style="max-height:340px;overflow:auto"><table><thead><tr><th>Наименование</th><th>Поз.</th><th class="num">Кол.</th><th class="num">Д×Ш×Т</th><th>Материал</th><th>Кромка</th></tr></thead><tbody>
    ${d.parts.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.art)}</td><td class="num mono">${p.qty||1}</td><td class="num mono">${fmt(p.L)}×${fmt(p.W)}×${fmt(p.T)}</td><td>${esc(p.material)}</td><td class="mono">${Object.keys(p.edges||{}).join(" ")||(p.edgesRaw&&p.edgesRaw.length?p.edgesRaw.length+" торц.":"—")}</td></tr>`).join("")}
    </tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn primary" data-act="imp-save">Загрузить в базу</button><button class="btn" data-act="imp-cancel">Отмена</button></div></div>`;

function rulesEditor(){
  const list=S.rulesDraft||rules().map(r=>({...r}));
  const inp=(i,f,v,w,ph)=>`<input id="r${i}-${f}" value="${esc(v)}" placeholder="${ph||""}" style="width:${w}" aria-label="${f}">`;
  let h=`<div class="card" style="margin-bottom:16px"><h2>Правила присадки</h2>
    <p class="note" style="margin-top:0">Базис отдаёт крепёж, а не отверстия. Правило говорит, что сверлить для крепежа: по части названия, месту (пласть или торец) и глубине по модели. Пустое поле — как в модели, «T» — сквозное. «Смещения по длине» превращают одно место крепежа в несколько отверстий (например −16 и 16 — два отверстия с шагом 32), «От края» ставит отверстия на заданном расстоянии от ближайшей длинной кромки.</p>
    <div class="tablebox"><table><thead><tr><th>Название содержит</th><th>Где</th><th>Глубина в модели от</th><th>до</th><th>Ø</th><th>Глубина</th><th>Смещения по длине</th><th>От края</th><th>Пометка для станочника</th><th></th></tr></thead><tbody>`;
  list.forEach((r,i)=>{ h+=`<tr style="cursor:default"><td>${inp(i,"match",r.match,"130px")}</td>
    <td><select id="r${i}-place" aria-label="Где">${[["face","пласть"],["edge","торец"],["any","любое"]].map(([v,t])=>`<option value="${v}" ${r.place===v?"selected":""}>${t}</option>`).join("")}</select></td>
    <td>${inp(i,"from",r.from,"60px")}</td><td>${inp(i,"to",r.to,"60px")}</td><td>${inp(i,"d",r.d,"56px")}</td><td>${inp(i,"depth",r.depth,"60px")}</td><td>${inp(i,"dx",r.dx||"","90px","-16,16")}</td><td>${inp(i,"edge",r.edge||"","56px")}</td><td>${inp(i,"note",r.note,"220px")}</td>
    <td><button class="btn sm danger" data-act="rule-del" data-i="${i}" aria-label="Удалить правило">✕</button></td></tr>`; });
  h+=`</tbody></table></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn primary" data-act="rules-save">Сохранить правила</button><button class="btn" data-act="rule-add">Добавить правило</button>${S.rulesDraft?`<button class="btn" data-act="rules-reset">Отменить изменения</button>`:""}</div></div>`;
  return h;
}
function allMaterials(){
  const set=new Set(Object.keys(S.textures));
  Object.values(S.orders).forEach(o=>(o.materials||[]).forEach(m=>set.add(m)));
  S.current.parts.forEach(p=>p.material&&set.add(p.material));
  return [...set].sort((a,b)=>a.localeCompare(b,"ru"));
}
function texturesEditor(){
  const mats=allMaterials();
  let h=`<div class="card" style="margin-bottom:16px"><h2>Текстуры материалов</h2>
    <p class="note" style="margin-top:0">Картинка для 3D. Скрипт подбирает её сам из папки «Документы\\Bazis\\#_Текстуры материалов»; если подобрал не ту или не нашёл, выберите файл вручную. Текстура применяется во всех заказах с этим материалом.</p>`;
  if(!mats.length) return h+`<p class="muted">Материалы появятся после первого импорта заказа.</p></div>`;
  h+=`<div class="tex-list">`;
  mats.forEach((m,i)=>{ const d=S.textures[m];
    h+=`<div class="tex-row"><span class="tex-thumb" style="${d?`background-image:url('${d}')`:`background:#${matColor(m).toString(16).padStart(6,"0")}`}"></span>
      <span class="tex-name">${esc(m)}<small>${d?"текстура загружена":"нет текстуры, показывается цветом"}</small></span>
      <span class="tex-act"><label class="btn sm" for="tex${i}">${d?"Заменить":"Выбрать картинку"}</label><input type="file" id="tex${i}" data-texname="${esc(m)}" accept="image/*" hidden>
      ${d?`<button class="btn sm danger" data-act="tex-del" data-name="${esc(m)}">Убрать</button>`:""}</span></div>`; });
  return h+`</div></div>`;
}
function readRulesForm(){
  const list=[]; let i=0;
  while(document.getElementById("r"+i+"-match")){ const g=f=>document.getElementById("r"+i+"-"+f).value.trim();
    list.push({match:g("match"),place:g("place"),from:g("from"),to:g("to"),d:g("d"),depth:g("depth"),dx:g("dx"),edge:g("edge"),note:g("note")}); i++; }
  return list;
}
function viewHelp(){
  return `<div class="head"><div><div class="eyebrow">Как работать</div><h1>Проект в 3D по QR</h1></div></div>

/* ---------- закрытые проекты: заказ открывается только по своей QR-ссылке (ключ в ссылке после «~») ---------- */
const T3K="t3d-keys";
const _ks=(()=>{ try{ return JSON.parse(localStorage.getItem(T3K)||"{}")||{}; }catch(_){ return {}; } })();
if(!_ks.orders) _ks.orders={};
function keySave(){ try{ localStorage.setItem(T3K,JSON.stringify(_ks)); }catch(_){} }
function siteIsAdmin(){ return !!_ks.master; }
keyFor=code=>{ const c=String(code||"").toUpperCase(), oid=/-\d+$/.test(c)?orderIdOf(c):c; const o=_ks.orders[oid]; return (o&&o.k)||""; };
// «#4444~ключ», «#4444-012~ключ», «#admin~ключ»: ключ запоминаем на этом телефоне, из адресной строки убираем
hashHook=h=>{ h=String(h||""); const m=/^(.*?)~([A-Za-z0-9_-]{20,})$/.exec(h); if(!m) return h;
  const id=m[1].toUpperCase(), k=m[2];
  if(id==="ADMIN"){ _ks.master=k; keySave(); history.replaceState(null,"",location.pathname+location.search); return ""; }
  const oid=/-\d+$/.test(id)?orderIdOf(id):id; _ks.orders[oid]=Object.assign(_ks.orders[oid]||{},{k}); keySave();
  history.replaceState(null,"","#"+m[1]); return m[1]; };
const b64u=s=>{ s=String(s).replace(/-/g,"+").replace(/_/g,"/"); s+="=".repeat((4-s.length%4)%4); return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); };
async function decryptText(obj,key){
  const k=await crypto.subtle.importKey("raw",b64u(key),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u(obj.iv)},k,b64u(obj.ct));
  return new TextDecoder().decode(pt).replace(/^﻿/,"");
}
// список заказов: технолог видит все, мастер или клиент — только те, что открывал по QR
async function siteLoadIndex(){
  let j=null;
  try{ const r=await fetch("orders/index.json",{cache:"no-cache"}); if(r.ok) j=await r.json(); }catch(_){}
  if(j&&j.ct){
    if(_ks.master){ try{ j=JSON.parse(await decryptText(j,_ks.master)); }catch(_){ j=null; toast("Ссылка технолога устарела — откройте новую из файла «Технолог 3D — ссылки.txt»"); } }
    else j=null;
    if(j) (j.orders||[]).forEach(o=>{ if(o&&o.id&&o.k){ const id=String(o.id).toUpperCase(); _ks.orders[id]=Object.assign(_ks.orders[id]||{},{k:o.k,name:o.name,count:o.count}); } });
    keySave();
  }
  S.orders={};
  if(j) (j.orders||[]).forEach(o=>{ if(o&&o.id){ const c={...o}; delete c.k; S.orders[o.id]={...c, createdAt:o.exportedAt||o.createdAt||""}; } });
  else Object.keys(_ks.orders).forEach(id=>{ const o=_ks.orders[id]; if(o&&o.k&&o.name) S.orders[id]={id,name:o.name,count:o.count||0,createdAt:o.at||""}; });
}
// чужой заказ без ключа не открыть
async function siteOrderText(oid,txt){
  let obj=null; try{ obj=JSON.parse(txt.replace(/^﻿/,"")); }catch(_){ return txt; }
  if(!obj||!obj.ct) return txt;
  const k=keyFor(oid); if(!k){ const e=new Error("locked"); e.locked=true; throw e; }
  try{ return await decryptText(obj,k); }catch(_){ const e=new Error("locked"); e.locked=true; throw e; }
}
function siteRememberOrder(oid,res,count){

}

document.addEventListener("keydown", ev=>{ if(ev.key==="Escape"){ const fb=document.querySelector(".fv-box.full"); if(fb){ fb.classList.remove("full"); document.body.classList.remove("has-full"); const b=fb.querySelector('[data-z="full"]'); if(b) b.textContent="⛶"; } const qm=document.getElementById("qrModal"); if(qm) qm.remove(); const f=document.querySelector(".asm.full"); if(f){ f.classList.remove("full"); document.body.classList.remove("has-full"); } } });
window.addEventListener("hashchange", ()=>{ const raw=location.hash.slice(1), h=hashHook(raw); if(!h) return; if(raw.indexOf("~")>0){ S.current.orderId=null; S.partCode=null; }   /* пришла ссылка с ключом — открыть заново */ if(/-\d+$/.test(h)){ if(h!==S.partCode) goPart(h); } else if(/^[A-Za-z0-9]{2,12}$/.test(h)&&(S.view!=="order"||h.toUpperCase()!==S.current.orderId||S.current.missing)) goOrder(h); });

/* ---------- запуск ---------- */
render();
(async function boot(){
  S.static=true; S.demo=false; S.canEdit=false;
  S.config.url=location.origin+location.pathname;
  S.site={};
  try{ const r=await fetch("config.json",{cache:"no-cache"}); if(r.ok) S.site=(await r.json())||{}; }catch(e){}
  S.canWrite=!!S.site.stagesUrl;
  try{ S.who=localStorage.getItem("cehqr-who")||""; S.pin=localStorage.getItem("cehqr-pin")||""; }catch(e){ S.who=""; S.pin=""; }
  const h0=hashHook(location.hash.slice(1));   // ключ из QR-ссылки запоминаем до загрузки списка
  try{ await siteLoadIndex(); }catch(e){ /* список заказов не обязателен — заказ откроется по ссылке */ }
  siteLoadProgress(null);
  setInterval(()=>{ if(document.visibilityState==="visible") siteLoadProgress(S.view==="orders"?null:S.current.orderId); }, 30000);
  const h=location.hash.slice(1);
  if(h && /-\d+$/.test(h)) goPart(h); else if(h && /^[A-Za-z0-9]{2,12}$/.test(h)) goOrder(h); else render();
})();
})();
</script>
<script>
/* ---------- приложение на телефоне (PWA): значок на экране, работа без интернета ---------- */
(function(){
  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) navigator.serviceWorker.register("sw.js").catch(()=>{});
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  if(standalone){ document.documentElement.classList.add("pwa"); return; }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  let deferred=null;
  const btn=document.createElement("button"); btn.type="button"; btn.className="btn install-btn"; btn.hidden=true;
  btn.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Установить</span>';
  btn.title="Установить «Технолог 3D» на телефон как приложение";
  const role=document.getElementById("role"); if(role) role.before(btn);
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; btn.hidden=false; });
  window.addEventListener("appinstalled",()=>{ btn.hidden=true; toast("Готово: «Технолог 3D» на главном экране"); });
  if(ios) btn.hidden=false;
  btn.addEventListener("click",async()=>{
    if(deferred){ deferred.prompt(); try{ await deferred.userChoice; }catch(_){} deferred=null; btn.hidden=true; return; }
    const m=document.createElement("div"); m.className="modal"; m.id="qrModal";
    m.innerHTML=`<div class="modal-card" role="dialog" aria-label="Установка приложения"><h2 style="margin:0 0 8px">Установить «Технолог 3D»</h2>
      ${ios?`<ol class="inst"><li>Нажмите кнопку <b>Поделиться</b> <svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 11v9h14v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> внизу Safari.</li><li>Выберите <b>«На экран „Домой“»</b>.</li><li>Нажмите <b>«Добавить»</b> — значок появится на главном экране.</li></ol><p class="note">Открывайте сайт именно в Safari: в других браузерах на iPhone этой кнопки может не быть.</p>`
          :`<ol class="inst"><li>Откройте меню браузера <b>⋮</b> (справа вверху).</li><li>Выберите <b>«Установить приложение»</b> или <b>«Добавить на главный экран»</b>.</li></ol>`}
      <p class="note">Приложение открывается на весь экран, а уже открытые заказы видны и без интернета. Обновляется само.</p>
      <button class="btn primary" data-act="qr-close" style="margin-top:8px">Понятно</button></div>`;
    m.addEventListener("click",ev=>{ if(ev.target===m||ev.target.closest('[data-act="qr-close"]')) m.remove(); });
    document.body.appendChild(m);
  });
})();

</script>
</body></html>
