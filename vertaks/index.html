<style>
/* Layout: рабочий инструмент цеха — узкая колонка с крупными целями нажатия; номер детали и размеры набраны моноширинным, как на этикетке */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --sunk:#eae8e2; --line:#d9d6cd; --ink:#1d1f1e; --muted:#6a6c66;
  --accent:#0f6b63; --accent-ink:#ffffff; --accent-soft:#dcece9;
  --edge:#c98a1b; --edge-soft:#f5e6c8; --hole:#26302e; --hole-b:#7a8582;
  --ok:#2f7d32; --warn:#a86a00; --bad:#b3261e;
  --board:#efe4cf; --board-line:#b9a983;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151716; --surface:#1d201f; --sunk:#252928; --line:#343a38; --ink:#e9ebe7; --muted:#9aa19c;
  --accent:#4fb8ab; --accent-ink:#0b1a18; --accent-soft:#1d3532;
  --edge:#e0a744; --edge-soft:#3a2f1a; --hole:#dfe5e2; --hole-b:#8c9894;
  --ok:#6cc070; --warn:#e2a93b; --bad:#ef7a70;
  --board:#3a3326; --board-line:#7d6c4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151716; --surface:#1d201f; --sunk:#252928; --line:#343a38; --ink:#e9ebe7; --muted:#9aa19c;
  --accent:#4fb8ab; --accent-ink:#0b1a18; --accent-soft:#1d3532;
  --edge:#e0a744; --edge-soft:#3a2f1a; --hole:#dfe5e2; --hole-b:#8c9894;
  --ok:#6cc070; --warn:#e2a93b; --bad:#ef7a70;
  --board:#3a3326; --board-line:#7d6c4b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.01em;cursor:pointer;background:none;border:0;padding:4px 0}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.brand-mark svg{display:block}
.find{flex:1 1 260px;display:flex;gap:6px;min-width:0}
.find input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-family:var(--f-mono);letter-spacing:.03em}
.find input:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.role{font-size:12px;color:var(--muted);padding:4px 8px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}

.nav{display:flex;gap:4px;margin-block:16px 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.nav button{background:none;border:0;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}

h1{font-size:26px;line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:17px;margin:0 0 10px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px;margin-bottom:16px}
.banner.warn{background:var(--edge-soft)}

/* orders */
.orders{display:grid;gap:10px}
.order{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;width:100%}
.order:hover{border-color:var(--muted)}
.order-name{font-weight:600;min-width:0}
.order-meta{font-size:13px;color:var(--muted)}
.order .bar{grid-column:1/-1}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--edge-soft);color:var(--ink);font-weight:600;letter-spacing:.02em}

/* order page */
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);letter-spacing:.02em}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.stage i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* part page */
.part-top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;margin-bottom:18px}
.code{font-family:var(--f-mono);font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1}
.part-name{font-size:19px;font-weight:600;margin-top:6px}
.qr-box{background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line);width:104px}
.qr-box svg{display:block;width:100%;height:auto}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.fact{background:var(--surface);padding:10px 14px;min-width:0}
.fact b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.fact span{font-weight:600;overflow-wrap:anywhere}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.stages button{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.stages button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stages button i{width:9px;height:9px;border-radius:50%;display:inline-block}
.panels{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.mapbox{overflow-x:auto}
.fac-it{padding:10px 0;border-top:1px solid var(--line)}.fac-it .mapbox svg{width:100%;height:auto;min-width:0;max-width:720px}
.mapbox svg{display:block;width:100%;height:auto;min-width:420px}
.fv-box{position:relative;overflow:hidden;border-radius:10px}
.fv-box svg{min-width:0;cursor:grab;touch-action:pan-y;user-select:none}
.fv-box.zoomed.full svg{touch-action:none}
.fv-box svg.grab{cursor:grabbing}
.fv-zoom{position:absolute;right:8px;top:8px;display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--glass,rgba(255,255,255,.85));box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.fv-zoom button{border:0;background:transparent;border-radius:8px;min-width:34px;height:32px;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer}
.fv-zoom button:hover{background:var(--sunk)}
.fv-tip{font-size:12px;color:var(--muted);margin:6px 2px 0}
body.client #findForm{display:none}
.cl-head{margin:4px 0 12px}.cl-head h1{margin:0 0 2px;font-size:24px}.cl-head .muted{font-size:14px}
body.client .asm canvas{height:min(52vh,520px)}
.cl-mats{display:grid;gap:8px;margin:12px 0 4px}
.cl-mr{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;align-items:start}
.cl-rl{font-size:13px;color:var(--muted);padding-top:7px}
.cl-chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.cl-m{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13.5px;max-width:100%;min-width:0;border-radius:16px}
.cl-m b{font-weight:600;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.cl-sw,.cl-m .cat-sw{width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--line);background-size:cover;background-position:center}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.ocard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.ocard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.oc-pic{position:relative;aspect-ratio:16/10;background:radial-gradient(120% 90% at 50% 30%,#f4f6f4 0%,#dfe3e0 100%);display:grid;place-items:center}
.oc-pic img{width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:multiply}
.oc-wait{font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.oc-qr{position:absolute;right:10px;bottom:10px;width:58px;height:58px;padding:3px;border:0;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);cursor:pointer}
.oc-qr svg{width:100%;height:100%;display:block}
.oc-b{padding:12px 14px 14px;display:grid;gap:4px}
.oc-name{font-weight:700;font-size:16px;line-height:1.25}
.oc-meta{font-size:13px;color:var(--muted)}
.oc-st{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.oc-st .bar{margin:0}
body:not([data-page="order"]):not([data-page="part"]) #findForm{display:none}
.role:empty{display:none}
body.anon #nav{display:none}
body.anon #view{padding-top:18px}
#nav .nav-help{display:none}
body[data-page="help"] #nav .nav-help{display:inline-flex}
.home-foot{margin:28px 0 8px;display:flex;gap:10px;justify-content:center;align-items:center;color:var(--muted);font-size:14px}
.linkbtn{border:0;background:none;padding:6px 2px;font:inherit;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--ink)}
.scan-seg{margin:8px 0;flex-wrap:wrap}
.scan-cam{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-height:46vh;margin:0 auto;width:100%}
.scan-cam video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:18% 22%;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.25);pointer-events:none}
.scan-note{position:absolute;left:12px;right:12px;bottom:10px;margin:0;color:#fff;font-size:14px;text-align:center}
.scan-note:empty{display:none}
.scan-last{margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:15px;min-height:22px}
.scan-last.ok{background:#e3f4ea;color:#14532d}.scan-last.bad{background:#fde8e8;color:#8a1c1c}
.scan-man{display:flex;gap:8px;margin:0 0 12px}.scan-man input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--surface);color:var(--ink)}
.scan-prog .bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 12px}.scan-prog .bar span{display:block;height:100%}
.scan-ok{padding:12px;border-radius:12px;background:#e3f4ea;color:#14532d}
.scan-mode{margin:6px 0 0}.scan-cam.num .scan-frame{inset:35% 20%}
.scan-sug{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;padding:12px 14px;border-radius:12px;border:2px solid var(--accent);background:var(--surface)}
.scan-sug .btn{padding:12px 16px;font-size:16px}
.scan-mod{margin:0 0 10px}.scan-mod ul{list-style:none;margin:4px 0 0;padding:0}.scan-mod li{padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.work-rate{width:88px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-family:var(--f-mono);text-align:right;background:var(--surface);color:var(--ink)}
.work-t tfoot td{border-top:2px solid var(--line)}
@media (max-width:600px){.work-t thead{display:none}.work-t,.work-t tbody,.work-t tfoot{display:block}.work-t tr{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:4px 12px;padding:9px 2px;border-bottom:1px solid var(--line)}.work-t td{border:0!important;padding:0!important}.work-t tbody td:first-child{grid-column:1/-1;font-weight:600}.work-t tfoot tr{grid-template-columns:1fr auto;border:0}}
.fv-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 18px;padding:14px 16px;font-size:16px}
.fv-btn .fv-ic{font-size:24px}
.fv-btn small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
.fv-win{position:fixed;inset:0;z-index:30;background:var(--bg,var(--surface));display:flex;flex-direction:column}
.fv-wbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.fv-wbar h2{flex:1;margin:0;font-size:17px}
.fv-x{border:0;background:var(--sunk);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer}
.fv-wbody{flex:1;overflow:auto;padding:4px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.fv-win .fv-box:not(.full) svg{display:block;width:100%;height:auto;max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px)}
body.fv-on{overflow:hidden}
.fv-mod{border-top:1px solid var(--line);padding:8px 0}
.fv-mod>summary{cursor:pointer;padding:6px 2px;font-size:15px}
.fv-mod>summary .muted{font-size:13px;margin-left:6px}
.asm{position:relative;margin-bottom:18px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--sunk),var(--bg))}
.asm canvas{display:block;width:100%;height:min(62vh,560px);touch-action:none;cursor:grab}
/* 3D забирает все жесты пальцами (как в приложениях 3D): страница листается касанием выше или ниже модели */
@media (max-width:720px){body .asm:not(.full) canvas{height:min(50vh,480px)}}
.asm-tools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.asm-tools button{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;font-weight:500}
.asm-tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.asm-pick{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.asm-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.asm-labels span{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:11px;font-weight:600;line-height:1;padding:3px 5px;border-radius:4px;background:rgba(255,255,255,.88);color:#1d1f1e;white-space:nowrap;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.asm-labels span.sel{background:var(--accent);color:var(--accent-ink)}
.asm-labels b.pos{position:absolute;transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 4px;box-sizing:border-box;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10.5px;font-weight:700;line-height:1;background:#fff;color:#1d1f1e;border:1.3px solid #1d1f1e;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.asm-labels .meas{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:2px;font-family:var(--f-mono);font-size:12.5px;font-weight:700;line-height:1;padding:4px 4px 4px 7px;border-radius:7px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:auto}
.asm-labels .meas.pre{opacity:.75;padding-right:7px}

/* ================= Технолог 3D — фирменный вид «рабочий лист» =================
   Графитовая шапка как планшет технолога; жёлтая рулетка — знак и главное действие;
   синий карандаш — размеры на чертежах; под 3D и чертежами — миллиметровка;
   шапка заказа оформлена как штамп чертежа. */
:root{
  --bg:#e1e3e0; --surface:#f7f8f6; --sunk:#d8dbd7; --line:#cfd3ce; --ink:#1e2226; --muted:#5d636a;

  --tape:#ffc21a; --tape-ink:#1e2226; --graphite:#1e2226; --graphite-2:#2b3036;
  --grid:rgba(29,95,180,.07); --grid-b:rgba(29,95,180,.13);
  --edge:#b5651d; --edge-soft:#f3e2d0;
  --board:#f1e7d4; --board-line:#b49b70;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --f-brand:"Unbounded","Golos Text",system-ui,sans-serif;
  --r:8px; --glass:rgba(255,255,255,.92);
  --shadow:0 1px 0 rgba(30,34,38,.06),0 2px 8px rgba(30,34,38,.06);

  --accent:#6ea8ef; --accent-ink:#0d1620; --accent-soft:#1d2a3a;
  --graphite:#0f1214; --graphite-2:#1b1f23; --grid:rgba(110,168,239,.06); --grid-b:rgba(110,168,239,.11);
  --edge:#d9934f; --edge-soft:#3a2b1d; --board:#3a3326; --board-line:#7d6c4b; --glass:rgba(30,34,38,.92)}}

/* кнопки: главное действие — жёлтая, как рулетка */
.btn{border-radius:var(--r);font-weight:600}
.btn.primary{background:var(--tape);color:var(--tape-ink);border-color:var(--tape);box-shadow:0 1px 0 rgba(0,0,0,.12)}

/* вкладки */

.nav button[aria-current="true"]{color:var(--ink);border-bottom:3px solid var(--tape);margin-bottom:-1.5px}

/* список заказов — листы с кромкой слева */
.order{border-radius:var(--r);border:1px solid var(--line);box-shadow:none;border-left:5px solid var(--edge)}

/* шапка заказа — штамп чертежа */

.tblock>div{padding:8px 12px;border-left:1px solid var(--ink);min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tblock>.tb-name{border-left:0}

.tblock h1{font-size:22px;line-height:1.15}
.tblock b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tblock .tb-act{grid-column:1/-1;border-left:0;border-top:1px solid var(--ink);flex-direction:row;flex-wrap:wrap;gap:8px;justify-content:flex-start;padding:8px}
@media (max-width:720px){
  .tblock{grid-template-columns:auto auto minmax(0,1fr)}
  .tblock>.tb-name{grid-column:1/-1;border-bottom:1px solid var(--ink)}

}
.bar{height:6px;border-radius:0}

<script>
(function(){
"use strict";

/* ---------- справочники ---------- */
const STAGES = [
  {name:"Ожидает",  color:"var(--line)"},
  {name:"Распил",   color:"#8a6fd1"},
  {name:"Кромка",   color:"var(--edge)"},
  {name:"Присадка", color:"#3b82c4"},
  {name:"Сборка",   color:"#0f8a7a"},
  {name:"Упаковано",color:"var(--ok)"}
];
const SIDES = {L1:"Длинная, базовая (Д1)", L2:"Длинная (Д2)", W1:"Короткая, базовая (Ш1)", W2:"Короткая (Ш2)"};
const FACE_NAMES = {A:"Пласть A (лицо)", B:"Пласть B", L1:"Торец Д1", L2:"Торец Д2", W1:"Торец Ш1", W2:"Торец Ш2"};
/* Правила присадки: крепёж из Базиса → реальные отверстия.
   match — часть названия крепежа; place — пласть/торец; from/to — глубина по модели, мм;
   d, depth — что сверлить ("" = как в модели, "T" = сквозное). */
const DEFAULT_RULES = [
  {match:"петля", place:"face", from:"11", to:"", d:"35", depth:"12.5", dx:"", edge:"", note:"чашка петли"},
  {match:"петля", place:"face", from:"", to:"11", d:"5", depth:"12", dx:"-16,16", edge:"37", note:"ответная планка: 2 отв., шаг 32, 37 от края"},
  {match:"евровинт", place:"face", from:"", to:"", d:"7", depth:"T", dx:"", edge:"", note:"конфирмат, сквозное"},
  {match:"евровинт", place:"edge", from:"", to:"", d:"5", depth:"", dx:"", edge:"", note:"конфирмат в торец"},
  {match:"конфирмат", place:"face", from:"", to:"", d:"7", depth:"T", dx:"", edge:"", note:"конфирмат, сквозное"},
  {match:"конфирмат", place:"edge", from:"", to:"", d:"5", depth:"", dx:"", edge:"", note:"конфирмат в торец"},
  {match:"шкант", place:"face", from:"", to:"", d:"8", depth:"12", dx:"", edge:"", note:"шкант в пласть"},
  {match:"шкант", place:"edge", from:"", to:"", d:"8", depth:"30", dx:"", edge:"", note:"шкант в торец"},
  {match:"эксцентрик", place:"face", from:"", to:"", d:"15", depth:"13", dx:"", edge:"", note:"эксцентрик (минификс)"},
  {match:"эксцентрик", place:"edge", from:"", to:"", d:"8", depth:"34", dx:"", edge:"", note:"стяжка эксцентрика в торец"},
  {match:"минификс", place:"face", from:"", to:"", d:"15", depth:"13", dx:"", edge:"", note:"минификс"},
  {match:"минификс", place:"edge", from:"", to:"", d:"8", depth:"34", dx:"", edge:"", note:"стяжка минификса в торец"},
  {match:"полкодерж", place:"face", from:"", to:"", d:"5", depth:"12", dx:"", edge:"", note:"полкодержатель"}
];
function rules(){ return (S.config.rules && Array.isArray(S.config.rules.list)) ? S.config.rules.list : DEFAULT_RULES; }
function cleanName(n){ return String(n||"").split(/[\r\n]/)[0].replace(/\s+/g," ").trim(); }
function ruleFor(h){
  if(!h.name) return null;
  const nm=cleanName(h.name).toLowerCase(), place=(h.face==="A"||h.face==="B")?"face":"edge";
  return rules().find(r=> r.match && nm.includes(String(r.match).toLowerCase()) && (r.place==="any"||r.place===place)
    && (r.from===""||r.from==null||h.depth>=+String(r.from).replace(",","."))
    && (r.to===""||r.to==null||h.depth<+String(r.to).replace(",","."))) || null;
}
const num_=v=>+String(v).replace(",",".");
function effHoles(p){
  const out=[];
  (p.holes||[]).forEach(h=>{
    const r=ruleFor(h), o={...h, name:cleanName(h.name), approx:!!h.name&&!r, note:r?r.note||"":""};
    if(r){ if(r.d!==""&&r.d!=null) o.d=num_(r.d);
      if(r.depth==="T") o.depth=p.T; else if(r.depth!==""&&r.depth!=null) o.depth=num_(r.depth);
      const face=o.face==="A"||o.face==="B";
      // отступ от ближайшего длинного края (Д1 или Д2)
      if(face&&r.edge!==""&&r.edge!=null&&isFinite(num_(r.edge))){ const ed=num_(r.edge); o.y=o.y<=p.W/2?ed:p.W-ed; }
      // несколько отверстий со смещением вдоль длины детали
      const dx=String(r.dx||"").split(/[;,\s]+/).map(num_).filter(v=>isFinite(v)&&String(v)!=="");
      if(face&&dx.length&&String(r.dx).trim()!==""){ dx.forEach(d=>out.push({...o, x:o.x+d})); return; }
    }
    out.push(o);
  });
  return out;
}
function withRules(p){ return p ? {...p, holes:effHoles(p)} : p; }

/* Пример заказа: показывается до первой загрузки и в демо-режиме */
const EX_MAT = "ЛДСП Egger W1000 Белый";
const E2 = {m:"ПВХ 2 мм Белый", t:2}, E04 = {m:"ПВХ 0,4 мм Белый", t:0.4};
function confHoles(xs){ const h=[]; xs.forEach(x=>[50,280,510].forEach(y=>h.push({face:"A",x,y,d:7,depth:16}))); return h; }
function shelfHoles(){ const h=[]; [700,732,764,1100,1132,1164].forEach(x=>[37,523].forEach(y=>h.push({face:"A",x,y,d:5,depth:12}))); return h; }
function endHoles(){ const h=[]; ["W1","W2"].forEach(s=>[50,280,510].forEach(y=>h.push({face:s,x:s==="W1"?0:1168,y,d:5,depth:60}))); return h; }
const EXAMPLE = {
  order:{id:"P0001", name:"Пример: шкаф распашной 1200", client:"Образец данных", example:true},
  parts:[
    {name:"Боковина левая", art:"1", L:2100, W:560, T:16, material:EX_MAT, edges:{L1:E2,W1:E04,W2:E04}, holes:confHoles([8,2092]).concat(shelfHoles())},
    {name:"Боковина правая", art:"2", L:2100, W:560, T:16, material:EX_MAT, edges:{L1:E2,W1:E04,W2:E04}, holes:confHoles([8,2092]).concat(shelfHoles())},
    {name:"Крышка", art:"3", L:1168, W:560, T:16, material:EX_MAT, edges:{L1:E2,W1:E04,W2:E04}, holes:endHoles()},
    {name:"Дно", art:"4", L:1168, W:560, T:16, material:EX_MAT, edges:{L1:E2}, holes:endHoles()},
    {name:"Полка", art:"5", L:1164, W:540, T:16, material:EX_MAT, edges:{L1:E2}, holes:[]},
    {name:"Задняя стенка", art:"6", L:2096, W:1196, T:3.2, material:"ХДФ Белый 3,2", edges:{}, holes:[]},
    {name:"Дверь", art:"7", qty:2, L:2096, W:596, T:16, material:EX_MAT, edges:{L1:E2,L2:E2,W1:E2,W2:E2},
      holes:[100,1048,1996].map(x=>({face:"B",x,y:22.5,d:35,depth:12.5}))}
  ]
};

/* ---------- состояние ---------- */
try{ var __fv=localStorage.getItem("cehqr-fv"), __fvw=localStorage.getItem("cehqr-fvw"), __fvp=localStorage.getItem("cehqr-fvp"), __fvg=localStorage.getItem("cehqr-fvg"); }catch(_){ var __fv=null, __fvw=null, __fvp=null, __fvg=null; }
const S = {
  db:null, user:null, downloads:null, demo:false, canEdit:false, canWrite:false,
  orders:{}, progress:{}, config:{}, textures:{},
  current:{orderId:null, parts:[], unsub:null},
  view:"orders", fvMode:__fv||"mid", fvWire:__fvw!=="0", fvPos:__fvp!=="0", measMid:(()=>{ try{ return localStorage.getItem("cehqr-mmid")!=="0"; }catch(_){ return true; } })(), fvGap:__fvg==="1", partCode:null, mapMode:"base", importDraft:null, confirmDelete:false
};
const $ = s => document.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => { const v=Math.round(Number(n)*10)/10; return String(v).replace(".",","); };
const pad = (n,w) => String(n).padStart(w,"0");

// вибрация: Android — navigator.vibrate; iPhone (iOS 18+) — системный переключатель даёт короткий отклик
function hapticOn(){ try{ return localStorage.getItem("cehqr-haptic")!=="0"; }catch(_){ return true; } }
function haptic(kind){ if(!hapticOn()) return; const now=Date.now(); if(haptic._t&&now-haptic._t<60&&kind==="tap") return; haptic._t=now;
  const ms={tap:8,sel:12,long:22,ok:[14,60,14],err:[45,60,45]}[kind]||8;
  try{ if(navigator.vibrate&&navigator.vibrate(ms)) return; }catch(_){}
  try{ if(!haptic.l){ const l=document.createElement("label"); l.setAttribute("aria-hidden","true"); l.style.cssText="position:fixed;left:-99px;top:-99px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none";
      l.innerHTML='<input type="checkbox" switch tabindex="-1">'; document.body.appendChild(l); haptic.l=l; }
    haptic.l.click(); if(kind==="ok"||kind==="err") setTimeout(()=>{ try{ haptic.l.click(); }catch(_){} },90); }catch(_){} }
function toast(msg){ try{ if(/не удалось|ошибк|нет связи|не сохран|не отправ|не принят|не похоже/i.test(msg)) haptic("err"); else if(/скопирован|сохранён|отправлен|привязан|готово|добавлен/i.test(msg)) haptic("ok"); }catch(_){}
  const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3200); }

/* ---------- данные: разворот заказа в список деталей с кодами ---------- */
function expandParts(orderId, list){
  const out=[]; let n=0;
  list.forEach(p=>{
    const q=Math.max(1,Math.min(500,parseInt(p.qty||1,10)||1));
    for(let i=0;i<q;i++){
      n++;
      out.push({
        code: orderId+"-"+pad(n,3),
        name:p.name||"Деталь", art:p.art||"", L:+p.L||0, W:+p.W||0, T:+p.T||0,
        material:p.material||"", edges:p.edges||{}, edgesRaw:p.edgesRaw||[],
        holes:Array.isArray(p.holes)?p.holes:[], shape:Array.isArray(p.shape)&&p.shape.length?p.shape:null, cuts:Array.isArray(p.cuts)&&p.cuts.length?p.cuts:null, frame:Array.isArray(p.frame)&&p.frame.length===9?p.frame.map(Number):null, box:p.box||null, grain:p.grain||null, mod:p.mod||"", copy: q>1 ? (i+1)+" из "+q : ""
      });
    }
  });
  return out;
}
function orderIdOf(code){ const i=code.lastIndexOf("-"); return i>0?code.slice(0,i):null; }
function partByCode(code){ return S.current.parts.find(p=>p.code===code)||null; }
const isWall=p=>/^\s*стена/i.test(String(p&&p.material||""));   // стены комнаты: только в 3D, не деталь
function cutParts(){ return (S.current.parts||[]).filter(p=>!isWall(p)); }
function stageOf(code){ const oid=orderIdOf(code); const pr=S.progress[oid]; return (pr&&pr.stages&&pr.stages[code])||0; }

/* ---------- db ---------- */
function demoLoad(){
  const o=EXAMPLE.order, parts=expandParts(o.id,EXAMPLE.parts);
  S.orders={[o.id]:{...o,count:parts.length,createdAt:new Date().toISOString()}};
  S.progress={[o.id]:{stages:{}}};
  S._demoParts={[o.id]:parts};
}
function openOrder(oid){
  if(S.current.orderId===oid&&!S.current.missing) return;
  S.current={orderId:oid, parts:[], loading:true};
  let http=0;
  // загрузка: только сбой сети/расшифровки/разбора ведёт к «не найден»; ключ стираем только при 404
  fetch("orders/"+encodeURIComponent(oid)+".json",{cache:"no-cache"}).then(r=>{ if(!r.ok){ http=r.status; throw new Error(r.status); } return r.text(); }).then(t=>siteOrderText(oid,t)).then(txt=>{
    if(S.current.orderId!==oid) return null;
    const res=parseJSON(txt);
    siteRememberOrder(oid,res,res.parts.length);
    S.current.parts=expandParts(oid,res.parts); S.current.fasteners=res.fasteners||[]; S.current.furnMesh=res.furnMesh||null;
    Object.keys(res.textures||{}).forEach(m=>{ const t=res.textures[m]; S.textures[m]=t.url||t.data; });
    S.matColors=Object.assign(S.matColors||{},res.colors||{});
    if(!S.orders[oid]) S.orders[oid]={id:oid,name:res.order||oid,count:S.current.parts.length};
    S.current.loading=false; return true;
  }).then(ok=>{ if(!ok) return;
    // показ отдельно: ошибка отрисовки не трогает ключи и не уводит со страницы
    try{ render(); siteAfterOrderLoad&&siteAfterOrderLoad(oid); }catch(err){ console.error("Ошибка показа заказа",oid,err); toast("Ошибка показа заказа — сообщите технологу"); }
  },e=>{ if(S.current.orderId!==oid) return; S.current.loading=false; S.current.missing=true; S.current.locked=!!(e&&e.locked);
    if(!S.current.locked&&http===404&&typeof siteOrderGone==="function"){ siteOrderGone(oid); return; }
    try{ render(); }catch(err){ console.error(err); } });
}
function texId(name){ let h=2166136261; for(const ch of String(name)){ h^=ch.codePointAt(0); h=Math.imul(h,16777619); } return "t"+(h>>>0).toString(36); }
function saveFileReq(o){ return saveFile(o.filename,o.data); }
function saveFile(filename, blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
  return Promise.resolve({status:"saved"});
}
function shrinkImage(dataUrl, maxPx, q){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,maxPx/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); }; img.onerror=()=>rej(new Error("картинка не читается")); img.src=dataUrl; });
}
async function saveTextures(textures){
  let n=0;
  for(const name of Object.keys(textures||{})){
    try{
      let d=await shrinkImage(textures[name].data,1024,0.82);
      if(d.length>240000) d=await shrinkImage(textures[name].data,640,0.72);
      if(S.demo) S.textures[name]=d;
      else await S.db.doc("textures/"+texId(name)).set({name, file:textures[name].file||"", data:d, updatedAt:new Date().toISOString()});
      n++;
    }catch(e){ /* пропускаем одну текстуру, остальные сохраняем */ }
  }
  return n;
}
async function saveOrder(order, parts){
  const CH=40, chunks=Math.ceil(parts.length/CH);
  const materials=[...new Set(parts.map(p=>p.material).filter(Boolean))];
  await S.db.doc("orders/"+order.id).set({...order, materials, count:parts.length, chunks, createdAt:new Date().toISOString()});
  for(let i=0;i<chunks;i++){
    await S.db.doc("chunks/"+order.id+"~"+i).set({orderId:order.id, idx:i, parts:parts.slice(i*CH,(i+1)*CH)});
  }
  await S.db.doc("progress/"+order.id).set({stages:{}});
}
async function deleteOrder(oid){

function buildSteps(parts){

    vt.forEach(p=>{ if(!B.корпус.includes(p)) B.перегородки.push(p); });

    st.forEach((x,i)=>{ x.si=i; x.sn=st.length; }); out.push(...st);

}

const WORK_KEYS=[
  ["cut_sheet","Раскрой","лист"],["cut_part","Раскрой — детали","шт"],
  ["edge_thin","Кромка 0,4–0,8 мм","м"],["edge_thick","Кромка 1–2 мм","м"],

  ["asm_mod","Сборка модулей","шт"],["asm_drawer","Сборка ящиков","шт"],["asm_fac","Навес и регулировка фасадов","шт"],
  ["furn_hinge","Установка петель","шт"],["furn_runner","Установка направляющих","компл"],["install","Установка у клиента","модуль"]];

function workRows(parts){
  const mats=cutMaps(parts), q={};
  q.cut_sheet=mats.reduce((a,m)=>a+m.sheets.length,0);
  q.cut_part=mats.reduce((a,m)=>a+m.sheets.reduce((b,s)=>b+(s.placed||[]).length,0),0);
  let thin=0, thick=0; parts.forEach(p=>{ Object.entries(p.edges||{}).forEach(([k,e])=>{ if(!e) return; const len=(/^L/.test(k)?p.L:p.W)/1000; if((+e.t||0)>=1) thick+=len; else thin+=len; });
    (p.edgesRaw||[]).forEach(e=>{ if(e.len){ if((+e.t||0)>=1) thick+=e.len/1000; else thin+=e.len/1000; } }); });
  q.edge_thin=Math.round(thin*10)/10; q.edge_thick=Math.round(thick*10)/10;
  q.drill=parts.reduce((a,p)=>a+effHoles(p).length,0);
  q.cutout=parts.filter(p=>p.shape||p.rect===false).length;
  const mods=new Set(parts.filter(p=>p.mod).map(p=>p.mod)); q.asm_mod=mods.size||(parts.length?1:0); q.install=q.asm_mod;
  const dDno=parts.filter(p=>/дно\s*ящик/i.test(p.name||"")).length, dSide=parts.filter(p=>/боковин\w*\s*ящик/i.test(p.name||"")).length;
  q.asm_drawer=dDno||Math.round(dSide/2);
  q.asm_fac=parts.filter(p=>/фасад|дверь|дверц/i.test(p.name||"")).length;
  const fl=furnAll(curFasteners(),parts);
  q.furn_hinge=fl.filter(r=>/петл/i.test(r.name)&&!/планк|заглушк|накладк/i.test(r.name)).reduce((a,r)=>a+(+r.qty||0),0);
  q.furn_runner=fl.filter(r=>/направл|tandem|movento|legrabox|unihopper|метабокс|metabox/i.test(r.name)).reduce((a,r)=>a+(+r.qty||0),0);
  const R=workRates();
  return WORK_KEYS.map(([k,name,unit])=>({k,name,unit,qty:q[k]||0,rate:+R[k]||0})).filter(r=>r.qty>0);
}

const FURN_JUNK=/^(линия стыка|размер|управляющий размер|name|блок .*|секция-блок.*|профиль|гнутая|\d+\s*[xх×]\s*[\d,.]+|hettich brand)$/i;   // служебные объекты Базиса — не фурнитура
/* автоматическая фурнитура: петли без пружины на двери → 1 пушап на дверь */
const AUTO_PUSH="PUSH to open Premial";
function autoFurn(parts, fs){
  const hs=(fs||[]).filter(f=>/петл/i.test(f.n||"")&&/без\s*пружин/i.test((f.n||"")+" "+(f.g||""))&&!/планк|заглушк|рычаг/i.test(f.n||""));

  const ctr=f=>f.o||[(f.b[0]+f.b[3])/2,(f.b[1]+f.b[4])/2,(f.b[2]+f.b[5])/2];
  let doors=0;
  (parts||[]).filter(p=>/фасад|дверь|дверц/i.test(p.name||"")&&p.box).forEach(p=>{ const b=p.box, ex=[b[3]-b[0],b[4]-b[1],b[5]-b[2]], th=ex.indexOf(Math.min(...ex));
    if(hs.some(f=>{ const o=ctr(f); return [0,1,2].every(i=>i===th?(o[i]>b[i]-60&&o[i]<b[i+3]+60):(o[i]>b[i]-10&&o[i]<b[i+3]+10)); })) doors++; });
  if(!doors){ const grp=new Set(hs.map(f=>f.g?f.g+"#"+f.gi:null).filter(Boolean)); doors=Math.max(1,Math.round((grp.size||hs.length)/2)); }
  return [{name:AUTO_PUSH,qty:doors,auto:true}];
}
function furnAll(fs, parts){

/* ---------- вид спереди: размеры как на чертеже Базиса ---------- */
// Контейнер — пара стоек одной высоты (корпус, секция, приставка). Внутри:
//  • высоты горизонталей от низа стойки — отдельная размерная линия на каждую, лесенкой;
//  • горизонтальные размеры от внутренней грани левой стойки до осей внутренних перегородок;
//  • высоты направляющих ящиков от низа перегородок блока (если в выгрузке есть крепёж).
const RUNNER_OFF=22;
// отдельный чертёж на каждый модуль (кухня): модуль поворачиваем так, чтобы смотреть на него спереди
function moduleViews(parts, fasteners, mode, wire, hinges, pos, gaps){
  parts=parts.filter(p=>!/^\s*стена/i.test(String(p.material||"")));   // стены комнаты в чертёж не берём
  const withBox=parts.filter(p=>p.box), groups=new Map();
  withBox.forEach(p=>{ if(!p.mod) return; if(!groups.has(p.mod)) groups.set(p.mod,[]); groups.get(p.mod).push(p); });
  const one=()=>{ const fv=frontView(parts,{mode,fasteners,wire,hinges,pos,gaps}); return fv&&fv.sections?[{title:"",size:"",svg:fv.svg}]:[]; };
  if(groups.size<2){ const r=one(); if(r.length||withBox.length<8||parts._split) return r;
    // вся мебель в одном слое Базиса: делим на модули по соприкасающимся деталям
    const n=withBox.length, par=withBox.map((_,i)=>i), f=i=>{ while(par[i]!==i){ par[i]=par[par[i]]; i=par[i]; } return i; };
    const touch=(a,b)=>[0,1,2].every(k=>a.box[k]<=b.box[k+3]+3&&b.box[k]<=a.box[k+3]+3);
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) if(touch(withBox[i],withBox[j])){ const x=f(i),y=f(j); if(x!==y) par[x]=y; }
    const cl=new Map(); withBox.forEach((p,i)=>{ const r0=f(i); if(!cl.has(r0)) cl.set(r0,[]); cl.get(r0).push(p); });
    const big=[...cl.values()].filter(c=>c.length>=4).sort((a,b)=>Math.min(...a.map(p=>p.box[0]))-Math.min(...b.map(p=>p.box[0])));
    if(big.length<2) return r;

async function labelsPdf(parts, title, size){

function wrapText(c,text,x,y,maxW,lh,maxLines){
  const words=String(text||"").split(/\s+/); let line="", ln=0;

function parseCSV(text){

  const rows=[]; let row=[], cur="", q=false;

    else if(ch==='"') q=true; else if(ch===delim){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(ch!=="\r") cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); }

  const parts=rows.filter(r=>r.some(c=>c.trim())).map(r=>{
    const L=numOf(r[col.L]), W=numOf(r[col.W]), g=k=>col[k]>=0?r[col[k]]:"";
    const edges={}; ["L1","L2","W1","W2"].forEach(k=>{ const e=edgeFrom(g(k)); if(e) edges[k]=e; });
    return {name:g("name").trim(), art:g("art").trim(), qty:numOf(g("qty"))||1, L:Math.max(L,W), W:Math.min(L,W), T:numOf(g("T")), material:g("mat").trim(), edges, holes:[]};

}

function rulesEditor(){

  list.forEach((r,i)=>{ h+=`<tr style="cursor:default"><td>${inp(i,"match",r.match,"130px")}</td>

const b64u=s=>{ s=String(s).replace(/-/g,"+").replace(/_/g,"/"); s+="=".repeat((4-s.length%4)%4); return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); };

  return new TextDecoder().decode(pt).replace(/^﻿/,"");
}

const SUP_ST=[{name:"Нужно",c:"#9aa0a6"},{name:"Заказано",c:"#e8a33d"},{name:"Пришло",c:"#3b82c4"},{name:"Выдано в цех",c:"#2e8b57"}];

function supBase(oid,res){ return supBaseP(expandParts(oid,res.parts||[]),(res.fasteners||[]).filter(f=>f.g||!NOT_FURN.test(String(f.n).trim()))); }
function supBaseP(parts,fs){
  const out=[], onSheet=new Set();
  cutMaps(parts).forEach(m=>{ onSheet.add(m.mat); out.push({key:"L:"+m.mat,type:"L",name:m.mat,qty:m.sheets.length,unit:"л."}); });
  const other=new Map(); parts.forEach(p=>{ const k=String(p.material||"").split(/[\r\n]/)[0]; if(!k||onSheet.has(k)||!p.L||!p.W||/^\s*стена/i.test(k)) return; other.set(k,(other.get(k)||0)+p.L*p.W/1e6); });
  other.forEach((a,k)=>out.push({key:"L:"+k,type:"L",name:k,qty:Math.round(a*100)/100,unit:"м²"}));
  edgeMeters(parts).forEach(e=>out.push({key:"E:"+e.name,type:"E",name:e.name,qty:e.m,unit:"м"}));
  furnAll(fs,parts).forEach(f=>out.push({key:"F:"+f.name,type:"F",name:f.name,qty:f.qty,unit:"шт",auto:!!f.auto}));
  return out;
}
/* итоговый список заказа: из Базиса + правки снабженца */
function supItemsRaw(oid){
  const base=(S.sup.needs[oid]&&S.sup.needs[oid].items)||[], st=S.sup.st[oid]||{}, out=[];
  base.forEach(b=>{ const r=st[b.key]; const it={...b,status:r?r.status:0,orig:b.name,origQty:b.qty};
    if(r){ if(r.op==="del") it.del=true; if(r.name&&r.name!==b.name) it.name=r.name; if(r.qty!=null&&r.qty!==b.qty) it.qty=r.qty; it.who=r.who; }
    out.push(it); });
  Object.values(st).filter(r=>/^A:/.test(r.key)&&r.op!=="del").forEach(r=>out.push({key:r.key,type:"A",name:r.name,qty:r.qty,unit:r.unit||"шт",status:r.status,added:true,who:r.who}));
  out.forEach(i=>{ i.small=supIsSmall(i); });
  return out;
}
/* итоговый список с учётом примерной спецификации сделки:
   — блок «D:<сделка>» (только спецификация): если у сделки уже есть заказ из Базиса, оставляем только заказанное/пришедшее
   — заказ из Базиса: заказанное по спецификации вычитаем из точного количества (докупить — только разница) */
function supItems(oid){
  const L=supItemsRaw(oid), nd=S.sup.needs[oid]||{};
  if(nd.spec){ L.forEach(i=>{ i.spec=true; }); return nd.inB?L.filter(i=>i.added||i.status>=1):L; }
  const d=supDeal(oid), rows=d&&typeof dealSpecRows==="function"?dealSpecRows(d.id):null; if(!rows||!rows.length) return L;
  const cov=specCovered(d.id,rows);
  L.forEach(it=>{ if(it.del||it.added) return; const k=specKey(it.name,it.unit), c=cov.get(k); if(!c) return; cov.delete(k);
    const same=it.qty===it.origQty; it.cov=c; it.qty=Math.max(0,Math.round(((Number(it.qty)||0)-c)*100)/100); if(same) it.origQty=it.qty; if(it.qty<=0) it.covered=true; });
  return L;
}
/* сравнение примерной и точной: ключ — название без регистра/кавычек + единица */
function specKey(name,unit){ return supNorm(name).replace(/[«»"'`]/g,"").replace(/\s*,\s*/g,", ")+"|"+String(unit||"").replace(/^л$/,"л.").replace(/^м2$/,"м²"); }
function specSt(dealId,key){ const r=((S.sup.st||{})["D:"+dealId]||{})["S:"+key]; return r?(+r.status||0):0; }
function specCovered(dealId,rows){ const m=new Map(); rows.forEach(r=>{ if(specSt(dealId,r.key)<1) return; const k=specKey(r.name,r.unit); m.set(k,(m.get(k)||0)+(Number(r.qty)||0)); }); return m; }
/* строки сравнения: ok — совпало, add — докупить, extra — лишнее, nob — нет в Базисе */
function specCompare(dealId,t3d){
  const rows=dealSpecRows(dealId)||[], m=new Map();
  supItemsRaw(t3d).filter(i=>!i.del&&!i.added).forEach(i=>{ const k=specKey(i.name,i.unit), r=m.get(k)||{name:i.name,unit:i.unit,b:0,s:0,cov:0,small:i.small}; r.b+=Number(i.qty)||0; m.set(k,r); });
  rows.forEach(x=>{ const k=specKey(x.name,x.unit), r=m.get(k)||{name:x.name,unit:x.unit,b:0,s:0,cov:0,small:false}; r.s+=Number(x.qty)||0; if(specSt(dealId,x.key)>=1) r.cov+=Number(x.qty)||0; r.inSpec=true; m.set(k,r); });
  const out=[]; m.forEach(r=>{ if(!r.inSpec) return; /* позиции только из Базиса — обычная закупка, в списке выше */ const base=r.cov>0?r.cov:r.s, d=Math.round((r.b-base)*100)/100;
    r.kind=!r.b?"nob":!r.inSpec?"add":Math.abs(d)<0.005?"ok":d>0?"add":"extra"; r.d=r.kind==="nob"?r.s:Math.abs(r.inSpec?d:r.b); out.push(r); });
  const ord={add:0,extra:1,nob:2,ok:3}; return out.sort((a,b)=>ord[a.kind]-ord[b.kind]||a.name.localeCompare(b.name,"ru"));
}
function specCmpHtml(dealId,t3d,open){
  const L=specCompare(dealId,t3d), n=k=>L.filter(r=>r.kind===k).length; if(!L.length) return "";
  const only=supItemsRaw(t3d).filter(i=>!i.del&&!i.added&&(S.sup.small||!i.small)).length-L.filter(r=>r.b).length;
  const I={ok:["✅","совпало"],add:["➕","докупить"],extra:["➖","лишнее"],nob:["❓","нет в Базисе"]};
  return `<details class="spec-cmp"${open?" open":""}><summary>Примерная ↔ точная (Базис): ✅ ${n("ok")} · ➕ ${n("add")} · ➖ ${n("extra")} · ❓ ${n("nob")}</summary>
    <ul>${L.map(r=>`<li class="k-${r.kind}"><span class="ic" aria-hidden="true">${I[r.kind][0]}</span><span class="nm">${esc(r.name)}<small>${r.inSpec?`примерно ${esc(supNum(r.s))}${r.cov?`, заказано ${esc(supNum(r.cov))}`:""}`:"нет в примерной"} · Базис ${esc(supNum(r.b))} ${esc(r.unit)}</small></span><b class="q">${r.kind==="ok"?"совпало":esc(I[r.kind][1]+" "+supNum(r.d)+" "+r.unit)}</b></li>`).join("")}${only>0?`<li class="k-only"><span class="ic" aria-hidden="true">＋</span><span class="nm">Ещё ${only} поз. есть только в Базисе<small>их нет в примерной — закупаются как обычно</small></span><b class="q"></b></li>`:""}</ul></details>`;

/* мелочёвка цеха (крепёж, клей…) — по умолчанию скрыта в снабжении. Список слов — начало слова, регистр не важен. Правьте здесь. */

function supActiveIds(ids){ return (ids||supIds()).filter(o=>{ const d=supDeal(o); return !(d&&shpClosed(d)); }); }
function supGroups(ids){ const m=new Map();
  supActiveIds(ids).forEach(oid=>supVis(supItems(oid)).forEach(it=>{ if(it.status>=2) return; const k=it.type+"|"+supNorm(it.name)+"|"+it.unit;
    const r=m.get(k)||{k,type:it.type,name:it.name,unit:it.unit,need:0,ord:0,rows:[]}; const q=Number(it.qty)||0; if(it.status===0) r.need+=q; else r.ord+=q; r.rows.push({oid,key:it.key,it}); m.set(k,r); }));

function supSum(ids){

async function shpChatPoll(){

function shpApplyFilter(){ if(document.getElementById("shpCh")) shpChessFilter();
  const q=String(S.shop.q||"").trim().toLowerCase(), me=shpWho().trim().toLowerCase(), words=q.split(/\s+/).filter(Boolean);
  let shown=0;
  document.querySelectorAll(".shp-kb .shp-col").forEach(col=>{ let n=0, sum=0; const closed=col.dataset.st==="closed"||col.dataset.st==="lost";
    col.querySelectorAll(".shp-card").forEach(c=>{ const s=c.dataset.s||"";
      const ok=(!S.shop.mine||c.dataset.own===me)&&words.every(w=>s.includes(w)||(/^[\d+()-]{3,}$/.test(w)&&w.replace(/\D/g,"").length>=3&&s.includes(w.replace(/\D/g,""))));
      c.hidden=!ok; if(ok){ n++; sum+=+c.dataset.sum||0; } });
    const cnt=col.querySelector(".shp-cnt"); if(cnt) cnt.textContent=n;
    const cs=col.querySelector(".shp-csum"); if(cs) cs.textContent=shpKbSum(sum);
    const none=col.querySelector(".shp-none"); if(none) none.hidden=n>0;
    col.hidden=closed?!(S.shop.showClosed||(q&&n>0)):(!!(q||S.shop.mine)&&n===0);   // при поиске пустые этапы прячем; закрытые — по кнопке или если нашлись
    if(!col.hidden||!closed) shown+=n; });
  const nf=document.querySelector(".shp-nofind"); if(nf) nf.hidden=!(shown===0&&S.shop.orders.length&&(q||S.shop.mine));

}

function shpTaskWhen(t,today){ if(t.status==="done") return "done"; if(!t.due) return "none"; const d=shpDays(t.due,today||shpToday()); return d<0?"late":d===0?"today":d===1?"tom":"later"; }
function shpMyOpen(){ const me=shpMe(), today=shpToday(); const L=S.shop.tasks.filter(t=>t.status!=="done"&&shpNorm(t.to)===me); return {n:L.length,late:L.filter(t=>shpTaskWhen(t,today)==="late").length}; }
function shpCanEditT(t){ return S.shop.full||shpNorm(t.by)===shpMe(); }
function shpCanDoneT(t){ return S.shop.full||shpNorm(t.by)===shpMe()||shpNorm(t.to)===shpMe(); }
function shpCanDelT(t){ return S.shop.tech||shpNorm(t.by)===shpMe(); }
function shpTaskById(id){ return S.shop.tasks.find(t=>t.id===id)||null; }

/* ---- перетаскивание карточек между этапами (мышь — сразу, палец — подержать 250 мс) ---- */
const SHP_DR={st:null,justDragged:0};
function shpDragBegin(){
  const d=SHP_DR.st; if(!d||d.on) return; const r=d.card.getBoundingClientRect();
  d.on=true; d.dx=d.x-r.left; d.dy=d.y-r.top;
  const g=d.card.cloneNode(true); g.className="shp-card shp-ghost"; g.removeAttribute("data-act"); g.style.width=r.width+"px"; document.body.appendChild(g); d.g=g;
  d.card.classList.add("dragging"); const kb=document.getElementById("shpKb"); if(kb){ kb.classList.add("dragging"); const o=shpById(d.id); kb.querySelectorAll(".shp-col").forEach(c=>c.classList.toggle("no",!!o&&c.dataset.st!==d.from&&!shpCanStage(o,c.dataset.st))); } document.body.classList.add("shp-dragging");
  try{ navigator.vibrate&&navigator.vibrate(15); }catch(_){}
  shpDragMove(d.x,d.y); d.raf=requestAnimationFrame(shpDragAuto);
}
function shpDragMove(x,y){
  const d=SHP_DR.st; if(!d||!d.on) return; d.x=x; d.y=y;
  d.g.style.transform=`translate(${x-d.dx}px,${y-d.dy}px) rotate(2deg)`;
  // этап — по горизонтали: палец над колонкой (на любой высоте возле доски)
  const kb=document.getElementById("shpKb"), kr=kb&&kb.getBoundingClientRect();
  const col=kr&&x>=kr.left&&x<=kr.right&&y>=kr.top-60&&y<=Math.max(kr.bottom,kr.top+200)+60?[...kb.querySelectorAll(".shp-col:not([hidden])")].find(c=>{ const r=c.getBoundingClientRect(); return x>=r.left-5&&x<=r.right+5; }):null;
  document.querySelectorAll(".shp-col.drop").forEach(c=>{ if(c!==col) c.classList.remove("drop"); });
  if(col&&col.dataset.st!==d.from&&!col.classList.contains("no")) col.classList.add("drop"); d.to=col?col.dataset.st:null;
}
function shpDragAuto(){   // у края — листаем доску (вбок) и страницу (вверх-вниз)
  const d=SHP_DR.st; if(!d||!d.on) return; const kb=document.getElementById("shpKb");
  if(kb){ const r=kb.getBoundingClientRect(), e=Math.min(56,r.width/6);
    if(d.x<r.left+e) kb.scrollLeft-=Math.min(9,Math.ceil((r.left+e-d.x)/5)); else if(d.x>r.right-e) kb.scrollLeft+=Math.min(9,Math.ceil((d.x-(r.right-e))/5)); }
  const bot=window.innerHeight-(VTX?70:0);
  if(d.y<80) window.scrollBy(0,-Math.ceil((80-d.y)/5)); else if(d.y>bot-60) window.scrollBy(0,Math.ceil((d.y-(bot-60))/5));
  shpDragMove(d.x,d.y); d.raf=requestAnimationFrame(shpDragAuto);
}
function shpDragEnd(drop){
  const d=SHP_DR.st; SHP_DR.st=null; if(!d) return; clearTimeout(d.timer); if(!d.on) return;
  cancelAnimationFrame(d.raf); d.g.remove(); d.card.classList.remove("dragging"); document.body.classList.remove("shp-dragging");
  const kb=document.getElementById("shpKb"); if(kb){ kb.classList.remove("dragging"); S.shop.kbX=kb.scrollLeft; kb.querySelectorAll(".shp-col.no").forEach(c=>c.classList.remove("no")); }
  document.querySelectorAll(".shp-col.drop").forEach(c=>c.classList.remove("drop"));
  SHP_DR.justDragged=Date.now();
  if(drop&&d.to&&d.to!==d.from){ const o=shpById(d.id); if(o) shpMoveStage(o,d.to); }
}
document.addEventListener("pointerdown",ev=>{
  const c=ev.target.closest&&ev.target.closest(".shp-kb .shp-card"); if(!c||ev.button>0||SHP_DR.st) return;
  const o=shpById(c.dataset.id); if(!o) return;
  SHP_DR.st={card:c,id:o.id,from:o.stage,x:ev.clientX,y:ev.clientY,x0:ev.clientX,y0:ev.clientY,type:ev.pointerType,on:false,timer:null};
  if(ev.pointerType!=="mouse") SHP_DR.st.timer=setTimeout(shpDragBegin,250);
});
document.addEventListener("pointermove",ev=>{ const d=SHP_DR.st; if(!d) return;
  if(!d.on){ const far=Math.hypot(ev.clientX-d.x0,ev.clientY-d.y0)>8;
    if(far){ if(d.type==="mouse"){ d.x=ev.clientX; d.y=ev.clientY; shpDragBegin(); } else { clearTimeout(d.timer); SHP_DR.st=null; } }   // палец поехал раньше — это прокрутка
    return; }
  ev.preventDefault(); shpDragMove(ev.clientX,ev.clientY); });
document.addEventListener("pointerup",()=>shpDragEnd(true));
document.addEventListener("pointercancel",()=>shpDragEnd(false));
document.addEventListener("touchmove",ev=>{ if(SHP_DR.st&&SHP_DR.st.on) ev.preventDefault(); },{passive:false});   // во время перетаскивания страница не едет
document.addEventListener("contextmenu",ev=>{ if(SHP_DR.st||(ev.target.closest&&ev.target.closest(".shp-kb .shp-card"))) ev.preventDefault(); });
document.addEventListener("click",ev=>{ if(Date.now()-SHP_DR.justDragged<400&&ev.target.closest&&ev.target.closest(".shp-kb")){ ev.preventDefault(); ev.stopImmediatePropagation(); SHP_DR.justDragged=0; } },true);
document.addEventListener("scroll",ev=>{ if(ev.target&&ev.target.id==="shpKb") S.shop.kbX=ev.target.scrollLeft; },true);
/* смена этапа: новый запрос shopStage (только этап); старый скрипт — прежним shopSave */
function shpAskReason(o){ return new Promise(res=>{
  const m=document.createElement("div"); m.className="modal"; m.id="shpLostModal";
  m.innerHTML=`<form class="modal-card shp-mform" autocomplete="off"><h2>Закрыть неуспешно?</h2><p class="note" style="margin:0">${esc(shpTitle(o))}</p>
    <label>Причина (по желанию)<textarea name="r" rows="3" maxlength="300" placeholder="Дорого, передумали, ушли к другим…"></textarea></label>
    <div class="shp-qd">${["Дорого","Передумали","Ушли к другим","Не дозвонились"].map(x=>`<button type="button" class="btn sm" data-r="${x}">${x}</button>`).join("")}</div>
    <div class="shp-mb"><button class="btn primary shp-lostgo" type="submit">Закрыть сделку</button><button type="button" class="btn" data-x="1">Отмена</button></div></form>`;
  const done=v=>{ m.remove(); res(v); };
  m.addEventListener("click",ev=>{ if(ev.target===m||ev.target.dataset.x) return done(null); const r=ev.target.dataset&&ev.target.dataset.r; if(r){ const ta=m.querySelector("textarea"); ta.value=ta.value.trim()?ta.value.trim()+", "+r.toLowerCase():r; ta.focus(); } });
  m.querySelector("form").addEventListener("submit",ev=>{ ev.preventDefault(); done(m.querySelector("textarea").value.trim()); });
  document.body.appendChild(m); setTimeout(()=>m.querySelector("textarea").focus(),50); }); }
async function shpMoveStage(o,nx){
  const prev=o.stage, prevAt=o.stageAt, prevR=o.reason; if(prev===nx) return true;
  if(!shpCanStage(o,nx)){ toast(shpStageHint(o,nx)); if(S.view==="shop") shpRenderKeep(); return false; }
  let reason="";
  if(nx==="lost"){ const r=await shpAskReason(o); if(r===null){ if(S.view==="shop") shpRenderKeep(); return false; } reason=r; }
  o.stage=nx; o.stageAt=Date.now(); o.reason=reason; if(S.view==="shop"&&S.shop.mode==="board") shpRenderKeep();
  let j=await shpPostRaw(Object.assign({action:"shopStage",id:o.id,stage:nx},nx==="lost"?{reason}:{}));
  if(j&&!j.ok&&j.error==="code") j=await shpPostRaw({action:"shopSave",order:Object.assign({},o,{stage:nx})});   // скрипт таблицы ещё старый
  if(!j||!j.ok){ o.stage=prev; o.stageAt=prevAt; o.reason=prevR; if(j&&j.error==="pin") shpBadPin(); else toast(!j?"Нет связи с таблицей. Этап не сохранился.":j.error==="stage_role"?shpStageHint(o,nx):"Этап не сохранился. Попробуйте ещё раз."); if(S.view==="shop") shpRenderKeep(); return false; }
  toast("Этап: "+shpStName(nx)); S.shop.hist[o.id]=null; if(S.shop.chat&&S.shop.chat.id===o.id) shpChatPoll(); return true;
}

async function shpTaskSubmit(f){

  if(id){ const x=shpTaskById(id); if(x) Object.assign(x,t); } else S.shop.tasks.push(Object.assign({id:j.id,status:"open",by:shpWho(),created:Date.now(),doneAt:0},t));

async function shpFeedLoad(quiet){
  const F=S.shop.feed; if(F.busy) return; F.busy=true;
  const j=await shpGet("action=feed&since="+(F.last||0),quiet||F.loaded); F.busy=false;
  if(j){ const have=new Set(F.evs.map(e=>e.when+"|"+e.text)); (j.events||[]).forEach(e=>{ if(!have.has(e.when+"|"+e.text)){ F.evs.push(e); F.last=Math.max(F.last,e.when); } }); F.evs=F.evs.slice(-400); F.loaded=true; F.err=false; }
  else if(!F.loaded) F.err=true;
  if(S.view==="shop"&&S.shop.mode==="feed"&&!document.querySelector(".modal")) shpRenderKeep();
}
function shpFeedScreen(){
  const F=S.shop.feed; if(!F.loaded&&!F.busy&&!F.err) setTimeout(()=>shpFeedLoad(),0);
  return `<div class="head"><div><h1>Лента</h1><p class="muted" style="margin:4px 0 0">Что происходило по заказам — последние события</p></div><div class="head-actions"><button type="button" class="btn" data-act="shp-tab" data-v="more">← Ещё</button><button type="button" class="btn" data-act="shp-feedre">Обновить</button></div></div>${shpOldScript()}
    <div class="shp-feed">${F.loaded?shpEvHtml(F.evs):`<p class="muted">${F.err?"Нет связи — лента не загрузилась. Нажмите «Обновить».":"Загружаю ленту…"}</p>`}</div>`;
}
async function shpHistLoad(id){
  const j=await shpGet("action=feed&order="+encodeURIComponent(id));
  S.shop.hist[id]=j?(j.events||[]):S.shop.hist[id]||"err";
  if(S.view==="shop"&&S.shop.mode==="order"&&S.shop.cur===id&&S.shop.otab==="history") shpRenderKeep();
}
function shpHistHtml(o){
  const H=S.shop.hist[o.id];
  if(H==null){ S.shop.hist[o.id]=undefined; if(!S.shop.histBusy){ S.shop.histBusy=true; setTimeout(()=>shpHistLoad(o.id).finally(()=>{ S.shop.histBusy=false; }),0); } return `<p class="muted shp-sys">Загружаю историю…</p>`; }
  if(H==="err") return `<p class="muted shp-sys">Нет связи — история не загрузилась.</p>`;
  return `<div class="shp-hist">${shpEvHtml(H,true)}</div>`;
}

/* ---- календарь ---- */
function shpCalItems(){
  const M={}, today=shpToday(), add=(d,it)=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(d||"")) (M[d]=M[d]||[]).push(it); };
  S.shop.orders.forEach(o=>{ if(shpClosed(o)) return; const t=shpTitle(o);
    add(o.zamerDate,{k:"zm",n:"Замер",t,id:o.id,late:o.zamerDate<today&&(o.stage==="dogovor"||o.stage==="zamer")});
    add(o.montazhDate,{k:"mt",n:"Монтаж",t,id:o.id,late:o.montazhDate<today});
    add(o.deadline,{k:"dl",n:"Срок",t,id:o.id,late:o.deadline<today}); });
  S.shop.tasks.forEach(x=>add(x.due,{k:"tk",n:"Задача",t:x.text+(x.to?" → "+x.to:""),tid:x.id,done:x.status==="done",late:x.status!=="done"&&x.due<today}));
  return M;
}
function shpCalItem(it){ return `<button type="button" class="shp-ci k-${it.k}${it.late?" late":""}${it.done?" done":""}" data-act="${it.tid?"shp-topen":"shp-open"}" data-id="${esc(it.tid||it.id)}"><b>${esc(it.n)}${it.late?" · просрочено":""}</b><span>${esc(it.t)}</span></button>`; }
function shpCalHtml(){
  const C=S.shop.cal, today=shpToday(); if(!C.a) C.a=today; const M=shpCalItems();
  const a=new Date(C.a+"T00:00:00");
  let h=`<div class="head"><div><h1>Календарь</h1><p class="muted" style="margin:4px 0 0">Замеры, монтажи, сроки заказов и задачи</p></div><div class="head-actions"><button type="button" class="btn" data-act="shp-calgo" data-v="0">Сегодня</button></div></div>
    <div class="shp-calbar"><div class="shp-seg" role="group" aria-label="Вид календаря"><button type="button" data-act="shp-calv" data-v="week" aria-pressed="${C.v==="week"}">Неделя</button><button type="button" data-act="shp-calv" data-v="month" aria-pressed="${C.v==="month"}">Месяц</button></div>`;
  if(C.v==="week"){
    const st=shpAddDays(C.a,-((a.getDay()+6)%7)), en=shpAddDays(st,6), s1=new Date(st+"T00:00:00"), e1=new Date(en+"T00:00:00");
    const rng=s1.getMonth()===e1.getMonth()?s1.getDate()+"–"+e1.getDate()+" "+SHP_MON[e1.getMonth()]:s1.getDate()+" "+SHP_MON[s1.getMonth()]+" – "+e1.getDate()+" "+SHP_MON[e1.getMonth()];
    h+=`<div class="shp-calnav"><button type="button" class="btn" data-act="shp-calgo" data-v="-1" aria-label="Прошлая неделя">${shpIco("left",20)}</button><b>${esc(rng)}</b><button type="button" class="btn" data-act="shp-calgo" data-v="1" aria-label="Следующая неделя">${shpIco("right",20)}</button></div></div>${shpCalLegend()}`;
    h+=`<div class="shp-cal-body shp-week">`+[0,1,2,3,4,5,6].map(i=>{ const d=shpAddDays(st,i), x=new Date(d+"T00:00:00"), L=M[d]||[];
      return `<section class="shp-wd${d===today?" today":""}${d<today?" past":""}${L.length?"":" nil"}"><h3><span>${SHP_DOW[i]}</span> ${x.getDate()} ${SHP_MON[x.getMonth()]}${d===today?' <i>сегодня</i>':""}</h3>${L.length?L.map(shpCalItem).join(""):`<p class="muted shp-none">—</p>`}</section>`; }).join("")+`</div>`;
  } else {
    const y=a.getFullYear(), mo=a.getMonth(), first=shpToday(new Date(y,mo,1)), st=shpAddDays(first,-((new Date(y,mo,1).getDay()+6)%7)), days=new Date(y,mo+1,0).getDate();
    const rows=Math.ceil((shpDays(first,st)+days)/7), sel=C.sel&&C.sel.slice(0,7)===first.slice(0,7)?C.sel:(today.slice(0,7)===first.slice(0,7)?today:first);
    h+=`<div class="shp-calnav"><button type="button" class="btn" data-act="shp-calgo" data-v="-1" aria-label="Прошлый месяц">${shpIco("left",20)}</button><b>${SHP_MONN[mo]} ${y}</b><button type="button" class="btn" data-act="shp-calgo" data-v="1" aria-label="Следующий месяц">${shpIco("right",20)}</button></div></div>${shpCalLegend()}`;
    h+=`<div class="shp-cal-body"><div class="shp-month" role="grid">${SHP_DOW.map(d=>`<span class="shp-mdh">${d}</span>`).join("")}`;
    for(let i=0;i<rows*7;i++){ const d=shpAddDays(st,i), x=new Date(d+"T00:00:00"), L=M[d]||[], inM=x.getMonth()===mo, late=L.some(z=>z.late);
      const ks=[...new Set(L.map(z=>z.k))];
      h+=`<button type="button" class="shp-md${inM?"":" out"}${d===today?" today":""}${d===sel?" sel":""}${late?" late":""}" data-act="shp-calday" data-v="${d}" aria-label="${x.getDate()} ${SHP_MON[x.getMonth()]}: ${L.length?L.length+" событ.":"пусто"}"><span class="n">${x.getDate()}</span>${L.length?`<span class="dots">${ks.map(k=>`<i class="k-${k}"></i>`).join("")}${L.length>1?`<em>${L.length}</em>`:""}</span>`:""}</button>`; }
    const L=M[sel]||[], sx=new Date(sel+"T00:00:00");
    h+=`</div><section class="shp-wd shp-msel${sel===today?" today":""}"><h3>${esc(shpDayName(sel))}${sel===today||/^(Вчера|Завтра)$/.test(shpDayName(sel))?" · "+sx.getDate()+" "+SHP_MON[sx.getMonth()]:""}</h3>${L.length?L.map(shpCalItem).join(""):`<p class="muted shp-none">В этот день ничего не запланировано.</p>`}</section></div>`;
  }
  return h;
}
function shpCalLegend(){ return `<p class="shp-leg"><span class="k-zm">Замер</span><span class="k-mt">Монтаж</span><span class="k-dl">Срок заказа</span><span class="k-tk">Задача</span></p>`; }
function shpCalShift(n){ const C=S.shop.cal; if(!n){ C.a=shpToday(); C.sel=C.a; } else if(C.v==="week") C.a=shpAddDays(C.a||shpToday(),7*n); else { const a=new Date((C.a||shpToday())+"T00:00:00"); C.a=shpToday(new Date(a.getFullYear(),a.getMonth()+n,1)); C.sel=""; } render(); }
/* свайп по календарю: влево — дальше, вправо — назад */
(function(){ let sx=null, sy=0;
  document.addEventListener("pointerdown",ev=>{ if(ev.pointerType==="mouse"||!(ev.target.closest&&ev.target.closest(".shp-cal-body"))){ sx=null; return; } sx=ev.clientX; sy=ev.clientY; });
  document.addEventListener("pointerup",ev=>{ if(sx==null) return; const dx=ev.clientX-sx, dy=ev.clientY-sy; sx=null; if(Math.abs(dx)>60&&Math.abs(dy)<45&&S.view==="shop"&&S.shop.mode==="cal"){ SHP_DR.justDragged=0; shpCalShift(dx<0?1:-1); } });
  document.addEventListener("pointercancel",()=>{ sx=null; });
})();

/* ---- клиенты (собираются из заказов: по телефону, если нет — по имени) ---- */
function shpDigits(p){ const d=String(p||"").replace(/\D/g,""); return d.length>=6?d.slice(-10):""; }
function shpClients(){
  const by=new Map(), L=S.shop.orders.slice().sort((a,b)=>(a.created||0)-(b.created||0));
  const mk=k=>{ if(!by.has(k)) by.set(k,{key:k,name:"",names:new Set(),phones:[],addrs:[],orders:[],sum:0,last:0}); return by.get(k); };
  const put=(c,o)=>{ c.orders.push(o); if(o.client) c.name=o.client; c.names.add(shpNorm(o.client)); c.last=Math.max(c.last,o.created||0);
    if(o.phone&&!c.phones.some(p=>shpDigits(p)===shpDigits(o.phone))) c.phones.push(o.phone); if(o.address&&!c.addrs.includes(o.address)) c.addrs.push(o.address); if(S.shop.full) c.sum+=+o.sum||0; };
  L.forEach(o=>{ const d=shpDigits(o.phone); if(d) put(mk("t"+d),o); });
  L.forEach(o=>{ if(shpDigits(o.phone)) return; const n=shpNorm(o.client); if(!n) return; put([...by.values()].find(c=>c.names.has(n))||mk("n"+n),o); });
  return [...by.values()].sort((a,b)=>b.last-a.last);
}
function shpClientMatch(name,phone,exceptId){
  const d=shpDigits(phone), n=shpNorm(name);
  return shpClients().find(c=>c.orders.some(o=>o.id!==exceptId)&&((d&&c.phones.some(p=>shpDigits(p)===d))||(n.length>=3&&c.names.has(n))))||null;
}
function shpClientsHtml(){
  const C=shpClients();
  return `<div class="head"><div><h1>Клиенты</h1><p class="muted" style="margin:4px 0 0">${C.length} · собраны из заказов (по телефону или имени)</p></div><div class="head-actions"><button type="button" class="btn" data-act="shp-tab" data-v="more">← Ещё</button></div></div>
    <div class="shp-find"><input id="shpCQ" type="search" value="${esc(S.shop.cq||"")}" placeholder="Поиск: имя, телефон, адрес" aria-label="Поиск клиента" enterkeyhint="search" autocomplete="off"></div><p class="muted shp-cnofind" hidden>Никого не нашлось.</p>
    ${C.length?`<ul class="shp-list">${C.map(c=>{ const act=c.orders.filter(o=>!shpClosed(o)).length;
      return `<li data-s="${esc([c.name,...c.names,...c.phones,...c.phones.map(shpDigits),...c.addrs].join(" ").toLowerCase())}"><button type="button" class="shp-row" data-act="shp-client" data-k="${esc(c.key)}"><span class="shp-av" aria-hidden="true">${esc((c.name||"?").trim().charAt(0).toUpperCase())}</span><span class="shp-rb"><b>${esc(c.name||"Без имени")}</b><span class="muted">${esc(c.phones.join(", ")||"телефон не записан")}</span></span><span class="shp-rr"><b>${c.orders.length} ${shpPl(c.orders.length,"заказ","заказа","заказов")}</b>${S.shop.full&&c.sum?`<span class="mono">${esc(shpMoney(c.sum))}</span>`:act?`<span class="muted">в работе ${act}</span>`:""}</span></button></li>`; }).join("")}</ul>`:`<p class="note">Клиентов пока нет — они появятся из заказов.</p>`}`;
}
function shpPl(n,a,b,c){ n=Math.abs(n)%100; const m=n%10; return n>10&&n<20?c:m===1?a:m>1&&m<5?b:c; }
function shpCFilter(){ const q=shpNorm(S.shop.cq), w=q.split(/\s+/).filter(Boolean); let n=0;
  document.querySelectorAll(".shp-list li[data-s]").forEach(li=>{ const s=li.dataset.s; const ok=w.every(x=>s.includes(x)||(x.replace(/\D/g,"").length>=3&&s.includes(x.replace(/\D/g,"")))); li.hidden=!ok; if(ok) n++; });
  const nf=document.querySelector(".shp-cnofind"); if(nf) nf.hidden=n>0||!q; }
function shpClientHtml(){
  const c=shpClients().find(x=>x.key===S.shop.curClient);
  if(!c) return `<div class="empty"><h2>Клиент не найден</h2><button class="btn" data-act="shp-tab" data-v="clients">К клиентам</button></div>`;
  const seen=shpSeen(), today=shpToday(), paid=S.shop.full?c.orders.reduce((a,o)=>a+(+o.prepay||0),0):0;
  return `<div class="head"><div><h1>${esc(c.name||"Без имени")}</h1><p class="muted" style="margin:4px 0 0">Клиент · ${c.orders.length} ${shpPl(c.orders.length,"заказ","заказа","заказов")}</p></div><div class="head-actions"><button type="button" class="btn" data-act="shp-tab" data-v="clients">← Клиенты</button><button type="button" class="btn primary" data-act="shp-cnew" data-k="${esc(c.key)}">+ Заказ</button></div></div>
    <dl class="card shp-info">${c.phones.map(p=>{ const t=String(p).replace(/[^\d+]/g,""); return `<div><dt>Телефон</dt><dd>${t?`<a href="tel:${esc(t)}">${esc(p)}</a>`:esc(p)}</dd></div>`; }).join("")}
      ${c.addrs.map(a=>`<div><dt>Адрес</dt><dd>${esc(a)} <a class="shp-map" href="${esc(shpMap(a))}" target="_blank" rel="noopener">На карте</a></dd></div>`).join("")}
      ${S.shop.full?`<div><dt>Всего заказов на</dt><dd><b>${esc(shpMoney(c.sum))}</b>${paid?` · предоплаты ${esc(shpMoney(paid))}`:""}</dd></div>`:""}</dl>
    <h2 class="shp-h2">Заказы клиента</h2><div class="shp-clist">${c.orders.slice().sort((a,b)=>(b.created||0)-(a.created||0)).map(o=>`<div class="shp-cst"><span class="shp-stl">${esc(shpStName(o.stage))}</span>${shpCard(o,seen,today)}</div>`).join("")}</div>`;
}

/* ---- сотрудники: из данных + лист «Сотрудники» ---- */
function shpPeople(){
  const m=new Map(), add=n=>{ n=String(n||"").trim(); if(!n||n.length>40) return null; const k=shpNorm(n); if(!m.has(k)) m.set(k,{name:n,role:"",phone:"",staff:false}); return m.get(k); };
  (S.shop.staff||[]).forEach(s=>{ const p=add(s.name); if(p) Object.assign(p,{name:s.name,role:s.role||"",phone:s.phone||"",tg:s.tg||"",staff:true}); });
  SHP_OWNERS.forEach(add); S.shop.orders.forEach(o=>{ add(o.owner); add(o.lastWho); }); S.shop.tasks.forEach(t=>{ add(t.to); add(t.by); });
  Object.keys(S.shop.staffLast||{}).forEach(add); if(S.shop.general) add(S.shop.general.lastWho);
  return [...m.values()];
}
function shpPersonInfo(p){ const k=shpNorm(p.name), today=shpToday();
  const ords=S.shop.orders.filter(o=>!shpClosed(o)&&shpNorm(o.owner)===k), tasks=S.shop.tasks.filter(t=>t.status!=="done"&&shpNorm(t.to)===k);
  let last=0; Object.keys(S.shop.staffLast||{}).forEach(n=>{ if(shpNorm(n)===k) last=Math.max(last,S.shop.staffLast[n]); });
  return {ords,tasks,late:tasks.filter(t=>shpTaskWhen(t,today)==="late").length,last}; }
async function shpStaffLoad(quiet){ const j=await shpGet("action=staff",quiet); if(j){ S.shop.staff=j.staff||[]; S.shop.staffLast=j.last||{}; S.shop.staffLoaded=true; } else S.shop.staffErr=true;
  if(S.view==="shop"&&/^(staff|person)$/.test(S.shop.mode)&&!document.querySelector(".modal")) shpRenderKeep(); }
function shpAgo(ms){ if(!ms) return "давно не заходил"; const m=Math.round((Date.now()-ms)/6e4); return m<2?"только что":m<60?m+" мин назад":m<1440?Math.round(m/60)+" ч назад":shpTime(ms); }
function shpTelBtn(p){ const t=String(p.phone||"").replace(/[^\d+]/g,""); return t?`<a class="btn shp-tel" href="tel:${esc(t)}" aria-label="Позвонить: ${esc(p.name)}">${shpIco("phone",18)}</a>`:""; }
function shpStaffHtml(){
  if(!S.shop.staffLoaded&&!S.shop.staffBusy&&S.shop.v2){ S.shop.staffBusy=true; setTimeout(()=>shpStaffLoad().finally(()=>{ S.shop.staffBusy=false; }),0); }
  const P=shpPeople().map(p=>Object.assign({},p,shpPersonInfo(p))).sort((a,b)=>(b.staff-a.staff)||(b.last-a.last)||a.name.localeCompare(b.name,"ru"));
  return `<div class="head"><div><h1>Сотрудники</h1><p class="muted" style="margin:4px 0 0">${P.length} · ответственные, исполнители задач и все, кто пишет</p></div><div class="head-actions"><button type="button" class="btn" data-act="shp-tab" data-v="more">← Ещё</button>${S.shop.full&&S.shop.v2?`<button type="button" class="btn primary" data-act="shp-pedit">+ Сотрудник</button>`:""}</div></div>${shpOldScript()}
    <ul class="shp-list">${P.map(p=>`<li class="shp-prow"><button type="button" class="shp-row" data-act="shp-person" data-k="${esc(p.name)}"><span class="shp-av" aria-hidden="true">${esc(p.name.charAt(0).toUpperCase())}</span><span class="shp-rb"><b>${esc(p.name)}</b><span class="muted">${esc([p.role,shpAgo(p.last)].filter(Boolean).join(" · "))}</span></span><span class="shp-rr"><span>заказов ${p.ords.length}</span><span class="${p.late?"shp-late":"muted"}">задач ${p.tasks.length}${p.late?", просроч. "+p.late:""}</span></span></button>${shpTelBtn(p)}</li>`).join("")}</ul>`;
}

    <h2 class="shp-h2">Ответственный за заказы · ${p.ords.length}</h2>${p.ords.length?`<div class="shp-clist">${p.ords.map(o=>`<div class="shp-cst"><span class="shp-stl">${esc(shpStName(o.stage))}</span>${shpCard(o,seen,today)}</div>`).join("")}</div>`:`<p class="muted">Нет активных заказов.</p>`}`;
}

function shpMoneyRange(v){ const d=new Date(), y=d.getFullYear(), m=d.getMonth();

  let h=`<div class="head"><div><h1>Деньги по заказам</h1><p class="muted" style="margin:4px 0 0">Закупка — сумма чеков снабженца по заказу</p></div><div class="head-actions"><button type="button" class="btn" data-act="shp-reload">Обновить</button>${back}</div></div>

/* ---------- примерная спецификация закупки (от дизайнера): видят офис, снабженец, технолог; правят офис и технолог ---------- */
const SPEC_TT=[["L","Лист"],["E","Кромка"],["F","Фурнитура"],["O","Другое"]], SPEC_UU=["л.","м","м²","шт","компл."], SPEC_DEFU={L:"л.",E:"м",F:"шт",O:"шт"};
function specSee(){ return !!(S.shop.full||S.shop.role==="supply"); }
function dealSpecRows(id){ const r=S.shop.spec[id]; return Array.isArray(r)?r:null; }
function specGot(j,deal){ if(!j) return false; if(!Array.isArray(j.rows)){ S.shop.specOld=true; return false; } S.shop.specOld=false;
  if(deal) S.shop.spec[deal]=j.rows.filter(r=>r.deal===deal); else { const m={}; j.rows.forEach(r=>(m[r.deal]=m[r.deal]||[]).push(r)); S.shop.spec=Object.assign({},m); }
  return true; }
async function specLoadAll(){ if(!specSee()) return; specGot(await shpGet("action=specGet",true)); }
async function specLoad(id){ const j=await shpGet("action=specGet&deal="+encodeURIComponent(id),true); if(!specGot(j,id)&&!S.shop.specOld) S.shop.spec[id]="err";
  const o=shpById(id), t=o&&String(o.t3d||"").toUpperCase();
  await Promise.all([supStLoad(), t&&dealSpecRows(id)&&dealSpecRows(id).length?supNeedLoad(t):null]);
  if(S.view==="shop"&&S.shop.mode==="order"&&S.shop.cur===id&&!document.querySelector(".modal")) shpRenderKeep(); }
function specMeta(rows){ let w=null; rows.forEach(r=>{ if(!w||r.when>w.when) w=r; }); return w?`изменил(а) ${esc(w.who||"—")} · ${esc(shpTime(w.when))}`:""; }
function specNames(o){ const n=new Set(); const t=o&&String(o.t3d||"").toUpperCase(), b=t&&S.sup.needs[t];
  if(b&&b.items) b.items.forEach(i=>n.add(i.name));
  if(S.cat&&S.cat.data) S.cat.data.items.forEach(x=>{ if(/^(Листовой|Кромочные|Погонные|Фурнитура|Каталог|Расходные)/.test(x.g)) n.add(x.n); });
  return [...n].slice(0,3000).map(x=>`<option value="${esc(x)}">`).join(""); }
function specGuess(name){ const c=typeof catFind==="function"?catFind(name):null; if(!c) return null; const g=String(c.g||"");
  return /^Листовой/.test(g)?"L":/^Кромочн/.test(g)?"E":/^(Фурнитура|Каталог)/.test(g)?"F":null; }
function specBlockHtml(o){
  if(!specSee()) return "";
  if(S.shop.specOld) return `<div class="card shp-spec"><h2>Спецификация закупки</h2><p class="note" style="margin:0">Обновите скрипт таблицы — тогда здесь можно будет написать примерную спецификацию для снабженца.</p></div>`;

  if(R==="err") return `<div class="card shp-spec"><h2>Спецификация закупки</h2><p class="muted" style="margin:0">Нет связи — не загрузилась. <button type="button" class="linkbtn" data-act="shp-specre">Повторить</button></p></div>`;
  const E=S.shop.specEdit&&S.shop.specEdit.deal===o.id?S.shop.specEdit:null, can=S.shop.full, t=String(o.t3d||"").toUpperCase();
  let h=`<div class="card shp-spec"><div class="shp-rc-h"><h2>Спецификация закупки</h2>${can&&!E?`<button type="button" class="btn sm" data-act="shp-specedit">${R.length?"Изменить":"+ Составить"}</button>`:""}</div>
    <p class="shp-specl"><span class="sup-tag spec">Примерная — от дизайнера</span>${R.length?" <span class=\"muted\">"+specMeta(R)+"</span>":""}</p>`;
  if(E){ if(typeof catLoad==="function") catLoad();
    h+=`<form id="shpSpecForm" data-id="${esc(o.id)}" autocomplete="off"><div class="spec-rows">${E.rows.map((r,i)=>`<div class="spec-r" data-i="${i}">

      <input name="q" value="${esc(r.qty==null?"":String(r.qty).replace(".",","))}" inputmode="decimal" placeholder="Кол-во" aria-label="Количество">

      <button type="button" class="btn sm spec-x" data-act="shp-specdel" data-i="${i}" aria-label="Удалить строку">✕</button></div>
      <input name="c" value="${esc(r.comment||"")}" maxlength="300" placeholder="Комментарий (цвет, размер, где купить…)" aria-label="Комментарий"></div>`).join("")}</div>
      <div class="shp-mb"><button type="button" class="btn" data-act="shp-specadd">+ строка</button><button class="btn primary" type="submit">Сохранить</button><button type="button" class="btn" data-act="shp-speccancel">Отмена</button></div>

  if(!E&&R.length&&t){ const b=S.sup.needs[t]; h+=b&&!b.err?specCmpHtml(o.id,t,false):b&&b.err?`<p class="note">Точная спецификация (Базис) на этом устройстве не открывается.</p>`:""; }
  return h+`</div>`;
}
function specDraftRead(){ const f=document.getElementById("shpSpecForm"), E=S.shop.specEdit; if(!f||!E) return;
  f.querySelectorAll(".spec-r").forEach(el=>{ const r=E.rows[+el.dataset.i]; if(!r) return; const g=n=>el.querySelector(`[name="${n}"]`).value;
    r.name=g("n").trim(); r.type=g("t"); r.qty=g("q").trim(); r.unit=g("u"); r.comment=g("c").trim(); }); }

/* ---------- автоматика «Проект готов»: технолог/офис открыл приложение, а 3D заказа выгружен позже, чем сделка встала на «Проект у технолога» ---------- */
const SHP_AUTOP={};
async function shpAutoProject(){
  if(!(S.shop.tech||S.shop.role==="office")||!S.orders) return;

    if(j&&j.ok&&!j.same){ o.stage="proekt_ok"; o.stageAt=Date.now(); toast("Проект готов: "+shpTitle(o)+" (3D выгружен)"); if(S.view==="shop"&&!document.querySelector(".modal")&&S.shop.mode!=="form") shpRenderKeep(); } }

/* на главной — тихая ссылка в раздел для тех, у кого не видно вкладок */

function readFile(f){
  const r=new FileReader();
  r.onload=()=>{ try{
      const txt=String(r.result), res=/^\s*[\[{]/.test(txt.replace(/^﻿/,""))?parseJSON(txt):parseCSV(txt);
      S.importDraft={...res, file:f.name, id:newOrderId(), name:res.order||f.name.replace(/\.[^.]+$/,"")};

function findPos(v){

(function(){

<script>
/* ---------- приложение на телефоне (PWA): значок на экране, работа без интернета ---------- */
(function(){

  btn.addEventListener("click",async()=>{
    if(deferred){ deferred.prompt(); try{ await deferred.userChoice; }catch(_){} deferred=null; btn.hidden=true; return; }
    const m=document.createElement("div"); m.className="modal"; m.id="qrModal";

          :`<ol class="inst"><li>Откройте меню браузера <b>⋮</b> (справа вверху).</li><li>Выберите <b>«Установить приложение»</b> или <b>«Добавить на главный экран»</b>.</li></ol>`}

    m.addEventListener("click",ev=>{ if(ev.target===m||ev.target.closest('[data-act="qr-close"]')) m.remove(); });
    document.body.appendChild(m);
  });
})();

/* ---------- без интернета: плашка сверху; открытые раньше заказы работают из памяти телефона ---------- */
(function(){
