<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Ваш заказ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f2ef;--surface:#ffffff;--ink:#1d1f22;--muted:#61656b;--line:#dddcd7;
  --tape:#ffc21a;--tape-ink:#1d1f22;--done:#2f7d32;--me:#fff4cf;--bad:#b3261e;--r:12px;
  --f:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1d20;--surface:#26282c;--ink:#f1f1ee;--muted:#a3a6ab;--line:#3a3d42;--done:#6cc070;--me:#3d3420;--bad:#ff7a6e;}}
:root[data-theme="dark"]{--bg:#1c1d20;--surface:#26282c;--ink:#f1f1ee;--muted:#a3a6ab;--line:#3a3d42;--done:#6cc070;--me:#3d3420;--bad:#ff7a6e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
header.top{border-bottom:4px solid var(--tape);background:var(--surface)}
header.top .wrap{padding-top:18px;padding-bottom:16px}
.eyebrow{margin:0;color:var(--muted);font-size:14px}
h1{margin:2px 0 0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.kind{margin:6px 0 0;font-size:16px}
h2{font-size:18px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
/* путь заказа */
.route{list-style:none;margin:0;padding:0}
.route li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:14px}
.route li:last-child{padding-bottom:0}
.route li::before{content:"";position:absolute;left:13px;top:26px;bottom:-2px;width:2px;background:var(--line)}
.route li:last-child::before{display:none}
.route li.done::before{background:var(--done)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.done .dot{border-color:var(--done);background:var(--done);color:#fff}
.now .dot{border-color:var(--tape);background:var(--tape);color:var(--tape-ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--tape) 30%,transparent)}
.st{padding-top:3px}
.st b{display:block;font-weight:600}
.later .st b{color:var(--muted);font-weight:500}
.now .st b{font-size:17px}
.st span{display:block;font-size:14px;color:var(--muted)}
.closed{margin:0;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--bad) 10%,var(--surface));}
/* даты и деньги */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 16px;margin:0}
.facts div{min-width:0}.facts dt{font-size:13px;color:var(--muted)}.facts dd{margin:2px 0 0;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.facts dd.due{color:var(--bad)}
/* примерная цена — пока нет договора */
.est{margin:0;font-size:24px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}.est small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-bottom:2px}.estn{margin:10px 0 0;font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--f);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.btn:focus-visible,textarea:focus-visible,.att:focus-within{outline:3px solid color-mix(in srgb,var(--tape) 70%,var(--ink));outline-offset:2px}
.btn[disabled]{opacity:.6;cursor:default}
.d3 p{margin:0 0 12px;color:var(--muted)}
/* чат */
.msgs{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;padding:2px;margin:0 -2px 12px}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--ink) 6%,var(--surface));align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--me)}
.mh{display:flex;gap:8px;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:2px}
.mh b{color:var(--ink);font-weight:600}
.mt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg img{display:block;max-width:100%;border-radius:8px;margin:4px 0}
.sys{color:var(--muted);text-align:center;font-size:14px;margin:8px 0}
form.send{display:flex;gap:8px;align-items:flex-end}
form.send textarea{flex:1;min-width:0;min-height:48px;max-height:160px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:16px/1.35 var(--f);resize:vertical}
.att{position:relative;min-width:48px;padding:0}
.att input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fhint{font-size:14px;color:var(--muted);margin:6px 0 0}
.ph{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.hb{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.okk{margin:0;font-weight:600;color:var(--done)}
.rem{border-left:3px solid var(--bad);padding:2px 0 2px 12px;margin:0}.rem p{margin:6px 0}
.remf{margin-top:12px}.remf label[for]{display:block;margin-bottom:6px}.remf textarea{width:100%;min-height:90px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:16px/1.35 var(--f)}
.muted{color:var(--muted)}
.empty{text-align:center;padding:48px 8px}
.empty p{color:var(--muted)}
.foot{color:var(--muted);font-size:13px;margin:20px 0 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.now .dot{transition:box-shadow .3s}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><p class="eyebrow" id="eb">Ваш заказ</p><h1 id="ttl">Загружаю…</h1><p class="kind" id="kind" hidden></p></div></header>
<main class="wrap" id="main" aria-live="polite"></main>
<script>
(function(){
"use strict";
var TOK=(location.hash||"").replace(/^#/,"").trim().toLowerCase(), URLS="", ORD=null, HAND=null, MSGS=[], LAST=0, BUSY=false, REM=false;
var ROUTE=[["dogovor","Договор и предоплата","Оформили заказ"],["zamer","Замер","Приезжаем и замеряем помещение"],["proekt","Проект","Делаем проект и чертежи"],["zakup","Материалы","Закупаем материалы"],["cex","Производство","Изготавливаем мебель в цеху"],["montazh","Монтаж","Привозим и собираем"],["closed","Готово","Заказ сдан"]];
var IDX={dogovor:0,zamer:1,proekt:2,proekt_ok:2,zakup:3,cex:4,montazh:5,closed:6};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(v){return v===""||v==null||isNaN(+v)?"—":Number(v).toLocaleString("ru-RU")+" ₽";}
function dlong(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");if(!m)return "";var x=new Date(+m[1],+m[2]-1,+m[3]);return x.toLocaleDateString("ru-RU",{day:"numeric",month:"long",weekday:"short"});}
function dshort(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");if(!m)return "";return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString("ru-RU",{day:"numeric",month:"long"});}
function span(a,b){return a&&b&&a!==b?dshort(a)+" — "+dshort(b):dlong(a||b);}
function tm(ms){var d=new Date(ms),t=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});return d.toDateString()===new Date().toDateString()?t:d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})+" "+t;}
function safe(u){return /^https:\/\/[^\s"<>]+$/.test(String(u||""));}
function thumb(u,w){return String(u||"").replace(/([?&]sz=)w\d+/,"$1w"+(w||480));}
function api(q){return URLS+(URLS.indexOf("?")>=0?"&":"?")+q;}
var main=document.getElementById("main");
function fail(h,p){document.getElementById("ttl").textContent=h;main.innerHTML='<div class="empty"><p>'+p+'</p></div>';}

function routeHtml(o){
  if(o.stage==="lost") return '<p class="closed">Заказ закрыт. Если это ошибка — напишите нам в чат ниже.</p>';
  var cur=IDX[o.stage]==null?0:IDX[o.stage];
  return '<ol class="route">'+ROUTE.map(function(r,i){
    var cl=i<cur||(o.stage==="closed")?"done":i===cur?"now":"later", sub=r[2];
    if(r[0]==="zamer"&&o.zamerDate) sub=dlong(o.zamerDate);
    if(r[0]==="montazh"&&o.montazhDate) sub=dlong(o.montazhDate);
    if(r[0]==="proekt"&&o.stage==="proekt_ok") sub="Проект готов";
    return '<li class="'+cl+'"'+(cl==="now"?' aria-current="step"':'')+'><span class="dot" aria-hidden="true">'+(cl==="done"?"✓":(i+1))+'</span><span class="st"><b>'+esc(r[1])+'</b><span>'+esc(sub)+(cl==="now"?" — сейчас":"")+'</span></span></li>';
  }).join("")+'</ol>';
}
function factsHtml(o){
  var f=[];
  if(o.zamerDate) f.push(["Замер",dlong(o.zamerDate)]);
  if(o.prodFrom||o.prodTo) f.push(["Изготовление",span(o.prodFrom,o.prodTo)]);
  if(o.montazhDate) f.push(["Монтаж",span(o.montazhDate,o.montazhTo)]);
  if(o.deadline) f.push(["Срок готовности",dlong(o.deadline)]);
  if(o.owner) f.push(["Ведёт заказ",o.owner]);
  if(o.master&&o.master!==o.owner) f.push(["Мастер",o.master]);
  return f.length?'<section class="card" aria-labelledby="h-d"><h2 id="h-d">Даты</h2><dl class="facts">'+f.map(function(x){return '<div><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>';}).join("")+'</dl></section>':"";
}
function moneyHtml(o){
  if(o.sum===""||o.sum==null) return "";
  return '<section class="card" aria-labelledby="h-m"><h2 id="h-m">Оплата</h2><dl class="facts"><div><dt>Сумма заказа</dt><dd>'+money(o.sum)+'</dd></div><div><dt>Оплачено</dt><dd>'+money(o.prepay)+'</dd></div><div><dt>Осталось оплатить</dt><dd'+(o.rest>0?' class="due"':'')+'>'+money(o.rest)+'</dd></div></dl></section>';
}
function estHtml(o){   // пока в сделке нет суммы договора — «от … до …» по смете (сервер присылает только эти два числа)
  var e=o.est; if(!(+o.sum>0)&&e&&+e.from>0&&+e.to>=+e.from) return '<section class="card" aria-labelledby="h-m"><h2 id="h-m">Стоимость</h2><p class="est"><small>Примерная цена</small>от '+esc(Number(e.from).toLocaleString("ru-RU"))+' до '+esc(money(e.to))+'</p><p class="estn">Точная цена — после замера и согласования проекта.</p></section>';
  return moneyHtml(o);
}
function d3Html(o){
  if(!safe(o.link3d)) return "";
  return '<section class="card d3" aria-labelledby="h-3"><h2 id="h-3">Проект в 3D</h2><p>Покрутите мебель пальцем, посмотрите со всех сторон.</p><a class="btn primary" href="'+esc(o.link3d)+'" target="_blank" rel="noopener">Открыть 3D</a></section>';
}
function handHtml(o){
  var H=HAND||{photos:[],accepted:0,remarks:[]}; if(o.stage==="lost") return "";
  if(!H.photos.length&&o.stage!=="montazh"&&o.stage!=="closed") return "";
  var g=H.photos.length?'<ul class="ph">'+H.photos.map(function(p){return safe(p.photo)?'<li><a href="'+esc(p.photo)+'" target="_blank" rel="noopener"><img src="'+esc(thumb(p.photo,640))+'" alt="Фото готовой мебели" loading="lazy"></a></li>':"";}).join("")+'</ul>':'<p class="muted">Мастер загрузит сюда фото после монтажа.</p>';
  var st="";
  if(H.remarks.length) st='<div class="rem"><b>Ваши замечания переданы мастеру</b>'+H.remarks.map(function(r){return '<p>'+esc(r.text)+' <span class="muted">'+esc(tm(r.when))+'</span></p>';}).join("")+'<p class="muted">Когда всё исправим — нажмите «Принимаю».</p></div>';
  else if(H.accepted) st='<p class="okk">✓ Вы приняли заказ '+esc(tm(H.accepted))+'. Спасибо, что выбрали нас!</p>';
  var btns=(!H.accepted||H.remarks.length)&&(H.photos.length||o.stage==="montazh"||o.stage==="closed")?'<div class="hb"><button class="btn primary" type="button" id="acc">Принимаю, претензий нет</button><button class="btn" type="button" id="remb">Есть замечание</button></div>':(H.accepted?'<div class="hb"><button class="btn" type="button" id="remb">Есть замечание</button></div>':"");
  var form=REM?'<form class="remf" id="remf"><label for="remt">Что не так? Опишите, по возможности приложите фото — мастер приедет и исправит.</label><textarea id="remt" rows="3" maxlength="1000" required></textarea><div class="hb"><label class="btn att" aria-label="Прикрепить фото"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H8l1.5-2h5L16 6h1.5A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg><input type="file" accept="image/*" id="remph"></label><button class="btn primary" type="submit">Отправить замечание</button><button class="btn" type="button" id="remx">Отмена</button></div><p class="fhint" id="rfh" hidden></p></form>':"";
  return '<section class="card" aria-labelledby="h-h"><h2 id="h-h">Сдача заказа</h2>'+g+st+btns+form+'</section>';
}
function msgsHtml(){
  if(!MSGS.length) return '<p class="sys">Напишите нам — ответим здесь. Можно прислать фото помещения.</p>';
  return MSGS.map(function(m){var me=/^client/.test(m.kind);
    return '<div class="msg'+(me?" me":"")+'"><div class="mh"><b>'+esc(me?"Вы":(m.who||"Мастерская"))+'</b><span>'+esc(tm(m.when))+'</span></div>'+(safe(m.photo)?'<a href="'+esc(m.photo)+'" target="_blank" rel="noopener"><img src="'+esc(thumb(m.photo,640))+'" alt="Фото" loading="lazy"></a>':"")+(m.text?'<div class="mt">'+esc(m.text)+'</div>':"")+'</div>';}).join("");
}
function chatHtml(){
  return '<section class="card" aria-labelledby="h-c"><h2 id="h-c">Чат с нами</h2><div class="msgs" id="msgs">'+msgsHtml()+'</div>'+
    '<form class="send" id="send"><label class="btn att" title="Прикрепить фото" aria-label="Прикрепить фото"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H8l1.5-2h5L16 6h1.5A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg><input type="file" accept="image/*" id="ph"></label>'+
    '<textarea id="ta" rows="1" placeholder="Сообщение" aria-label="Сообщение" maxlength="1500"></textarea><button class="btn primary" type="submit">Отправить</button></form><p class="fhint" id="fh" hidden></p></section>';
}
function render(){
  var o=ORD; document.title="Заказ № "+o.num;
  document.getElementById("eb").textContent="Заказ № "+o.num+(o.client?" · "+o.client:"");
  document.getElementById("ttl").textContent=o.stage==="lost"?"Заказ закрыт":(o.stage==="closed"?"Заказ готов":"Сейчас: "+(ROUTE[IDX[o.stage]==null?0:IDX[o.stage]][1]));
  var k=document.getElementById("kind"); k.hidden=!o.kind; k.textContent=o.kind||"";
  var ta=document.getElementById("ta"), draft=ta?ta.value:"";
  main.innerHTML='<section class="card" aria-labelledby="h-r"><h2 id="h-r">Как идёт заказ</h2>'+routeHtml(o)+'</section>'+handHtml(o)+factsHtml(o)+estHtml(o)+d3Html(o)+chatHtml()+'<p class="foot">Это личная ссылка на ваш заказ — не пересылайте её посторонним.</p>';
  if(draft) document.getElementById("ta").value=draft;
  bind(); drawMsgs(true);
}
function drawMsgs(force){var b=document.getElementById("msgs");if(!b)return;var end=b.scrollHeight-b.scrollTop-b.clientHeight<80;b.innerHTML=msgsHtml();if(end||force)b.scrollTop=b.scrollHeight;}
function load(first){
  if(BUSY) return; BUSY=true;
  fetch(api("action=client&t="+encodeURIComponent(TOK)+"&since="+(first?0:LAST)),{cache:"no-cache"}).then(function(r){return r.json();}).then(function(j){
    BUSY=false;
    if(!j||!j.ok){ if(first) fail("Ссылка не работает","Возможно, мы выдали вам новую ссылку. Попросите её у мастерской."); return; }
    var stageWas=ORD&&ORD.stage, handWas=JSON.stringify(HAND); ORD=j.order; if(j.hand) HAND=j.hand;
    var have={}; MSGS.forEach(function(m){have[m.when+"|"+m.text]=1;});
    (j.messages||[]).forEach(function(m){ if(!have[m.when+"|"+m.text]){ MSGS.push(m); LAST=Math.max(LAST,m.when);} });
    if(first||stageWas!==ORD.stage||(handWas!==JSON.stringify(HAND)&&!REM)) render(); else drawMsgs(false);
  }).catch(function(){ BUSY=false; if(first) fail("Нет связи","Проверьте интернет и обновите страницу."); });
}
function shrink(file){return new Promise(function(ok,bad){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",0.8).split(",")[1]);};im.onerror=bad;im.src=u;});}
function send(){
  var ta=document.getElementById("ta"), fi=document.getElementById("ph"), btn=document.querySelector("#send [type=submit]"), fh=document.getElementById("fh");
  var text=ta.value.trim(), file=fi.files[0]; if((!text&&!file)||btn.disabled) return;
  btn.disabled=true; btn.textContent="Отправляю…";
  (file?shrink(file):Promise.resolve("")).then(function(photo){
    var body={action:"clientSend",t:TOK,text:text}; if(photo) body.photo=photo;
    return fetch(URLS,{method:"POST",body:JSON.stringify(body)}).then(function(r){return r.json();});
  }).then(function(j){
    btn.disabled=false; btn.textContent="Отправить";
    if(!j||!j.ok){ fh.hidden=false; fh.textContent=j&&j.error==="often"?"Слишком много сообщений подряд. Подождите несколько минут.":j&&j.error==="big"?"Фото слишком большое. Выберите другое.":"Не отправилось. Проверьте интернет и попробуйте ещё раз."; return; }
    ta.value=""; fi.value=""; fh.hidden=true; load(false);
  }).catch(function(){ btn.disabled=false; btn.textContent="Отправить"; fh.hidden=false; fh.textContent="Не отправилось. Проверьте интернет и попробуйте ещё раз."; });
}
function post(body){ body.t=TOK; return fetch(URLS,{method:"POST",body:JSON.stringify(body)}).then(function(r){return r.json();}); }
function errText(j){ return j&&j.error==="often"?"Слишком много сообщений подряд. Подождите несколько минут.":j&&j.error==="big"?"Фото слишком большое. Выберите другое.":"Не отправилось. Проверьте интернет и попробуйте ещё раз."; }
function bindHand(){
  var a=document.getElementById("acc"), rb=document.getElementById("remb"), rf=document.getElementById("remf"), rx=document.getElementById("remx");
  if(a) a.addEventListener("click",function(){ if(!a.dataset.sure){ a.dataset.sure="1"; a.textContent="Подтвердить: мебель принята, претензий нет"; return; }
    a.disabled=true; post({action:"clientAccept"}).then(function(j){ a.disabled=false; if(!j||!j.ok){ a.textContent=errText(j); return; } HAND=HAND||{photos:[],remarks:[]}; HAND.accepted=j.when; HAND.remarks=[]; render(); load(false); }).catch(function(){ a.disabled=false; a.textContent="Нет связи — нажмите ещё раз"; }); });
  if(rb) rb.addEventListener("click",function(){ REM=true; render(); var t=document.getElementById("remt"); if(t) t.focus(); });
  if(rx) rx.addEventListener("click",function(){ REM=false; render(); });

      b.disabled=false; b.textContent="Отправить замечание"; if(!j||!j.ok){ fh.hidden=false; fh.textContent=errText(j); return; }
      REM=false; HAND=HAND||{photos:[],remarks:[]}; HAND.remarks=(HAND.remarks||[]).concat([{when:j.when,text:text}]); render(); load(false); })
    .catch(function(){ b.disabled=false; b.textContent="Отправить замечание"; fh.hidden=false; fh.textContent=errText(null); }); });
}
