<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F1">
<title>Эскиз — дизайн кухни и комнаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>/* Эскиз — оформление. Светлая тема по умолчанию, тёмная — data-theme="dark" */
/* Оформление цеха: «Чертёжный лист» (светлая) и «Цеховая разметка» (тёмная) — те же цвета, что в Вертаксе (site_theme.js) */
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --panel2:#E8EAE6; --ink:#1B2329; --muted:#56636A; --line:#C9CFD1; --line2:#8C979E;
  --accent:#1F5BC4; --accent-ink:#FFFFFF; --accent-soft:rgba(31,91,196,.10); --tape:#1F5BC4; --tape-ink:#FFFFFF; --danger:#C7361F; --ok:#1F7A4D;
  --plan-bg:#FBFBF9; --plan-g1:rgba(31,91,196,.07); --plan-g2:rgba(31,91,196,.15); --wall:#1B2329; --wall-hatch:#8C979E; --floor:#FFFFFF;
  --it-fill:#FFFFFF; --it-stroke:#56636A; --it-up:rgba(31,91,196,.05); --dim:#1F5BC4; --dim-mod:#16448F; --sel-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(27,35,41,.08); --shadow-lg:0 12px 36px rgba(27,35,41,.22);
  --r1:6px; --r2:10px; --r3:14px;
  --font:"Fira Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-brand:"Fira Sans Extra Condensed","Roboto Condensed","Avenir Next Condensed","Arial Narrow",sans-serif-condensed,"DejaVu Sans Condensed",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1C1D1A; --panel:#2A2B27; --panel2:#22231F; --ink:#F2F0E6; --muted:#B4B2A6; --line:#45463F; --line2:#64655C;
  --accent:#FFC21A; --accent-ink:#1C1D1A; --accent-soft:rgba(255,194,26,.16); --tape:#FFC21A; --tape-ink:#1C1D1A; --danger:#FF6B4D; --ok:#7BD389;
  --plan-bg:#1C1D1A; --plan-g1:rgba(242,240,230,.05); --plan-g2:rgba(242,240,230,.10); --wall:#F2F0E6; --wall-hatch:#7E7C72; --floor:#22231F;
  --it-fill:#2A2B27; --it-stroke:#B4B2A6; --it-up:rgba(255,194,26,.07); --dim:#FFC21A; --dim-mod:#FFC21A; --sel-ink:#1C1D1A;
  --shadow:none; --shadow-lg:0 12px 40px rgba(0,0,0,.55); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#1C1D1A; --panel:#2A2B27; --panel2:#22231F; --ink:#F2F0E6; --muted:#B4B2A6; --line:#45463F; --line2:#64655C;
  --accent:#FFC21A; --accent-ink:#1C1D1A; --accent-soft:rgba(255,194,26,.16); --tape:#FFC21A; --tape-ink:#1C1D1A; --danger:#FF6B4D; --ok:#7BD389;
  --plan-bg:#1C1D1A; --plan-g1:rgba(242,240,230,.05); --plan-g2:rgba(242,240,230,.10); --wall:#F2F0E6; --wall-hatch:#7E7C72; --floor:#22231F;
  --it-fill:#2A2B27; --it-stroke:#B4B2A6; --it-up:rgba(255,194,26,.07); --dim:#FFC21A; --dim-mod:#FFC21A; --sel-ink:#1C1D1A;
  --shadow:none; --shadow-lg:0 12px 40px rgba(0,0,0,.55); color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-brand);font-variant-numeric:tabular-nums lining-nums;letter-spacing:.01em}
h1,h2,.brand,.mhead h2,.pn .title,.st-projects h2{font-family:var(--f-brand);letter-spacing:.005em}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* ---------- кнопки ---------- */
.b{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--panel);font-weight:500;white-space:nowrap}
.b:hover{border-color:var(--line2);background:var(--panel2)}
.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.pri:hover{filter:brightness(1.06)}
.b.ghost{border-color:transparent;background:transparent}
.b.ghost:hover{background:var(--panel2)}
.b.ico{width:40px;padding:0}
.b.danger{color:var(--danger)}
.b:disabled{opacity:.4;cursor:default}
.b.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);padding:2px;gap:2px}
.seg button{border:0;background:transparent;min-height:34px;padding:0 12px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld input,.fld select,.inp{height:40px;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel);padding:0 10px;color:var(--ink);font-size:15px;min-width:0;width:100%}
.fld input:focus,.inp:focus,.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.unit{position:relative;display:block}.unit input{padding-right:34px}.unit::after{content:'мм';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 .unit input{padding:0 26px 0 8px}.grid3 .unit::after{right:7px;font-size:11px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;font-size:14px;cursor:pointer}
.tog input{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line2);position:relative;transition:background .15s;flex:none;margin:0;cursor:pointer}
.tog input::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tog input:checked{background:var(--accent)}.tog input:checked::after{left:21px}

/* ---------- стартовый экран ---------- */
#start{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.st-wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.st-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand .mark svg{width:22px;height:22px;stroke:var(--accent-ink);fill:none;stroke-width:2.2}
.st-hero{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:stretch}
.st-hero h1{font-size:clamp(32px,4.6vw,54px);line-height:1.02;margin:6px 0 14px;font-weight:700;max-width:14ch}
.st-hero p.lead{color:var(--muted);font-size:17px;max-width:46ch;margin:0 0 22px}
.st-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:20px;box-shadow:var(--shadow)}
.st-card h2{font-size:21px;margin:0 0 14px;font-weight:600}
.tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tpl{border:1.5px solid var(--line);border-radius:var(--r2);background:var(--panel);padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;min-height:44px;text-align:center}
.tpl svg{width:100%;height:auto;max-width:96px}
.tpl svg .r{fill:var(--plan-bg);stroke:var(--wall);stroke-width:2.5}
.tpl svg .m{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.tpl.on{border-color:var(--accent);background:var(--accent-soft)}
.plan-art{border-radius:var(--r3);background:var(--plan-bg);border:1px solid var(--line);overflow:hidden;min-height:300px;position:relative}
.plan-art svg{position:absolute;inset:0;width:100%;height:100%}
.st-projects{margin-top:34px}
.st-projects .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.st-projects h2{font-size:22px;margin:0;font-weight:600;letter-spacing:-.01em}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.pc:hover{border-color:var(--line2)}
.pc .th{aspect-ratio:16/10;background:var(--plan-bg) center/cover no-repeat;border-bottom:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.pc .meta{padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
.pc .meta .t{flex:1;min-width:0}
.pc .meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .meta small{color:var(--muted);font-size:13px}
.empty-note{color:var(--muted);padding:26px;border:1.5px dashed var(--line2);border-radius:var(--r2);text-align:center}

/* ---------- рабочий экран ---------- */
#app{height:100%;display:grid;grid-template-rows:56px 1fr;grid-template-columns:286px 1fr 304px;grid-template-areas:"top top top" "left views right"}
.top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.top .pname{display:flex;flex-direction:column;min-width:0;max-width:260px}
.top .pname input{border:0;background:transparent;font-weight:600;font-size:15px;padding:2px 4px;border-radius:4px;min-width:0;width:100%}
.top .pname input:hover{background:var(--panel2)}
.top .pname small{color:var(--muted);font-size:12px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.top .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
#left,#right{background:var(--panel);overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
#left{grid-area:left;border-right:1px solid var(--line)}
#right{grid-area:right;border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:8px 8px 0;position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px 11px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent;min-height:44px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pn{padding:14px}
.pn h3{font-size:12px;font-weight:600;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.pn h3:first-child{margin-top:2px}
.pn .title{font-size:20px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.pn .title svg{width:30px;height:30px;flex:none}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -14px 10px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.cats button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:0 13px;min-height:36px;white-space:nowrap;font-size:14px}
.cats button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.libgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lc{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none;min-height:44px}
.lc:hover{border-color:var(--accent)}
.lc .ic{width:56px;height:56px;color:var(--ink);display:grid;place-items:center}
.lc .ic svg{width:100%;height:100%}
.lc b{font-size:13px;font-weight:500;text-align:center;line-height:1.2}
.lc small{font-size:12px;color:var(--muted)}
.ghost-card{position:fixed;z-index:50;pointer-events:none;padding:8px 12px;border-radius:var(--r2);background:var(--ink);color:var(--panel);font-size:13px;font-weight:600;transform:translate(-50%,-130%);box-shadow:var(--shadow)}
.hint{font-size:13px;color:var(--muted);margin:8px 0}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel);min-height:44px}
.li.on{border-color:var(--accent);background:var(--accent-soft)}
.li .nm{flex:1;min-width:0;font-size:14px;cursor:pointer}
.li .unit{width:104px}
.li .unit input{height:36px;width:100%;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel);padding:0 30px 0 8px;font-size:14px}
.op-card{border:1px solid var(--line);border-radius:var(--r2);padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.op-card.on{border-color:var(--accent);background:var(--accent-soft)}
.pt-card select.inp{padding:0 8px;font-size:14px}
.rotf{margin-top:10px}.rotf b{color:var(--ink);font-weight:600}.rotf small{font-size:12px}
.rotf input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:2px 0}
.plan-svg .pt.sel circle{filter:none}
.op-card .hd{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px}
.sw-group{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:4px 2px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.15;min-height:44px}
.sw i{width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block;box-shadow:inset 0 -6px 10px rgba(0,0,0,.08)}
.sw.on i{outline:2.5px solid var(--accent);outline-offset:2px}
.sw.on{color:var(--ink);font-weight:600}
.k-wood i{background-image:repeating-linear-gradient(100deg,rgba(0,0,0,.08) 0 2px,transparent 2px 7px)}
.k-stone i{background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 40%),radial-gradient(circle at 70% 60%,rgba(0,0,0,.08),transparent 30%)}
.k-gloss i{background-image:linear-gradient(135deg,rgba(255,255,255,.55),transparent 45%)}
.k-tile i{background-image:linear-gradient(90deg,rgba(0,0,0,.12) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.12) 1px,transparent 1px);background-size:14px 14px}
.k-laminate i{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 1px,transparent 1px 11px)}
.k-metal i{background-image:linear-gradient(160deg,rgba(255,255,255,.5),transparent 50%,rgba(255,255,255,.25))}
.k-glass i{opacity:.7}
.price{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r2);margin-top:14px}
.price b{font-size:22px;font-family:var(--f-brand);white-space:nowrap}
.price small{display:block;color:var(--muted);font-size:12px}
.sum-t{margin-top:8px}.sum-t td{padding:5px 6px}
.approx{font-size:12.5px;color:var(--muted);margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 var(--r1) var(--r1) 0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ph3{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.unit[data-u]::after{content:attr(data-u)}.unit[data-u] input{padding-right:62px}
.spec-foot{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:14px;align-items:start}.spec-foot h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 4px}
.tscroll{overflow-x:auto}.print-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:0 0 4px;font-weight:600}.print-head span{margin-left:auto;color:var(--muted);font-weight:400;font-size:13px}
.spec-t{width:100%;border-collapse:collapse;font-size:13.5px}
.spec-t td,.spec-t th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.spec-t th{font-weight:600;color:var(--muted);font-size:12.5px}
.spec-t td.r,.spec-t th.r{text-align:right;white-space:nowrap}
.spec-t tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;font-size:19px;padding-top:10px;font-family:var(--f-brand)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.acts .b{padding:0 6px;font-size:14px}

/* ---------- виды ---------- */
#views{grid-area:views;position:relative;display:grid;grid-template-columns:1fr;min-width:0;min-height:0;background:var(--bg)}
#views.both{grid-template-columns:1.25fr 1fr;gap:1px;background:var(--line)}
#v3,#v2{position:relative;min-width:0;min-height:0;overflow:hidden}
#v2{background:var(--plan-bg)}
#views.l-3d #v2,#views.l-plan #v3{display:none}
.v3-canvas{display:block;touch-action:none;position:absolute;inset:0}
.v-err{display:grid;place-items:center;height:100%;color:var(--muted);padding:20px;text-align:center}
.vtools{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:6px;z-index:3;flex-wrap:wrap;justify-content:space-between;pointer-events:none}
.vtools>*{pointer-events:auto}
.vtools .row{gap:6px}
.vtools .b{box-shadow:var(--shadow)}
.vchips{display:flex;gap:6px;flex-wrap:wrap}
.vchips .seg{box-shadow:var(--shadow)}
.vbadge{position:absolute;right:12px;top:12px;z-index:3;display:flex;flex-direction:column;gap:6px}
.vbadge .b{box-shadow:var(--shadow)}
.vlabel{position:absolute;left:12px;top:12px;z-index:3;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel);padding:4px 9px;border-radius:20px;border:1px solid var(--line)}
.selbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.selbar .b{border:0;min-height:44px;font-size:14px;padding:0 12px}
.selbar .nm{align-self:center;padding:0 8px 0 6px;font-weight:600;font-size:14px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;background:var(--ink);color:var(--panel);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.drawbar .b{background:transparent;color:inherit;border-color:rgba(255,255,255,.25);min-height:38px}
.drawbar .b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.drawbar label{display:flex;gap:6px;align-items:center;font-size:14px}
.drawbar span{font-size:14px}

/* план (SVG) */
.plan-svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none;position:absolute;inset:0}
.plan-svg .bgrid{fill:var(--plan-bg)}
.plan-svg .g1{stroke:var(--plan-g1)}.plan-svg .g2{stroke:var(--plan-g2)}
.plan-svg .floor{fill:var(--floor)}
.plan-svg .hb{fill:var(--plan-bg)}.plan-svg .hl{stroke:var(--wall-hatch)}
.plan-svg .wall{fill:url(#hatch);stroke:var(--wall);cursor:pointer}
.plan-svg .wall.sel{stroke:var(--accent);fill:var(--accent-soft)}
.plan-svg .op{fill:var(--floor);stroke:var(--wall);cursor:ew-resize}
.plan-svg .op.niche{fill:var(--plan-bg);stroke-dasharray:4 3}
.plan-svg .op.sel{stroke:var(--accent);fill:var(--accent-soft)}
.plan-svg .win{stroke:var(--wall);fill:none}
.plan-svg .door{stroke:var(--wall)}.plan-svg .swing{stroke:var(--wall);fill:none;stroke-dasharray:6 4;opacity:.7}
.plan-svg .it polygon{fill:var(--it-fill);stroke:var(--it-stroke);cursor:grab}
.plan-svg .it.up polygon{fill:var(--it-up);stroke-dasharray:7 4}
.plan-svg .it .front{stroke:var(--it-stroke);pointer-events:none}
.plan-svg .it text{fill:var(--ink);pointer-events:none;font-weight:500}
.plan-svg .it .wv{font-weight:700}
.plan-svg .it.sel polygon{fill:var(--accent-soft);stroke:var(--accent)}
.plan-svg .it.sel .front{stroke:var(--accent)}
.plan-svg .it.bad polygon{fill:rgba(210,58,46,.18);stroke:var(--danger)}
.plan-svg .dim path{stroke:var(--dim);fill:none;stroke-width:.9px;vector-effect:non-scaling-stroke}
.plan-svg .dim text{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--plan-bg);stroke-width:3px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.plan-svg .dim.total path{stroke:var(--muted)}
.plan-svg .dim.total text{font-weight:700}
.plan-svg .dim.mod text{fill:var(--dim-mod)}
.plan-svg text{font-family:var(--f-brand)}
.plan-svg .dim.gap path{stroke-dasharray:3 3}
.plan-svg .dim.gap text{fill:var(--muted);font-weight:500}
.plan-svg .vh{fill:var(--panel);stroke:var(--accent);cursor:move}
.plan-svg .drawl{fill:none;stroke:var(--accent);stroke-linejoin:round}
.plan-svg .dv{fill:var(--panel);stroke:var(--accent)}.plan-svg .dv.close{fill:var(--tape)}
.plan-svg .dc{fill:var(--accent)}
.plan-svg .drawt{fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--plan-bg);stroke-width:4px;vector-effect:non-scaling-stroke}

/* ---------- окна поверх ---------- */
#modal{position:fixed;inset:0;z-index:40;background:rgba(17,22,26,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.mcard{background:var(--panel);border-radius:var(--r3);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;width:100%}
.mcard.sm{max-width:520px}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:17px;margin:0;flex:1;font-weight:600}
.mbody{padding:16px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.prog{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:14px 0 6px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}
.photo-img{display:block;max-width:100%;max-height:68vh;margin:0 auto;border-radius:var(--r2)}
.elev-wrap{background:#fff;border-radius:var(--r2);border:1px solid var(--line);overflow:auto;-webkit-overflow-scrolling:touch}
@media (max-width:820px){.elev-wrap svg{min-width:760px}.pgrid,.spec-foot{grid-template-columns:1fr}}
.elev-wrap svg{display:block;width:100%;height:auto}
@media (min-width:821px){.mcard.elev .elev-wrap svg{max-height:calc(100dvh - 250px)}}
.elev-wrap svg text{font-family:var(--font)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:0 14px;min-height:38px}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:0 12px;min-height:48px;border-radius:var(--r1);text-align:left;font-size:15px}
.menu button:hover{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--ink);color:var(--panel);padding:11px 18px;border-radius:12px;font-size:14px;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.dock{display:none}
.sheet-close{display:none}

/* ---------- телефон ---------- */
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:52px 1fr 66px;grid-template-areas:"top" "views" "dock"}
  .top{gap:2px;padding:0 4px}
  .top .pname{max-width:none;flex:1}
  .top .sp{display:none}
  .top .desk,.vtools .desk{display:none!important}
  #views.both{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  #left,#right{position:fixed;left:0;right:0;bottom:66px;z-index:20;max-height:72dvh;border:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -14px 40px -16px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .22s ease;visibility:hidden}
  #left.open,#right.open{transform:none;visibility:visible}
  .sheet-close{display:inline-flex;position:absolute;right:6px;top:6px;z-index:3}
  #right .pn{padding-top:8px}
  .tabs{padding-right:52px}
  .libgrid{grid-template-columns:repeat(3,1fr)}
  .dock{grid-area:dock;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:21}
  .dock button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:500;min-height:56px}
  .dock button.on{color:var(--accent)}
  .dock button:disabled{opacity:.35}
  .dock svg.i{width:23px;height:23px}
  .selbar{bottom:12px}
  .selbar .nm{display:none}
  .selbar .b span{display:none}
  .vtools{left:8px;right:8px;top:8px}
  .vbadge{right:8px;top:8px}
  .st-hero{grid-template-columns:1fr}
  .plan-art{min-height:200px;order:-1}
  .tpls{grid-template-columns:repeat(2,1fr)}
  #toast{bottom:84px}
  #modal{padding:0;align-items:flex-end}
  .mcard{border-radius:18px 18px 0 0;max-height:94dvh}
}
@media (max-width:420px){ .vchips .seg button{padding:0 9px;font-size:13px} }

/* развёртка: чертёж + таблица модулей и точек */
.elev-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 24px;margin-top:12px}
.elev-legend .spec-t{font-size:13px}
.pt-dot{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;color:#fff;font-size:10.5px;font-weight:700;margin-right:6px;padding:0 4px;vertical-align:-4px;font-family:var(--f-brand)}

/* ---------- печать ---------- */
@page{size:A4 landscape;margin:9mm}
@media print{
  html,body{height:auto;overflow:visible;background:#fff!important;color:#1B2329}
  :root{--panel:#fff;--panel2:#f3f4f1;--ink:#1B2329;--muted:#56636A;--line:#C9CFD1;--accent:#1F5BC4;--accent-soft:rgba(31,91,196,.08)}
  .mhead{display:none!important}
  .mbody{padding:0!important}
  .elev-wrap{border:0;border-radius:0;overflow:visible}
  .elev-wrap svg{min-width:0!important;max-height:150mm;width:100%}
  .mcard.elev .elev-legend{grid-template-columns:1fr 1fr;font-size:11px}
  .spec-t{font-size:11.5px}
  .tscroll{overflow:visible}
  .elev-sheet,.spec-t tr{break-inside:avoid}
  body>*:not(#modal){display:none!important}
  #modal{position:static;background:#fff;padding:0;display:block}
  .mcard{box-shadow:none;max-height:none;border-radius:0}
  .mhead .b,.mfoot,.chips,.noprint{display:none!important}
  .mbody{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){#stOpenFile span{display:none}.st-head #stBack{padding-left:6px;padding-right:8px}}
/* быстродействие на телефоне: без задержки двойного касания, нажатие видно сразу */
/* :where — нулевая важность: свои touch-action:none (перетаскивание) не перебиваем */
:where(button,a[href],label,summary,select,[role=button],.b,.pc,.chip,.tab){touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:is(.b,.pc,.menu button,.tab,.chip):active:not(:disabled){filter:brightness(.92);transition:none}
.b:active:not(:disabled){transform:scale(.96)}

function build(THREE,itemId,o){
  o=o||{}; var it=null; for(var i=0;i<items.length;i++) if(items[i].id===itemId){ it=items[i]; break; }
  if(!it) throw new Error('Нет модуля: '+itemId);
  var p={}; it.params.forEach(function(q){ p[q.key]=q.def; }); var op=o.params||{}; for(var k in op) if(op[k]!==undefined&&op[k]!==null) p[k]=op[k];
  var cl=function(v,a,b2,def){ v=parseFloat(v); if(!isFinite(v)) v=def; return Math.max(a,Math.min(b2,v)); };
  var w=cl(o.w,it.wMin,it.wMax,it.w), h=cl(o.h,it.hMin,it.hMax,it.h), d=cl(o.d,it.dMin,it.dMax,it.d);
  var b=new Bld(THREE,{params:p,mats:o.mats,quality:o.quality});

  return g;
}

function fromOrder(order,THREE){
  THREE=THREE||window.THREE; if(typeof order==='string') order=JSON.parse(order);
  var parts=((order&&order.parts)||[]).filter(function(q){ return Array.isArray(q.box)&&q.box.length===6; });
  var M=window.DZ_MAT, matC={};
  function roleOf(q){ var s=(q.name||'')+' '+(q.material||''); if(/стекл|зеркал/i.test(s)) return 'glass'; if(/столешн/i.test(s)) return 'top'; if(/сталь|металл|ручк/i.test(q.material||'')) return 'metal'; if(/фасад|двер|фронт|ящик.*фас|цоколь/i.test(q.name||'')) return 'front'; return 'body'; }
  function matFor(q,role){ var k=q.material+'|'+role; if(matC[k]) return matC[k]; var id=M?M.match(q.material,role):'ldsp_white';
    return matC[k]={id:id,m:M?M.material(THREE,id,{quality:'fast'}):new THREE.MeshStandardMaterial({color:0xdddddd})}; }
  // группы по блокам; «лицевые» блоки раздаём ближайшим корпусам
  var G={}, order2=[];
  parts.forEach(function(q){ var k=q.mod||''; if(!G[k]){ G[k]=[]; order2.push(k); } G[k].push(q); });
  if(order2.length===1&&order2[0]==='') G={'Изделие':parts}, order2=['Изделие'];
  function bb(ps){ var lo=[1e9,1e9,1e9], hi=[-1e9,-1e9,-1e9]; ps.forEach(function(q){ for(var i=0;i<3;i++){ lo[i]=Math.min(lo[i],q.box[i]); hi[i]=Math.max(hi[i],q.box[i+3]); } }); return [lo,hi]; }
  var faceOnly=function(ps){ return ps.every(function(q){ return /фасад|стекл|вставк/i.test(q.name||''); }); };
  var struct=order2.filter(function(k){ return !faceOnly(G[k])&&!/лицев/i.test(k); });
  if(struct.length){ var B={}; struct.forEach(function(k){ B[k]=bb(G[k]); });
    order2.forEach(function(k){ if(struct.indexOf(k)>=0) return; var keep=[];
      G[k].forEach(function(q){ var qb=q.box, th=[qb[3]-qb[0],qb[4]-qb[1],qb[5]-qb[2]], ta=th.indexOf(Math.min(th[0],th[1],th[2])), best=null, bs=-1;
        struct.forEach(function(s){ var near=1e9; G[s].forEach(function(o){ var dd=0; for(var i=0;i<3;i++){ var gap=Math.max(o.box[i]-qb[i+3],qb[i]-o.box[i+3],0); dd+=gap*gap; } if(dd<near) near=dd; });
          if(near>40*40) return; var b2=B[s], ov=1; for(var i=0;i<3;i++){ if(i===ta) continue; ov*=Math.max(0,Math.min(b2[1][i],qb[i+3])-Math.max(b2[0][i],qb[i])); }
          if(ov>bs){ bs=ov; best=s; } });
        if(best&&bs>0) G[best].push(q); else keep.push(q); });
      G[k]=keep; }); }
  var out=[];
  order2.forEach(function(k){ var ps=G[k]; if(!ps||!ps.length) return; var r=bb(ps), lo=r[0], hi=r[1], g=new THREE.Group();
    ps.forEach(function(q){ var b=q.box, sx=Math.max(b[3]-b[0],0.5), sy=Math.max(b[4]-b[1],0.5), sz=Math.max(b[5]-b[2],0.5), role=roleOf(q), mm=matFor(q,role);
      var m=new THREE.Mesh(boxGeo(THREE,sx,sy,sz),mm.m); m.position.set(b[0]-lo[0]+sx/2,b[1]-lo[1]+sy/2,b[2]-lo[2]+sz/2);
      m.castShadow=m.receiveShadow=true; m.name=q.name||''; m.userData={part:role,decor:mm.id,orderMaterial:q.material||'',art:q.art||''}; g.add(m); });
    var name=String(k).replace(/#\d+$/,'')||'Модуль'; g.name=name;
    out.push({name:name,w:Math.round(hi[0]-lo[0]),h:Math.round(hi[1]-lo[1]),d:Math.round(hi[2]-lo[2]),group:g,x:lo[0],y:lo[1],z:lo[2]}); });
  return out;
}

});

DZ.ITEM_DEF = { hob: { y: 858 }, sink: { y: 858 }, splash: { y: 858, h: 542 }, hood: { y: 1520 }, cornice: { y: 2120 }, wallpanel: { y: 0 } };

];

/* ---------- проём: типы ---------- */
DZ.OPEN_TYPES = {

  'дверь': { name: 'Дверь', w: 800, h: 2050, y: 0, depth: 0 },
  'проём': { name: 'Проём', w: 900, h: 2100, y: 0, depth: 0 },
  'ниша': { name: 'Ниша', w: 600, h: 900, y: 1000, depth: 120 }
};

/* точки на стенах из замера (ключи как в «Замере»; русские названия тоже понимаем) */
DZ.POINT_TYPES = {
  roz: { s: 'Р', color: '#d9822b', name: 'Розетка' }, vyk: { s: 'Вк', color: '#b08a1e', name: 'Выключатель' },
  xv: { s: 'ХВ', color: '#2f7fd1', name: 'Холодная вода' }, gv: { s: 'ГВ', color: '#d2513a', name: 'Горячая вода' },
  kan: { s: 'К', color: '#6b5b4b', name: 'Канализация' }, gaz: { s: 'Г', color: '#e0a100', name: 'Газ' },
  tr: { s: 'Т', color: '#7d8a8f', name: 'Труба' }, ven: { s: 'Вн', color: '#5a6b78', name: 'Вентиляция' }, svet: { s: 'С', color: '#c9a400', name: 'Свет' }
};
const PT_ALIAS = { 'розетка': 'roz', 'выключатель': 'vyk', 'вода': 'xv', 'холодная вода': 'xv', 'горячая вода': 'gv', 'канализация': 'kan', 'газ': 'gaz', 'труба': 'tr', 'вытяжка': 'ven', 'вентиляция': 'ven', 'свет': 'svet' };
const OP_ALIAS = { window: 'окно', door: 'дверь', niche: 'ниша', opening: 'проём', 'окно': 'окно', 'дверь': 'дверь', 'ниша': 'ниша', 'проём': 'проём', 'проем': 'проём' };

/* ---------- импорт замера «Замер» (Вертакс):
   {v, units:'mm', name, height, rect, walls:[{name,len,angle,height}], openings:[{wall,type:'window'|'door',x,y,w,h}], points:[{wall,type,x,y,note}], notes}
   стены идут ПРОТИВ часовой стрелки (вид сверху); angle — внутренний угол между этой стеной и следующей (90 по умолчанию);
   две стены и rect:true — прямоугольник из 4 стен. x — от начала стены, y — от пола ---------- */
DZ.fromZamer = (Z, name) => {
  if (!Z || !Array.isArray(Z.walls) || !Z.walls.length) throw new Error('В замере нет стен');
  let walls = Z.walls.slice();
  if (walls.length === 2 || (Z.rect && walls.length < 4)) walls = [walls[0], walls[1] || walls[0], walls[0], walls[1] || walls[0]].map(w => Object.assign({}, w, { angle: 90 }));
  if (walls.length < 3) throw new Error('В замере мало стен');
  const pts = [[0, 0]]; let hd = 0;
  walls.forEach((w, i) => {
    const len = +w.len || +w.length || 0; if (len <= 0) throw new Error('Стена ' + (i + 1) + ': нет длины');
    const p = pts[pts.length - 1]; pts.push([Math.round(p[0] + Math.cos(hd) * len), Math.round(p[1] + Math.sin(hd) * len)]);
    hd -= (180 - (+w.angle || 90)) * Math.PI / 180; // против часовой на плане (ось Y плана направлена вниз)
  });
  const last = pts[pts.length - 1];
  if (Math.hypot(last[0], last[1]) < 80) pts.pop(); // замкнулось
  const H = +Z.height || Math.max(...walls.map(w => +w.height || 0)) || 2700;
  const P = DZ.newProject({ tpl: 'empty', W: 3000, D: 3000, H, name: name || Z.name || 'Замер ' + new Date().toLocaleDateString('ru-RU') });
  const n = pts.length, rev = G.area(pts) < 0;
  P.room.pts = rev ? pts.slice().reverse() : pts; P.room.openings = [];
  const wc = Math.min(walls.length, n), mapW = i => rev ? ((n - 2 - i) % n + n) % n : i;
  const wl = i => G.wall(P.room, mapW(i)).L, mapX = (i, x, w) => rev ? wl(i) - x - (w || 0) : x;
  (Z.openings || []).forEach(o => {
    const t = OP_ALIAS[String(o.type || '').toLowerCase()] || 'окно', d = DZ.OPEN_TYPES[t], wi = (+o.wall || 0);
    if (wi < 0 || wi >= wc) return; const ow = +o.w || d.w;
    P.room.openings.push({ id: uid(), type: t, wall: mapW(wi), off: Math.max(0, mapX(wi, +o.x || 0, ow)), w: ow, h: +o.h || d.h, y: o.y != null ? +o.y : d.y, depth: +o.depth || d.depth });
  });
  P.room.points = (Z.points || []).filter(p => +p.wall >= 0 && +p.wall < wc).map(p => {
    const k = String(p.type || '').toLowerCase(), type = DZ.POINT_TYPES[k] ? k : (PT_ALIAS[k] || 'tr');
    return { id: uid(), type, wall: mapW(+p.wall), x: mapX(+p.wall, +p.x || 0), y: +p.y || 300, note: p.note || '' };
  });
  const hs = walls.slice(0, wc).map(w => +w.height || 0);
  const nm = walls.slice(0, wc).map((w, i) => String(w.name || '').trim().slice(0, 6));
  if (nm.some(Boolean) && G.wallCount(P.room) === wc) P.room.wallNames = Array.from({ length: n }, (_, i) => nm[rev ? ((n - 2 - i) % n + n) % n : i] || String(i + 1));
  if (hs.some(h => h > 0 && Math.abs(h - H) >= 10)) P.room.wallH = Array.from({ length: n }, (_, i) => { const j = rev ? ((n - 2 - i) % n + n) % n : i; return hs[j] || H; });
  P.notes = Z.notes || ''; P.zamer = true;
  return P;
};

/* ---------- геометрия комнаты ---------- */
const G = DZ.geo = {
  area(pts) { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; },
  wallCount(room) { return room.closed ? room.pts.length : Math.max(0, room.pts.length - 1); },
  wall(room, i) {
    const n = room.pts.length, a = room.pts[i], b = room.pts[(i + 1) % n];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const ccw = G.area(room.pts) >= 0;
    const nx = ccw ? -uy : uy, ny = ccw ? ux : -ux; // внутрь комнаты
    return { i, a, b, L, ux, uy, nx, ny, rot: Math.atan2(nx, ny) };
  },
  walls(room) { const r = []; for (let i = 0; i < G.wallCount(room); i++) r.push(G.wall(room, i)); return r; },
  // точка → (вдоль стены t, от стены s)
  local(w, x, y) { const px = x - w.a[0], py = y - w.a[1]; return { t: px * w.ux + py * w.uy, s: px * w.nx + py * w.ny }; },
  bbox(pts) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; pts.forEach(p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }); return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 }; },
  // углы модуля на плане
  corners(it) {
    const c = Math.cos(it.rot), s = Math.sin(it.rot), ax = [c, -s], az = [s, c], hw = it.w / 2, hd = it.d / 2;
    return [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]].map(([u, v]) => [it.x + ax[0] * u + az[0] * v, it.z + ax[1] * u + az[1] * v]);
  },
  axes(rot) { const c = Math.cos(rot), s = Math.sin(rot); return { ax: [c, -s], az: [s, c] }; },
  obbHit(A, B) {
    const ca = G.corners(A), cb = G.corners(B), ax = [];
    [A, B].forEach(o => { const q = G.axes(o.rot); ax.push(q.ax, q.az); });
    for (const v of ax) {
      const pa = ca.map(p => p[0] * v[0] + p[1] * v[1]), pb = cb.map(p => p[0] * v[0] + p[1] * v[1]);
      if (Math.max(...pa) <= Math.min(...pb) + 2 || Math.max(...pb) <= Math.min(...pa) + 2) return false;
    }
    return true;
  },
  angEq(a, b) { let d = (a - b) % (2 * Math.PI); if (d < 0) d += 2 * Math.PI; return d < 0.02 || d > 2 * Math.PI - 0.02; },
  normAng(a) { a = a % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a; },
  pointInPoly(x, y, pts) { let ins = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins; } return ins; }
};

/* высота конкретной стены (по замеру стены бывают разной высоты) */
DZ.wallH = (rm, i) => (rm.wallH && +rm.wallH[i]) || rm.h;
/* имя стены: из замера (А, Б, В…) или номер */
DZ.wallName = i => { const N = DZ.P && DZ.P.room.wallNames; return (N && N[i]) || String(i + 1); };

/* ---------- проект ---------- */
DZ.P = null;          // текущий проект
DZ.sel = [];          // id выбранных модулей
DZ.selWall = -1;      // выбранная стена
DZ.selOpen = null;    // id выбранного проёма
DZ.selPt = null;      // id выбранной точки (розетка, вода…)

DZ.newRoom = (W, D, H) => ({ pts: [[0, 0], [W, 0], [W, D], [0, D]], closed: true, h: H || 2700, t: 120, openings: [], ceiling: false, floor: true });

DZ.makeItem = (libId, extra) => {
  const li = DZ.libItem(libId) || {};
  const params = {};
  (li.params || []).forEach(p => { params[p.key] = p.def !== undefined ? p.def : (p.default !== undefined ? p.default : (p.value !== undefined ? p.value : (p.type === 'bool' ? false : p.type === 'sel' ? optVal((p.options || p.opts || p.values || [])[0]) : p.min || 0))); });
  const it = Object.assign({ id: uid(), lib: libId, name: li.name || 'Модуль', w: li.w || 600, h: li.h || 720, d: li.d || 560, x: 0, z: 0, rot: 0, y: li.y != null ? li.y : li.mount === 'wall' ? 1400 : 0, params, mats: {}, mount: li.mount || 'floor' }, DZ.ITEM_DEF[libId] || {}, extra || {});
  return it;
};
function optVal(o) { if (o == null) return ''; if (typeof o !== 'object') return o; return o.v !== undefined ? o.v : o.value !== undefined ? o.value : o.id !== undefined ? o.id : o.name; }
function optName(o) { if (o == null) return ''; if (typeof o !== 'object') return String(o); return o.name || o.label || String(optVal(o)); }
DZ.optVal = optVal; DZ.optName = optName;

DZ.TEMPLATES = [
  { id: 'line', name: 'Прямая кухня', W: 3400, D: 2600, svg: '<rect x="6" y="6" width="52" height="40" class="r"/><rect x="8" y="8" width="44" height="7" class="m"/>' },
  { id: 'corner', name: 'Угловая кухня', W: 3200, D: 3000, svg: '<rect x="6" y="6" width="52" height="40" class="r"/><rect x="8" y="8" width="40" height="7" class="m"/><rect x="8" y="15" width="7" height="22" class="m"/>' },
  { id: 'u', name: 'П-образная', W: 3000, D: 3200, svg: '<rect x="6" y="6" width="52" height="40" class="r"/><rect x="8" y="8" width="48" height="7" class="m"/><rect x="8" y="15" width="7" height="20" class="m"/><rect x="49" y="15" width="7" height="20" class="m"/>' },
  { id: 'empty', name: 'Пустая комната', W: 4000, D: 3500, svg: '<rect x="6" y="6" width="52" height="40" class="r"/>' }
];

/* подбор модулей для шаблона по библиотеке (без жёсткой привязки к id) */
DZ.pickLib = (re, mount, prefW) => {
  const L = DZ.lib().items.filter(i => (!mount || (i.mount || 'floor') === mount) && re.test(i.name + ' ' + i.cat + ' ' + ((DZ.lib().cats.find(c => c.id === i.cat) || {}).name || '')));
  if (!L.length) return null;
  if (prefW) { L.sort((a, b) => Math.abs(a.w - prefW) - Math.abs(b.w - prefW)); }
  return L[0];
};

DZ.newProject = (opt) => {
  const H = opt.H || 2700, room = DZ.newRoom(opt.W, opt.D, H);
  room.openings.push(Object.assign({ id: uid(), type: 'дверь', wall: 2, off: Math.max(100, opt.W - 1100) }, pick(DZ.OPEN_TYPES['дверь'])));
  if (opt.tpl !== 'empty') room.openings.push(Object.assign({ id: uid(), type: 'окно', wall: 1, off: Math.max(200, opt.D / 2 - 600) }, pick(DZ.OPEN_TYPES['окно'])));
  const P = { id: uid(), name: opt.name || 'Новый проект', client: opt.client || '', created: Date.now(), updated: Date.now(), tpl: opt.tpl, room, items: [], mats: DZ.defaultMats() };
  return P;
};
function pick(t) { return { w: t.w, h: t.h, y: t.y, depth: t.depth }; }

/* расставить кухню по шаблону */
DZ.pickId = (ids, re, mount, w) => { for (const id of ids) if (DZ.libItem(id)) return DZ.libItem(id); return re ? DZ.pickLib(re, mount, w) : null; };
DZ.fillTemplate = (P) => {
  const tpl = P.tpl; if (tpl === 'empty' || !DZ.lib().items.length) return;
  const L = {
    door: DZ.pickId(['low_door'], /двер|тумб/i, 'floor', 600), drw: DZ.pickId(['low_drawers'], /ящик/i, 'floor', 600),
    sink: DZ.pickId(['low_sink'], /мойк/i, 'floor', 800), dish: DZ.pickId(['low_dishwasher'], /посудом/i, 'floor', 600),
    oven: DZ.pickId(['low_oven'], /духов|плит/i, 'floor', 600), corner: DZ.pickId(['low_corner_l'], /углов/i, 'floor', 900),
    fridge: DZ.pickId(['tall_fridge'], /холод/i, 'floor'), tallOven: DZ.pickId(['tall_oven'], /пенал/i, 'floor'),
    up: DZ.pickId(['up_door'], /верх|навес/i, 'wall', 600), upGlass: DZ.pickId(['up_glass'], null), upHood: DZ.pickId(['up_hood'], null),
    upCorner: DZ.pickId(['up_corner'], null), hob: DZ.pickId(['hob'], null)
  };
  const walls = G.walls(P.room), add = [];
  const mk = (li, w, t, extra) => { if (!li) return null; const it = DZ.makeItem(li.id, extra); DZ.placeOnWall(it, w, t); return it; };
  // ряд нижних модулей от tFrom вперёд (dir=1) или от tFrom назад (dir=-1)
  const run = (w, tFrom, tTo, seq, dir) => {
    const out = []; let t = tFrom;
    seq.forEach(li => {
      if (!li) return; const iw = li.w;
      if (dir > 0 ? t + iw > tTo + 0.5 : t - iw < tTo - 0.5) return;
      const it = mk(li, w, dir > 0 ? t : t - iw); if (DZ.hitsOpening(P, it)) return;
      out.push(it); t += dir * iw;
    });
    return out;
  };
  const uppers = (w, bases) => bases.forEach(b => {
    if (b.h > 1200 || !L.up) return; const c = G.local(w, b.x, b.z), t0 = c.t - b.w / 2;
    let li = L.up, extra = { w: b.w };
    if (b.lib === 'low_oven' && L.upHood) { li = L.upHood; extra = { w: b.w, y: 1400 + 720 - L.upHood.h }; }
    else if (b.lib === 'low_drawers' && L.upGlass) li = L.upGlass;
    if (b.lib === 'low_corner_l') { if (!L.upCorner) return; li = L.upCorner; extra = {}; }
    const u = mk(li, w, t0, extra); if (u && !DZ.hitsOpening(P, u)) add.push(u);
    if (b.lib === 'low_oven' && L.hob) { const h = mk(L.hob, w, t0); if (h) { h.x += 0; add.push(h); } }
  });
  const W0 = walls[0], W1 = walls[1], W3 = walls[3];
  if (tpl === 'line') {
    const b = run(W0, 0, W0.L, [L.fridge, L.door, L.sink, L.dish, L.drw, L.oven, L.door, L.drw, L.door], 1);
    add.push(...b); uppers(W0, b);
  } else if (tpl === 'corner') {
    const b0 = run(W0, 0, W0.L, [L.corner, L.sink, L.dish, L.drw, L.oven, L.door, L.door], 1);
    const cd = L.corner ? L.corner.d : 600;
    const b3 = run(W3, W3.L - cd, 0, [L.drw, L.door, L.fridge], -1);
    add.push(...b0, ...b3); uppers(W0, b0); uppers(W3, b3);
  } else if (tpl === 'u') {
    const d = 580;
    const b3 = run(W3, W3.L, 0, [L.drw, L.door, L.fridge], -1);
    const b0 = run(W0, d, W0.L - d, [L.door, L.sink, L.dish, L.drw, L.door], 1);
    const b1 = run(W1, 0, W1.L, [L.oven, L.drw, L.door, L.door], 1);
    add.push(...b3, ...b0, ...b1); uppers(W3, b3); uppers(W0, b0); uppers(W1, b1);
  }
  P.items.push(...add.filter(Boolean));
  DZ.fixAll(P);
};
DZ.placeOnWall = (it, w, t) => {
  it.rot = w.rot;
  const along = t + it.w / 2, off = it.d / 2;
  it.x = w.a[0] + w.ux * along + w.nx * off; it.z = w.a[1] + w.uy * along + w.ny * off;
};
// после шаблона сдвигаем модули, налезающие друг на друга, вдоль своей стены
DZ.fixAll = (P) => {
  for (let pass = 0; pass < 3; pass++) {
    P.items.forEach((it, i) => {
      P.items.forEach((o, j) => {
        if (j >= i || DZ.NOCOLL.test(it.lib) || DZ.NOCOLL.test(o.lib) || !DZ.vOverlap(it, o) || !G.obbHit(it, o)) return;
        // удаляем более поздний
        o._kill = true;
      });
    });
    P.items = P.items.filter(o => !o._kill);
  }
};
DZ.vOverlap = (a, b) => a.y < b.y + b.h - 1 && b.y < a.y + a.h - 1;
DZ.hitsOpening = (P, it) => {
  const walls = G.walls(P.room);
  return P.room.openings.some(o => {
    const w = walls[o.wall]; if (!w || o.type === 'ниша') return false;
    if (!G.angEq(it.rot, w.rot)) return false;
    const c = G.local(w, it.x, it.z); if (c.s - it.d / 2 > 60) return false;
    return c.t + it.w / 2 > o.off && c.t - it.w / 2 < o.off + o.w && it.y < o.y + o.h && it.y + it.h > o.y;
  });
};

/* ---------- примагничивание ---------- */
DZ.SNAP = 260;
DZ.snap = (it, x, z, others) => {
  const P = DZ.P, li = DZ.libItem(it.lib) || {};
  let res = { x: r10(x), z: r10(z), rot: it.rot, wall: -1 };
  if (it.mount !== 'free') {
    let best = null;
    G.walls(P.room).forEach(w => {
      const c = G.local(w, x, z);
      // расстояние от задней стенки модуля до стены при повороте «к стене»
      const back = c.s - it.d / 2;
      if (c.t < -it.w / 2 || c.t > w.L + it.w / 2) return;
      if (Math.abs(back) < DZ.SNAP && (!best || Math.abs(back) < best.d)) best = { w, d: Math.abs(back), t: c.t };
    });
    if (best) {
      const w = best.w, t = clamp(best.t, it.w / 2, Math.max(it.w / 2, w.L - it.w / 2));
      res = { x: w.a[0] + w.ux * t + w.nx * it.d / 2, z: w.a[1] + w.uy * t + w.ny * it.d / 2, rot: w.rot, wall: w.i };
      // шаг 10 мм вдоль стены
      const tt = r10(t - it.w / 2) + it.w / 2; res.x = w.a[0] + w.ux * tt + w.nx * it.d / 2; res.z = w.a[1] + w.uy * tt + w.ny * it.d / 2;
    }
  }
  // к соседям
  const q = G.axes(res.rot);
  let bestN = null;
  (others || P.items).forEach(o => {
    if (o.id === it.id || DZ.sel.length > 1 && DZ.sel.includes(o.id) || !G.angEq(o.rot, res.rot)) return;
    if (!(it.y < o.y + o.h && o.y < it.y + it.h) && !(Math.abs(it.y - o.y) < 600)) return;

/* ---------- столкновения ---------- */

/* модули у стены (для размеров и развёртки) */
DZ.itemsOnWall = (wi, tol) => {
  const w = G.wall(DZ.P.room, wi); tol = tol == null ? 40 : tol;
  return DZ.P.items.filter(it => G.angEq(it.rot, w.rot)).map(it => { const c = G.local(w, it.x, it.z); return { it, t0: c.t - it.w / 2, t1: c.t + it.w / 2, back: c.s - it.d / 2 }; })
    .filter(o => Math.abs(o.back) < tol && o.t1 > 0 && o.t0 < w.L).sort((a, b) => a.t0 - b.t0);
};

/* ---------- смета: строки по одинаковым модулям, цена — price.js (правила сметы цеха) ---------- */
DZ.spec = () => {
  const rows = new Map(), pj = DZ.price ? DZ.price.project(DZ.P) : null;
  DZ.P.items.forEach((it, i) => {
    const k = [it.lib, it.name, it.w, it.h, it.d, JSON.stringify(it.params), JSON.stringify(it.mats)].join('|');
    const p = pj ? pj.items[i].p : null;
    const r = rows.get(k) || { name: it.name, w: it.w, h: it.h, d: it.d, n: 0, price: p ? p.total : 0, det: p, ids: [] };
    r.n++; r.ids.push(it.id); rows.set(k, r);

};

/* ---------- хранение ---------- */
DZ.store = {
  index() { return LS.get('dz-index', []) || []; },
  save(P, thumb) {
    P.updated = Date.now();
    const ok = LS.set('dz-p-' + P.id, P);

    ix.unshift({ id: P.id, name: P.name, client: P.client, updated: P.updated, n: P.items.length, thumb: thumb || old.thumb || '' });

  load(id) { return LS.get('dz-p-' + id, null); },

DZ.validate = (P) => {

  P.id = P.id || uid(); P.name = P.name || 'Проект'; P.mats = Object.assign(DZ.defaultMats(), P.mats || {});
  P.room.openings = P.room.openings || []; P.room.points = (P.room.points || []).map(p => Object.assign({ id: uid() }, p)); P.room.h = P.room.h || 2700; P.room.t = P.room.t || 120;
  if (P.room.closed === undefined) P.room.closed = true; if (P.room.floor === undefined) P.room.floor = true;
  P.items.forEach(it => { it.id = it.id || uid(); it.params = it.params || {}; it.mats = it.mats || {}; it.y = it.y || 0; it.rot = it.rot || 0; it.mount = it.mount || ((DZ.libItem(it.lib) || {}).mount) || 'floor'; });

};

/* ---------- отмена / повтор ---------- */
DZ.hist = { u: [], r: [] };
DZ.snapshot = () => JSON.stringify({ room: DZ.P.room, items: DZ.P.items, mats: DZ.P.mats });
DZ.push = () => { DZ.hist.u.push(DZ.snapshot()); if (DZ.hist.u.length > 80) DZ.hist.u.shift(); DZ.hist.r = []; };
DZ.restore = s => { const o = JSON.parse(s); DZ.P.room = o.room; DZ.P.items = o.items; DZ.P.mats = o.mats; DZ.sel = DZ.sel.filter(id => DZ.P.items.some(i => i.id === id)); if (DZ.selWall >= G.wallCount(DZ.P.room)) DZ.selWall = -1; };
DZ.undo = () => { if (!DZ.hist.u.length) return false; DZ.hist.r.push(DZ.snapshot()); DZ.restore(DZ.hist.u.pop()); return true; };
DZ.redo = () => { if (!DZ.hist.r.length) return false; DZ.hist.u.push(DZ.snapshot()); DZ.restore(DZ.hist.r.pop()); return true; };

/* ---------- настройки ---------- */
DZ.settings = Object.assign({ theme: '', quality: '', dims: false, layout: '' }, LS.get('dz-settings', {}) || {});
DZ.saveSettings = () => LS.set('dz-settings', DZ.settings);
DZ.weak = (() => { const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); if (ios) return false; const mob = /Android|Mobile/i.test(ua) || (navigator.maxTouchPoints > 1 && innerWidth < 900), c = navigator.hardwareConcurrency || 8, m = navigator.deviceMemory || 8; return (mob && (c <= 6 || m <= 4)) || c <= 4; })();   // айфоны — полное качество; облегчаем только слабые Андроиды
DZ.quality = () => DZ.settings.quality || ((DZ.weak || DZ.autoFast) ? 'fast' : 'photo');

</script>
<script>/* price.js */
/* Эскиз — примерная цена по правилам сметы цеха («Смета Базис» / Вертакс → Смета).
   Материалы: площади ЛДСП, ДВПО, фасадов, длина столешницы и кромки, штуки фурнитуры — берём из самих деталей модуля.
   Наценка по группам: ЛДСП, ДВПО и кромка +80 %, покупные фасады +60 %, фурнитура и прочее +50 %.
   Работы — по ставкам цеха «клиенту» (как SM_WR). Итог = (материалы с наценкой + работы) ÷ (1 − доля офиса 21 %) + доставка.
   Это примерная цена: точную считает технолог в смете. Цены материалов — в меню «⋯ → Цены» (хранятся в этом браузере). */
'use strict';
(function () {
  const PR = DZ.price = {};

  /* работы: код, название, ед., клиенту ₽ — из «Сметы Базис» (столбец «клиенту») */
  PR.WORKS = {
    'R-01': ['Распил ЛДСП', 'м²', 142.5], 'R-04': ['Распил ДВПО', 'м²', 108], 'K-01': ['Кромка', 'м', 48], 'PR-1': ['Присадка: евровинты', 'шт', 63], 'PR-2': ['Присадка: под петли', 'шт', 66],
    'O-01': ['Упаковка', 'м²', 80], 'S-01': ['Сборка модуля', 'шт', 1000], 'S-03': ['Сборка пенала / шкафа', 'шт', 1400], 'S-02': ['Сборка ящика', 'шт', 500], 'S-04': ['Навес фасада', 'шт', 200],
    'S-07': ['Полка', 'шт', 50], 'S-08': ['Задняя стенка', 'шт', 100], 'F-01': ['Петля', 'шт', 70], 'F-03': ['Направляющие', 'компл.', 300], 'F-04': ['Ручка', 'шт', 100], 'F-05': ['Опора', 'шт', 52.5],
    'U-01': ['Монтаж низа', 'шт', 1225], 'U-02': ['Монтаж верха', 'шт', 1400], 'U-03': ['Монтаж пенала / шкафа', 'шт', 2100], 'U-04': ['Монтаж столешницы', 'шт', 1500], 'U-05': ['Монтаж фартука', 'шт', 1050],
    'U-15': ['Вырез в столешнице', 'шт', 1050], 'U-08': ['Установка мойки', 'шт', 2100], 'U-10': ['Установка техники', 'шт', 2100], 'U-16': ['Погрузка, разгрузка', 'заказ', 1000], 'U-17': ['Уборка', 'заказ', 1000]
  };
  /* цены материалов по умолчанию — правятся в «Ценах» */
  PR.DEF = {
    ldsp: 1150, dvp: 200, front: 7000, top: 4000, apron: 3000, edge: 40,
    hinge: 180, slide: 1200, handle: 350, leg: 60, hang: 150, misc: 150,
    waste: 20, mkL: 80, mkF: 60, mkO: 50, office: 21, deliv: 3000
  };
  PR.FIELDS = [
    ['Материалы', [['ldsp', 'ЛДСП 16 мм', '₽/м²'], ['dvp', 'ДВПО (задние стенки)', '₽/м²'], ['front', 'Фасад МДФ', '₽/м²'], ['top', 'Столешница', '₽/п.м'], ['apron', 'Фартук', '₽/п.м'], ['edge', 'Кромка', '₽/м'], ['waste', 'Запас на раскрой ЛДСП', '%']]],
    ['Фурнитура', [['hinge', 'Петля с доводчиком', '₽/шт'], ['slide', 'Направляющие ящика', '₽/компл.'], ['handle', 'Ручка', '₽/шт'], ['leg', 'Опора', '₽/шт'], ['hang', 'Навес верхнего шкафа', '₽/шт'], ['misc', 'Крепёж и мелочь на модуль', '₽']]],
    ['Наценка и итог', [['mkL', 'Наценка: ЛДСП, ДВПО и кромка', '%'], ['mkF', 'Наценка: покупные фасады', '%'], ['mkO', 'Наценка: фурнитура и прочее', '%'], ['office', 'Доли офиса', '%'], ['deliv', 'Доставка (минимум)', '₽']]]
  ];
  PR.get = () => Object.assign({}, PR.DEF, LS.get('dz-prices', {}) || {});
  PR.set = (o) => { LS.set('dz-prices', o); PR.cache = {}; };
  PR.cache = {};

  /* ---- разбор модуля на детали (через ту же библиотеку, что рисует 3D) ---- */
  let dummy = null;
  function partsOf(it) {
    const L = window.DZ_LIB, T = window.THREE; if (!L || !L.build || !T) return null;
    if (!dummy) dummy = new T.MeshBasicMaterial();
    const key = [it.lib, it.w, it.h, it.d, JSON.stringify(it.params || {})].join('|');
    if (PR.cache['p' + key]) return PR.cache['p' + key];
    let g; try { g = L.build(T, it.lib, { w: it.w, h: it.h, d: it.d, params: it.params, mats: { body: dummy, front: dummy, top: dummy, handle: dummy, glass: dummy, metal: dummy, textile: dummy }, quality: 'fast' }); } catch (_) { return null; }
    g.updateMatrixWorld(true);
    const out = [], v = new T.Vector3(), bb = new T.Box3();
    g.traverse(o => {
      if (!o.isMesh || !o.geometry) return;
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      bb.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld); bb.getSize(v);
      out.push({ part: (o.userData && o.userData.part) || '', name: o.name || '', sx: v.x, sy: v.y, sz: v.z, x0: bb.min.x, x1: bb.max.x, z0: bb.min.z, z1: bb.max.z, grp: o.parent && o.parent !== g ? o.parent.uuid : o.uuid });
    });
    return PR.cache['p' + key] = out;
  }
  const isTech = /^(hob|sink|hood|fridge)$/;
  const kindOf = it => it.mount === 'wall' ? 'up' : (it.h > 1200 ? 'tall' : 'low');

  /* потребность модуля: площади, длины, штуки и работы */
  PR.need = (it) => {
    const n = { ldsp: 0, dvp: 0, front: 0, top: 0, apron: 0, edge: 0, hinge: 0, slide: 0, handle: 0, leg: 0, hang: 0, misc: 0, w: {} };
    const W = n.w, add = (c, q) => { if (q > 0) W[c] = (W[c] || 0) + q; };
    if (it.lib === '_ext') return n;
    if (it.lib === 'fridge') return n;                                     // отдельностоящая техника — клиент покупает сам
    if (it.lib === 'hob') { add('U-15', 1); add('U-10', 1); return n; }
    if (it.lib === 'sink') { add('U-15', 1); add('U-08', 1); return n; }
    if (it.lib === 'hood') { add('U-10', 1); return n; }
    if (it.lib === 'splash') { n.apron = it.w / 1000; add('U-05', Math.ceil(it.w / 3000)); return n; }
    const parts = partsOf(it); if (!parts) return n;
    let doors = 0, drw = 0, shelves = 0, panels = 0, cabinet = false; const hs = new Set(), tb = [1e9, -1e9, 1e9, -1e9];
    parts.forEach(p => {
      const s = [p.sx, p.sy, p.sz].sort((a, b) => a - b), th = s[0], a = s[1] * s[2] / 1e6;
      if (p.part === 'body') {
        if (/Ножка/.test(p.name)) return;
        if (th <= 6 || /ДВП/.test(p.name)) { n.dvp += a; return; }
        n.ldsp += a; panels++;
        // кромка — по лицевой кромке детали: если деталь стоит «в глубину» — её не-глубинный размер, иначе длинная сторона
        const dz = p.sz, edge = Math.abs(dz - th) < 0.5 ? s[2] : (Math.abs(p.sx - th) < 0.5 ? p.sy : p.sx);
        n.edge += edge / 1000;
        if (/^Боковина|^Дно$|^Крыша/.test(p.name)) cabinet = true;
        if (/^Полка/.test(p.name)) shelves++;
      } else if (p.part === 'front') {
        if (/Рейка|Карниз|Стеновая панель|Боковая панель|Цоколь|Заглушка/.test(p.name)) { if (/Цоколь|Заглушка|Боковая/.test(p.name)) { n.ldsp += a; n.edge += (s[1] + s[2]) / 1000; } else n.front += a; return; }
        n.front += a;
        if (/ящик|бутылочн/i.test(p.name)) drw++;
        else if (/Рамка/.test(p.name)) { if (p.sy > p.sx * 3) { doors += 0.5; n.hinge += 0.5 * (p.sy <= 1000 ? 2 : p.sy <= 1600 ? 3 : 4); } }
        else { doors++; const fh = p.sy; n.hinge += /подъёмн/i.test(p.name) ? 0 : (fh <= 1000 ? 2 : fh <= 1600 ? 3 : 4); }
      } else if (p.part === 'glass' && /Стекло|Вставка/.test(p.name)) n.front += a;
      else if (p.part === 'top' && /Столешница/.test(p.name)) { tb[0] = Math.min(tb[0], p.x0); tb[1] = Math.max(tb[1], p.x1); tb[2] = Math.min(tb[2], p.z0); tb[3] = Math.max(tb[3], p.z1); }
      else if (p.part === 'handle') hs.add(p.grp);
    });
    if (tb[1] > tb[0]) n.top = Math.max(tb[1] - tb[0], tb[3] - tb[2]) / 1000;
    n.handle = hs.size; doors = Math.round(doors); n.hinge = Math.round(n.hinge);
    if (it.lib === 'low_dishwasher') { n.hinge = 0; n.slide = 0; n.handle = Math.min(n.handle, 1); add('S-04', 1); add('F-04', n.handle); add('U-10', 1); n.misc = 1; return n; }   // посудомойка: только фасад
    if (!cabinet) { // стол, полка, панель — только детали
      if (n.ldsp > 0) { add('R-01', n.ldsp); add('K-01', n.edge); add('O-01', n.ldsp); add('PR-1', 4 * Math.max(1, panels - 1)); }
      if (n.front > 0) add('S-04', doors + drw);
      return n;
    }
    const k = kindOf(it);
    if (/^(sofa|chair|bed160)$/.test(it.lib)) { n.ldsp = n.dvp = n.edge = 0; return n; }
    n.slide = drw; if (n.handle > doors + drw) n.handle = doors + drw;
    if (k === 'up') n.hang = 2; else n.leg = /corner_l/.test(it.lib) ? 6 : 4;
    n.misc = 1;
    add('R-01', n.ldsp); add('R-04', n.dvp); add('K-01', n.edge); add('O-01', n.ldsp + n.dvp);
    add('PR-1', (k === 'low' ? 12 : 8) + 8 * drw); add('PR-2', n.hinge);
    add(k === 'tall' || it.w > 1200 ? 'S-03' : 'S-01', 1); add('S-02', drw); add('S-04', doors + drw); add('S-07', shelves); add('S-08', n.dvp > 0 ? 1 : 0);
    add('F-01', n.hinge); add('F-03', n.slide); add('F-04', n.handle); add('F-05', n.leg);
    add(k === 'up' ? 'U-02' : k === 'tall' ? 'U-03' : 'U-01', 1);
    if (it.lib === 'low_oven' || it.lib === 'low_dishwasher' || it.lib === 'tall_fridge') add('U-10', 1);
    if (it.lib === 'tall_oven') add('U-10', it.params && (it.params.micro === false || it.params.micro === 'false') ? 1 : 2);
    return n;
  };

  /* цена модуля: {mat:{ldsp,front,furn}, matK, work, works:[...], total} — total уже с долей офиса */
  PR.item = (it, c) => {
    c = c || PR.get();
    const key = 'i' + [it.lib, it.w, it.h, it.d, JSON.stringify(it.params || {}), JSON.stringify(c)].join('|');
    if (PR.cache[key]) return PR.cache[key];

    const furn = n.hinge * c.hinge + n.slide * c.slide + n.handle * c.handle + n.leg * c.leg + n.hang * c.hang + n.misc * c.misc + n.top * c.top + n.apron * c.apron;
    const matK = ldsp * (1 + c.mkL / 100) + front * (1 + c.mkF / 100) + furn * (1 + c.mkO / 100);
    const works = Object.keys(n.w).map(code => { const d = PR.WORKS[code], q = Math.round(n.w[code] * 100) / 100; return { c: code, n: d[0], u: d[1], q, sum: q * d[2] }; });
    const work = works.reduce((a, x) => a + x.sum, 0), k = Math.max(0.3, 1 - (+c.office || 0) / 100);
    const r = { need: n, mat: { ldsp, front, furn }, mats: ldsp + front + furn, matK, work, works, total: Math.round((matK + work) / k / 10) * 10, k };
    return PR.cache[key] = r;
  };

  /* весь проект: модули + работы на заказ (погрузка, уборка, монтаж столешницы) + доставка */
  PR.project = (P) => {
    const c = PR.get(), items = (P.items || []).map(it => ({ it, p: PR.item(it, c) }));
    const matK = items.reduce((a, x) => a + x.p.matK, 0), mats = items.reduce((a, x) => a + x.p.mats, 0), work = items.reduce((a, x) => a + x.p.work, 0);
    const topLen = items.reduce((a, x) => a + x.p.need.top, 0), any = items.some(x => x.p.total > 0);
    const ow = []; const add = (code, q) => { if (q > 0) { const d = PR.WORKS[code]; ow.push({ c: code, n: d[0], u: d[1], q, sum: q * d[2] }); } };
    if (topLen > 0) add('U-04', Math.ceil(topLen / 3));
    if (any) { add('U-16', 1); add('U-17', 1); }
    const k = Math.max(0.3, 1 - (+c.office || 0) / 100), oWork = ow.reduce((a, x) => a + x.sum, 0);
    const sub = (matK + work + oWork) / k, office = sub - matK - work - oWork, deliv = any ? +c.deliv || 0 : 0;
    return { items, mats, matK, mk: matK - mats, work: work + oWork, orderWorks: ow, office, deliv, total: Math.round((sub + deliv) / 100) * 100, c };
  };
})();

/* старый хук остаётся для совместимости: цена одного модуля */
window.dzPrice = function (it) { try { return DZ.price.item(it).total; } catch (_) { return 0; } };

<script>/* view3d.js */
/* Эскиз — 3D: сцена, комната, модули, управление камерой, фото, развёртка */
'use strict';
(function () {
  const V = DZ.v3 = { ok: false };
  let T, R, scene, cam, world, roomG, itemsG, helpG, dimsG, lights = {}, el, needs = true, nodes = new Map(), wallNodes = [];
  const K = 0.001;
  const ctl = { target: null, r: 6, th: 0.4, ph: 1.05, mode: 'orbit', fov: 45 };
  V.ctl = ctl;

    const end = e => {

      if (!st) return;
      if (st.moved) { if (st.kind === 'item') DZ.ui.changed({ items: true }); else if (st.kind === 'open' || st.kind === 'vert' || st.kind === 'pt' || st.kind === 'arc' || (st.kind === 'el' && !st.slope)) DZ.ui.changed({ room: true }); if (st.kind === 'el' && !st.slope) DZ.ui.selChanged(); }

        else if (st.kind === 'item') { if (st.shift) DZ.sel = DZ.sel.includes(st.id) ? DZ.sel.filter(i => i !== st.id) : DZ.sel.concat(st.id); else DZ.sel = [st.id]; DZ.selWall = -1; DZ.selOpen = null; DZ.ui.selChanged(); }
        else if (st.kind === 'el') { const q = DZ.room.get(st.id); DZ.sel = []; DZ.selOpen = null; DZ.selPt = null; DZ.selEl = q ? q.id : null; DZ.selWall = q && q.type === 'slope' ? q.wall : -1; DZ.ui.selChanged(); }
        else if (st.kind === 'arc') { DZ.sel = []; DZ.selWall = st.wi; DZ.selEl = null; DZ.ui.selChanged(); }
        else if (st.kind === 'pt') { const q = DZ.P.room.points.find(x => x.id === st.id); DZ.sel = []; DZ.selOpen = null; DZ.selPt = q.id; DZ.selWall = q.wall; DZ.ui.selChanged(); }
        else if (st.kind === 'open') { const o = DZ.P.room.openings.find(o => o.id === st.id); DZ.sel = []; DZ.selOpen = o.id; DZ.selWall = o.wall; DZ.ui.selChanged(); }
        else if (st.kind === 'wall') { DZ.sel = []; DZ.selWall = st.wi; DZ.selOpen = null; DZ.selPt = null; DZ.ui.selChanged(); }
        else if (st.kind === 'pan' && st.btn === 0) { DZ.sel = []; DZ.selWall = -1; DZ.selOpen = null; DZ.selPt = null; DZ.selEl = null; DZ.ui.selChanged(); }
      }
      st = null;
    };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0012)); PV.render(); }, { passive: false });
    svg.addEventListener('dblclick', e => { if (PV.mode === 'draw') PV.finishDraw(); });
  }
  function zoomAt(cx, cy, f) {
    const r = svg.getBoundingClientRect(), ns = clamp(PV.s * f, 0.015, 2);
    const mx = PV.cx + (cx - r.left - r.width / 2) / PV.s, my = PV.cy + (cy - r.top - r.height / 2) / PV.s;
    PV.s = ns; PV.cx = mx - (cx - r.left - r.width / 2) / ns; PV.cy = my - (cy - r.top - r.height / 2) / ns;
  }
  PV.zoom = f => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f); PV.render(); };

  /* ---------- рисование стен ---------- */
  PV.ortho = true; PV.angStep = 90; // шаг угла при рисовании: 90, 45, 15 или 0 (любой)
  const stepNow = () => PV.angStep == null ? (PV.ortho ? 90 : 0) : (PV.ortho === false && PV.angStep === 90 ? 0 : PV.angStep);
  function drawSnap(m) {
    let x = r10(m.x), y = r10(m.y); const d = PV.draw, stp = stepNow();
    if (d.length) {
      const a = d[d.length - 1], f = d[0];
      if (stp) {
        const L = Math.hypot(m.x - a[0], m.y - a[1]), ang = Math.atan2(m.y - a[1], m.x - a[0]), st = stp * Math.PI / 180, q = Math.round(ang / st) * st;
        const Lr = r10(L); x = Math.round(a[0] + Math.cos(q) * Lr); y = Math.round(a[1] + Math.sin(q) * Lr);
        if (Math.abs(Math.cos(q)) < 1e-9) x = a[0]; if (Math.abs(Math.sin(q)) < 1e-9) y = a[1];
        // дотянуть до линии первого угла по горизонтали/вертикали
        if (d.length >= 2 && Math.abs(Math.sin(q)) > 1e-6 && Math.abs(y - f[1]) < 14 / PV.s) { const t = (f[1] - a[1]) / Math.sin(q); if (t > 0) { x = Math.round(a[0] + Math.cos(q) * t); y = f[1]; } }
        else if (d.length >= 2 && Math.abs(Math.cos(q)) > 1e-6 && Math.abs(x - f[0]) < 14 / PV.s) { const t = (f[0] - a[0]) / Math.cos(q); if (t > 0) { y = Math.round(a[1] + Math.sin(q) * t); x = f[0]; } }
      }
      if (d.length >= 3 && Math.hypot(m.x - f[0], m.y - f[1]) < 22 / PV.s) { x = f[0]; y = f[1]; }
    }
    return [x, y];
  }
  /* точная стена: длина и направление (градусы: 0 — вправо, 90 — вверх) */
  PV.typeSeg = (L, angDeg) => {
    const d = PV.draw; if (!d.length) return; const a = d[d.length - 1];
    let ang;
    if (angDeg != null && isFinite(angDeg)) ang = -angDeg * Math.PI / 180;
    else if (PV.cursor && Math.hypot(PV.cursor[0] - a[0], PV.cursor[1] - a[1]) > 1) ang = Math.atan2(PV.cursor[1] - a[1], PV.cursor[0] - a[0]);
    else if (d.length >= 2) { const b = d[d.length - 2]; ang = Math.atan2(a[1] - b[1], a[0] - b[0]) - Math.PI / 2; }
    else ang = 0;
    const p = [Math.round(a[0] + Math.cos(ang) * L), Math.round(a[1] + Math.sin(ang) * L)];
    const f = d[0]; if (d.length >= 3 && Math.hypot(p[0] - f[0], p[1] - f[1]) < 30) { PV.finishDraw(); return; }

  };
  function drawClick(p) {
    const d = PV.draw;
    if (d.length >= 3 && p[0] === d[0][0] && p[1] === d[0][1]) { PV.finishDraw(); return; }
    if (d.length && Math.hypot(p[0] - d[d.length - 1][0], p[1] - d[d.length - 1][1]) < 100) return;
    d.push(p); PV.render(); DZ.ui.drawState();
  }
  PV.startDraw = () => { PV.mode = 'draw'; PV.draw = []; PV.cursor = null; DZ.sel = []; DZ.selWall = -1; DZ.ui.drawState(); PV.render(); };
  PV.cancelDraw = () => { PV.mode = 'edit'; PV.draw = []; PV.cursor = null; DZ.ui.drawState(); PV.render(); };
  PV.undoPoint = () => { PV.draw.pop(); PV.render(); DZ.ui.drawState(); };
  PV.finishDraw = () => {
    const d = PV.draw; if (d.length < 3) { DZ.ui.toast('Нужно хотя бы 3 угла'); return; }
    DZ.push(); let pts = d.map(p => p.slice());
    if (DZ.geo.area(pts) < 0) pts.reverse();
    DZ.P.room.pts = pts; DZ.P.room.closed = true; DZ.P.room.openings = []; delete DZ.P.room.wallNames; delete DZ.P.room.wallH; delete DZ.P.room.arcs; if (DZ.P.room.els) DZ.P.room.els = DZ.P.room.els.filter(e => e.type !== 'slope'); DZ.selEl = null; DZ.P.room.points = (DZ.P.room.points || []).filter(q => q.wall < pts.length);
    PV.mode = 'edit'; PV.draw = []; PV.cursor = null; DZ.selWall = 0; DZ.ui.drawState(); DZ.ui.changed({ room: true }); PV.fit(); if (DZ.v3.ok) DZ.v3.view('orbit');
    DZ.ui.toast('Комната готова. Добавьте окна и двери в разделе «Комната».');
  };
})();

</script>
<script>/* order.js */
/* Эскиз — необязательный просмотр модулей из заказа «Технолог 3D» по ссылке #order=<номер>[~ключ] */
'use strict';
(function () {
  const b64u = s => { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  async function decrypt(obj, key) {
    const k = await crypto.subtle.importKey('raw', b64u(key), 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u(obj.iv) }, k, b64u(obj.ct));
    return new TextDecoder().decode(pt).replace(/^﻿/, '');
  }
  const BASE = '../orders/';
  // ключ: из ссылки, из ключей «Технолог 3D» на этом устройстве (тот же сайт), либо из списка заказов по ключу роли
  async function keyFor(id, given) {
    if (given) return given;
    let ks = {}; try { ks = JSON.parse(localStorage.getItem('t3d-keys') || '{}') || {}; } catch (_) { }
    const o = ks.orders && ks.orders[id]; if (o && o.k) return o.k;
    const roles = [['master', 'index.json'], ['designers', 'designers.json'], ['masters', 'masters.json'], ['supply', 'supply.json']];
    for (const [r, f] of roles) {
      if (!ks[r]) continue;
      try { const j = await (await fetch(BASE + f, { cache: 'no-cache' })).json(); const ix = JSON.parse(await decrypt(j, ks[r])); const e = (ix.orders || []).find(x => String(x.id).toUpperCase() === id); if (e && e.k) return e.k; } catch (_) { }
    }
    return '';
  }
  const cache = {};
  async function loadOrder(id, key) {
    if (cache[id]) return cache[id];
    const r = await fetch(BASE + encodeURIComponent(id) + '.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status === 404 ? 'Заказ ' + id + ' не найден на сайте' : 'Сайт не ответил');
    let txt = await r.text(), obj = null; try { obj = JSON.parse(txt.replace(/^﻿/, '')); } catch (_) { throw new Error('Файл заказа повреждён'); }
    if (obj && obj.ct) { const k = await keyFor(id, key); if (!k) throw new Error('Заказ закрыт. Откройте его один раз в «Технолог 3D» по QR-ссылке и повторите.'); try { obj = JSON.parse(await decrypt(obj, k)); } catch (_) { throw new Error('Ключ заказа не подошёл'); } }
    return cache[id] = obj;
  }
  // группа модуля заказа для 3D (вызывается из view3d)
  const groups = {};
  DZ.extGroup = (it) => {
    const g = groups[it.ext && it.ext.order + '#' + it.ext.idx];
    if (g) return g.clone();
    if (it.ext && !groups['_busy' + it.ext.order]) { groups['_busy' + it.ext.order] = 1; ensure(it.ext.order).then(() => { DZ.P && DZ.v3.ok && (DZ.P.items.forEach(i => { if (i.lib === '_ext') i._r = Date.now(); }), DZ.v3.syncItems()); }).catch(() => { }); }
    return null;
  };
  async function ensure(id, key) {
    const j = await loadOrder(id, key);
    const mods = (window.DZ_LIB && DZ_LIB.fromOrder) ? DZ_LIB.fromOrder(j) || [] : [];
    mods.forEach((m, i) => { groups[id + '#' + i] = m.group; });
    return mods;
  }
  DZ.importOrder = async (spec) => {
    let [id, key] = decodeURIComponent(spec).split('~'); id = String(id || '').trim().toUpperCase();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (_) { }
    if (!id) { DZ.ui.showStart(); return; }
    const ex = DZ.store.index().find(p => p.orderId === id || p.name === 'Заказ ' + id);
    DZ.ui.showStart(); DZ.ui.toast('Загружаем заказ ' + id + '…');
    try {
      const mods = await ensure(id, key);
      if (!mods.length) throw new Error('В заказе нет модулей для показа');
      if (ex) { const P = DZ.validate(DZ.store.load(ex.id)); if (P) { DZ.ui.openProject(P); return; } }
      let W = 0, D = 0;
      mods.forEach(m => { const x = (m.x || 0) + m.w, z = (m.z || 0) + m.d; W = Math.max(W, x); D = Math.max(D, z); });
      const P = DZ.newProject({ tpl: 'empty', W: Math.max(3000, r10(W + 600)), D: Math.max(2600, r10(D + 1600)), H: 2700, name: 'Заказ ' + id, client: '' });
      P.orderId = id; P.room.openings = P.room.openings.filter(o => o.type !== 'окно');
      let t = 0; const walls = DZ.geo.walls(P.room);
      mods.forEach((m, i) => {
        const it = { id: uid(), lib: '_ext', ext: { order: id, idx: i }, name: m.name || 'Модуль', w: Math.round(m.w), h: Math.round(m.h), d: Math.round(m.d), x: 0, z: 0, rot: 0, y: Math.round(m.y || 0), params: {}, mats: {}, mount: 'free' };
        if (m.x != null && m.z != null) { it.x = m.x + it.w / 2; it.z = m.z + it.d / 2; }
        else { DZ.placeOnWall(it, walls[0], t); t += it.w; }
        P.items.push(it);
      });
      DZ.store.save(P); DZ.ui.openProject(P); DZ.ui.toast('Заказ ' + id + ': модулей ' + mods.length);
    } catch (e) { DZ.ui.toast(e.message || 'Не удалось открыть заказ'); }
  };
})();

</script>
