  /* ---------- развёртка ---------- */
  function elevation(wi) {
    if (!DZ.v3.ok) { UI.toast('3D недоступно в этом браузере'); return; }
    const n = DZ.geo.wallCount(DZ.P.room); if (!n) return;
    if (wi == null) { wi = DZ.selWall >= 0 ? DZ.selWall : 0; const best = DZ.geo.walls(DZ.P.room).map(w => DZ.itemsOnWall(w.i, 90).length); if (DZ.selWall < 0) wi = best.indexOf(Math.max(...best)); }
    closeSheets();
    const e = DZ.v3.elevation(wi, DZ.weak ? 1400 : 2000), w = DZ.geo.wall(DZ.P.room, wi);
    const on = DZ.itemsOnWall(wi, 90), H = e.H, L = e.L, ex = 420, ey = 380;
    const pts = (DZ.P.room.points || []).filter(p => p.wall === wi).sort((a, b) => a.x - b.x);
    const ops = DZ.P.room.openings.filter(o => o.wall === wi);
    const fs = Math.max(Math.min(Math.max(L, H) / 50, 80), 40), head = fs * 2.6 + (pts.length ? 160 : 0);
    const vb = [-e.M - ex, -e.MT - ey - head, L + 2 * e.M + 2 * ex, H + 2 * e.MT + 2 * ey + head];
    const Y = y => H - y; // мм от пола → svg
    const INK = '#1B2329', MUT = '#56636A', BLUE = '#1F5BC4', MOD = '#16448F';
    let d = `<svg viewBox="${vb.join(' ')}" xmlns="http://www.w3.org/2000/svg" font-family="Fira Sans Extra Condensed, Roboto Condensed, Arial Narrow, sans-serif"><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#fff"/>
      <image href="${e.url}" x="${-e.M}" y="${-e.MT}" width="${L + 2 * e.M}" height="${H + 2 * e.MT}" preserveAspectRatio="none"/>`;
    const dim = (x1, y1, x2, y2, off, txt, vert, col) => {
      const c = col || INK, tk = fs * 0.32, sw = fs / 14;
      if (!vert) { const yy = y1 + off; return `<g stroke="${c}" stroke-width="${sw}"><path d="M${x1} ${y1}V${yy}M${x2} ${y2}V${yy}M${x1 - tk} ${yy}H${x2 + tk}M${x1 - tk} ${yy + tk}L${x1 + tk} ${yy - tk}M${x2 - tk} ${yy + tk}L${x2 + tk} ${yy - tk}" fill="none" opacity=".85"/></g>${Math.abs(x2 - x1) > fs * 1.7 ? `<text x="${(x1 + x2) / 2}" y="${yy - fs * 0.3}" font-size="${fs}" text-anchor="middle" fill="${c}" font-weight="600">${txt}</text>` : ''}`; }
      const xx = x1 + off; return `<g stroke="${c}" stroke-width="${sw}"><path d="M${x1} ${y1}H${xx}M${x2} ${y2}H${xx}M${xx} ${y1 + tk}V${y2 - tk}M${xx - tk} ${y1 + tk}L${xx + tk} ${y1 - tk}M${xx - tk} ${y2 + tk}L${xx + tk} ${y2 - tk}" fill="none" opacity=".85"/></g>${Math.abs(y2 - y1) > fs * 1.7 ? `<text x="${xx - fs * 0.3}" y="${(y1 + y2) / 2}" font-size="${fs}" text-anchor="middle" fill="${c}" font-weight="600" transform="rotate(-90 ${xx - fs * 0.3} ${(y1 + y2) / 2})">${txt}</text>` : ''}`;
    };
    // контуры и номера модулей
    const legend = [], ordered = on.filter(o => o.it.y < 500).concat(on.filter(o => o.it.y >= 500));
    ordered.forEach((o, i) => {
      const it = o.it, x0 = clamp(o.t0, -e.M, L + e.M), x1 = clamp(o.t1, -e.M, L + e.M), cx = (x0 + x1) / 2, cy = Y(it.y + it.h / 2), r = fs * 0.78;
      d += `<rect x="${x0}" y="${Y(it.y + it.h)}" width="${x1 - x0}" height="${it.h}" fill="none" stroke="${INK}" stroke-width="${fs / 9}"/>`;
      if (x1 - x0 > r * 2.2 && it.h > r * 2.2) d += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${BLUE}" stroke-width="${fs / 10}"/><text x="${cx}" y="${cy}" font-size="${fs * 1.05}" font-weight="700" fill="${BLUE}" text-anchor="middle" dominant-baseline="central">${i + 1}</text>`;
      legend.push({ n: i + 1, it });
    });
    ops.forEach(o => { d += `<rect x="${o.off}" y="${Y(o.y + o.h)}" width="${o.w}" height="${o.h}" fill="none" stroke="${BLUE}" stroke-width="${fs / 10}" stroke-dasharray="${fs / 2} ${fs / 3}"/>`; });
    d += `<rect x="0" y="0" width="${L}" height="${H}" fill="none" stroke="${INK}" stroke-width="${fs / 6}"/>`;
    // точки замера: значок на стене
    pts.forEach(p => { const c = DZ.POINT_TYPES[p.type] || { color: '#888', s: '?' }, r = fs * 0.62, x = p.x, y = Y(p.y);
      d += `<circle cx="${x}" cy="${y}" r="${r}" fill="${c.color}" stroke="#fff" stroke-width="${fs / 9}"/><text x="${x}" y="${y}" font-size="${fs * 0.72}" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">${esc(c.s)}</text>`; });
    // общая длина и высота стены
    d += dim(0, Y(0), L, Y(0), e.MT + ey * 0.66, fmtMm(L)) + dim(L, Y(0), L, Y(H), e.M + ex * 0.7, 'h ' + fmtMm(H), true);
    // нижние модули — цепочка снизу, верхние — сверху
    const chain = (list, base, off) => { let t = 0, s = ''; list.forEach(o => { const t0 = clamp(o.t0, 0, L), t1 = clamp(o.t1, 0, L); if (t0 - t > 1) s += dim(t, base, t0, base, off, fmtMm(t0 - t), false, MUT); if (t1 > Math.max(t0, t)) s += dim(Math.max(t0, t), base, t1, base, off, fmtMm(t1 - Math.max(t0, t)), false, MOD); t = Math.max(t, t1); }); if (L - t > 1 && list.length) s += dim(t, base, L, base, off, fmtMm(L - t), false, MUT); return s; };
    const low = on.filter(o => o.it.y < 500), up = on.filter(o => o.it.y >= 500);
    d += chain(low, Y(0), e.MT + ey * 0.28); d += chain(up, Y(H), -(e.MT + ey * 0.3));
    // точки: от угла — цепочка над стеной
    if (pts.length) { let t = 0, s = '', base = Y(H), off = -(e.MT + ey * 0.3 + (up.length ? fs * 2.6 : 0) + 120); pts.forEach(p => { const c = (DZ.POINT_TYPES[p.type] || {}).color || MUT; if (p.x - t > 1) s += dim(t, base, p.x, base, off, fmtMm(p.x - t), false, c); t = p.x; }); d += s; }
    // высоты слева
    const hs = new Set([0]); on.forEach(o => { hs.add(Math.round(o.it.y)); hs.add(Math.round(o.it.y + o.it.h)); });
    const hv = Array.from(hs).filter(v => v <= H).sort((a, b) => a - b); for (let i = 1; i < hv.length; i++) d += dim(0, Y(hv[i - 1]), 0, Y(hv[i]), -(e.M + ex * 0.35), fmtMm(hv[i] - hv[i - 1]), true, MOD);
    if (hv.length && H - hv[hv.length - 1] > 1) d += dim(0, Y(hv[hv.length - 1]), 0, Y(H), -(e.M + ex * 0.35), fmtMm(H - hv[hv.length - 1]), true, MUT);
    // проёмы
    ops.forEach(o => { d += dim(o.off, Y(o.y + o.h), o.off + o.w, Y(o.y + o.h), -fs * 1.6, fmtMm(o.w), false, BLUE); if (o.y > 0) d += dim(o.off + o.w, Y(0), o.off + o.w, Y(o.y), fs * 1.6, fmtMm(o.y), true, BLUE); d += dim(o.off, Y(o.y), o.off, Y(o.y + o.h), fs * 1.6, fmtMm(o.h), true, BLUE); });
    if (DZ.room) d += DZ.room.elevSvg(wi, { dim, Y, fs, L, H, INK }); /* room.js: колонны, короба, скосы */
    d += `<text x="${vb[0] + fs}" y="${vb[1] + fs * 1.7}" font-size="${fs * 1.4}" font-weight="700" fill="${INK}">${esc(DZ.P.name)} — стена ${esc(DZ.wallName(wi))}</text>
      <text x="${vb[0] + fs}" y="${vb[1] + fs * 3.1}" font-size="${fs * 0.9}" fill="${MUT}">Развёртка · размеры в мм · высота стены ${fmtMm(H)}${DZ.P.client ? ' · ' + esc(DZ.P.client) : ''} · ${new Date().toLocaleDateString('ru-RU')}</text></svg>`;
    const lg = legend.length || pts.length ? `<div class="elev-legend">${legend.length ? `<table class="spec-t"><thead><tr><th>№</th><th>Модуль</th><th class="r">Ш×В×Г, мм</th><th class="r">От пола</th></tr></thead><tbody>${legend.map(x => `<tr><td class="num"><b>${x.n}</b></td><td>${esc(x.it.name)}</td><td class="r num">${x.it.w}×${x.it.h}×${x.it.d}</td><td class="r num">${fmtMm(x.it.y)}</td></tr>`).join('')}</tbody></table>` : ''}
      ${pts.length ? `<table class="spec-t"><thead><tr><th>Точка</th><th class="r">От левого угла</th><th class="r">От пола</th></tr></thead><tbody>${pts.map(p => { const c = DZ.POINT_TYPES[p.type] || { color: '#888', s: '?', name: p.type }; return `<tr><td><span class="pt-dot" style="background:${c.color}">${esc(c.s)}</span>${esc(c.name)}${p.note ? ' — ' + esc(p.note) : ''}</td><td class="r num">${fmtMm(p.x)}</td><td class="r num">${fmtMm(p.y)}</td></tr>`; }).join('')}</tbody></table>` : ''}</div>` : '';
    const m = UI.modal('Развёртка стены', `<div class="chips noprint">${Array.from({ length: n }, (_, i) => `<button data-ew="${i}" class="${i === wi ? 'on' : ''}">Стена ${DZ.wallName(i)} · ${fmtMm(DZ.geo.wall(DZ.P.room, i).L)}</button>`).join('')}</div><div class="elev-sheet"><div class="elev-wrap">${d}</div>${lg}</div>
      ${on.length ? '' : '<p class="hint noprint">У этой стены нет модулей. Выберите другую стену.</p>'}`,
      `<button class="b" data-close>Закрыть</button><button class="b pri" id="elPrint">${ic('print')}Печать А4</button>`, 'elev');
    m.querySelector('.chips').onclick = ev => { const b = ev.target.closest('[data-ew]'); if (b) elevation(+b.dataset.ew); };
    $('#elPrint').onclick = () => window.print();
  }
  UI.elevation = elevation;

  /* ---------- смета ---------- */
  const APPROX = 'Примерная цена по расценкам цеха. Точную цену считает технолог по смете.';
  function parts(pj) { const k = Math.max(0.3, 1 - (+pj.c.office || 0) / 100); return { M: pj.matK / k, W: pj.work / k, D: pj.deliv, k }; }
  function totalsHtml(pj) {
    if (!pj) return ''; const q = parts(pj);
    return `<table class="spec-t sum-t"><tbody><tr><td>Материалы</td><td class="r num">${rub(q.M)}</td></tr><tr><td>Работы: сборка, монтаж, распил</td><td class="r num">${rub(q.W)}</td></tr>${q.D ? `<tr><td>Доставка</td><td class="r num">${rub(q.D)}</td></tr>` : ''}
      <tr class="tot"><td>Итого</td><td class="r num">${rub(pj.total)}</td></tr></tbody></table><p class="approx">${APPROX}</p>`;
  }
  function specText() {
    const sp = DZ.spec(), b = DZ.geo.bbox(DZ.P.room.pts), q = sp.pj ? parts(sp.pj) : null;
    return `Проект: ${DZ.P.name}${DZ.P.client ? '\nКлиент: ' + DZ.P.client : ''}\nКомната: ${fmtMm(b.w)}×${fmtMm(b.h)}, высота ${DZ.P.room.h} мм\n` +
      sp.list.map(r => `• ${r.name} ${r.w}×${r.h}×${r.d} — ${r.n} шт${r.price ? ' — ' + rub(r.price * r.n) : ''}`).join('\n') +
      (q ? `\nМатериалы: ${rub(q.M)}\nРаботы: ${rub(q.W)}${q.D ? '\nДоставка: ' + rub(q.D) : ''}` : '') + `\nИтого: ${rub(sp.total)}\n${APPROX}`;
  }
  function specModal() {
    const sp = DZ.spec(), pj = sp.pj, mats = DZ.MAT_SLOTS.map(s => { const m = DZ.matById(DZ.P.mats[s.key]); return m ? `${s.name}: ${esc(m.name)}` : ''; }).filter(Boolean);
    const k = pj ? parts(pj).k : 1, c = pj ? pj.c : DZ.price.get();
    let need = { ldsp: 0, dvp: 0, front: 0, top: 0, apron: 0, edge: 0, hinge: 0, slide: 0, handle: 0 };
    if (pj) pj.items.forEach(x => Object.keys(need).forEach(key => need[key] += x.p.need[key] || 0));
    const f1 = v => (Math.round(v * 10) / 10).toLocaleString('ru-RU'), wst = 1 + (+c.waste || 0) / 100;
    const use = [['ЛДСП с запасом', f1(need.ldsp * wst), 'м²'], ['ДВПО', f1(need.dvp * wst), 'м²'], ['Фасады', f1(need.front), 'м²'], ['Столешница', f1(need.top), 'п.м'], ['Фартук', f1(need.apron), 'п.м'], ['Кромка', f1(need.edge * 1.1), 'м'], ['Петли', need.hinge, 'шт'], ['Направляющие', need.slide, 'компл.'], ['Ручки', need.handle, 'шт']].filter(x => +String(x[1]).replace(',', '.') > 0);
    UI.modal('Смета', `<div class="print-head"><b>${esc(DZ.P.name)}</b>${DZ.P.client ? ' — ' + esc(DZ.P.client) : ''}<span>${new Date().toLocaleDateString('ru-RU')}</span></div><p class="hint" style="margin:0 0 12px">${mats.join(' · ')}</p>
      ${sp.list.length ? `<div class="tscroll"><table class="spec-t"><thead><tr><th>Наименование</th><th>Размер, мм</th><th class="r">Кол-во</th><th class="r">Материалы</th><th class="r">Работы</th><th class="r">Сумма</th></tr></thead><tbody>
      ${sp.list.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${r.w}×${r.h}×${r.d}</td><td class="r num">${r.n}</td><td class="r num">${r.det && r.price ? rub(r.det.matK / k * r.n) : '—'}</td><td class="r num">${r.det && r.price ? rub(r.det.work / k * r.n) : '—'}</td><td class="r num">${r.price ? rub(r.price * r.n) : '—'}</td></tr>`).join('')}
      ${pj && pj.orderWorks.length ? `<tr><td colspan="4">${pj.orderWorks.map(w => esc(w.n) + (w.q > 1 ? ' ×' + w.q : '')).join(', ')}</td><td class="r num">${rub(pj.orderWorks.reduce((a, w) => a + w.sum, 0) / k)}</td><td class="r num">${rub(pj.orderWorks.reduce((a, w) => a + w.sum, 0) / k)}</td></tr>` : ''}
      </tbody></table></div>
      <div class="spec-foot"><div><h3>Расход материалов</h3><table class="spec-t use-t"><tbody>${use.map(u => `<tr><td>${u[0]}</td><td class="r num">${u[1]} ${u[2]}</td></tr>`).join('')}</tbody></table></div><div>${totalsHtml(pj)}</div></div>` : '<p class="hint">Модулей пока нет.</p>'}
      <p class="hint">Материалы — по площади деталей с наценкой цеха (ЛДСП, ДВПО и кромка +${c.mkL}%, фасады +${c.mkF}%, фурнитура и прочее +${c.mkO}%). Работы — по расценкам цеха. Технику клиент покупает сам — в сумму не входит. Цены материалов: меню «Ещё» → «Цены».</p>`,
      `<button class="b" data-close>Закрыть</button><button class="b" id="spPrices">${ic('sliders')}Цены</button><button class="b" id="spCopy">${ic('copy')}Скопировать текстом</button><button class="b pri" id="spPrint">${ic('print')}Печать</button>`);
    $('#spPrint').onclick = () => window.print();
    $('#spCopy').onclick = () => copy(specText(), 'Смета скопирована');
    $('#spPrices').onclick = () => pricesModal(specModal);
  }
  /* ---------- цены материалов (настройки, в этом браузере) ---------- */
  function pricesModal(back) {
    const c = DZ.price.get();
    UI.modal('Цены для сметы', `<p class="hint" style="margin-top:0">Цены материалов для примерной сметы. Хранятся в этом браузере. Работы — по расценкам цеха.</p>` +
      DZ.price.FIELDS.map(([t, F]) => `<h3 class="ph3">${t}</h3><div class="pgrid">${F.map(([k, n, u]) => `<label class="fld">${n}<span class="unit u-${u === '%' ? 'pc' : 'rub'}" data-u="${u}"><input type="number" inputmode="decimal" min="0" step="any" data-pr="${k}" value="${c[k]}"></span></label>`).join('')}</div>`).join(''),
      `<button class="b" id="prReset">Как в цехе</button><button class="b" data-close>Отмена</button><button class="b pri" id="prSave">Сохранить</button>`, 'sm');
    $('#prReset').onclick = () => { $$('[data-pr]').forEach(i => { i.value = DZ.price.DEF[i.dataset.pr]; }); };
    $('#prSave').onclick = () => {
      const o = {}; $$('[data-pr]').forEach(i => { const v = parseFloat(String(i.value).replace(',', '.')); o[i.dataset.pr] = isFinite(v) && v >= 0 ? v : DZ.price.DEF[i.dataset.pr]; });
      o.office = Math.min(70, o.office); DZ.price.set(o); UI.closeModal(); renderRight(); UI.toast('Цены сохранены'); if (back) back();
    };
  }
  UI.prices = pricesModal;
  function copy(text, ok) {
    const done = () => UI.toast(ok);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());
    else fallback();
    function fallback() { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (_) { UI.toast('Не удалось скопировать'); } ta.remove(); }
  }
  function vertaks() { copy('Эскиз — ' + specText(), 'Сводка скопирована. Вставьте её в чат сделки в Вертаксе.'); }
  UI.specText = specText;

  /* ---------- клавиши ---------- */
  addEventListener('keydown', e => {
    if (!DZ.P || $('#app').hidden) return;
    const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    const k = e.key, mod = e.ctrlKey || e.metaKey;
    if (k === 'Escape') { if (!$('#modal').hidden) { UI.closeModal(); return; } if (DZ.plan.mode === 'draw') { DZ.plan.cancelDraw(); return; } act('unsel'); return; }
    if (!$('#modal').hidden) return;
    if (mod && (k === 'z' || k === 'я') && !e.shiftKey) { e.preventDefault(); $('#tUndo').click(); }
    else if (mod && (k === 'y' || k === 'н' || ((k === 'z' || k === 'Z' || k === 'я' || k === 'Я') && e.shiftKey))) { e.preventDefault(); $('#tRedo').click(); }
    else if (mod && (k === 'd' || k === 'в')) { e.preventDefault(); act('dup'); }
    else if (k === 'Delete' || k === 'Backspace') { if (DZ.sel.length) { e.preventDefault(); act('del'); } else if (DZ.selPt) { DZ.push(); DZ.P.room.points = (DZ.P.room.points || []).filter(p => p.id !== DZ.selPt); DZ.selPt = null; UI.changed({ room: true }); } else if (DZ.selOpen) { DZ.push(); DZ.P.room.openings = DZ.P.room.openings.filter(o => o.id !== DZ.selOpen); DZ.selOpen = null; UI.changed({ room: true }); } }
    else if ((k === 'r' || k === 'R' || k === 'к' || k === 'К') && !mod) act(e.shiftKey ? 'rot15' : 'rot');
    else if (k.startsWith('Arrow') && DZ.sel.length) {
      e.preventDefault(); const st = e.shiftKey ? 100 : 10, dx = k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, dz = k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0;
      if (!e.repeat) DZ.push(); selItems().forEach(it => { it.x += dx; it.z += dz; }); clearTimeout(UI._nT); DZ.v3.ok && DZ.v3.moveItems(); DZ.plan.render(); UI._nT = setTimeout(() => UI.changed({ items: true }), 300);
    }
  });

  /* ---------- запуск ---------- */
  UI.start = () => {
    UI.applyTheme();
    matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!DZ.settings.theme) UI.applyTheme(); });
    matchMedia('(max-width:820px)').addEventListener && matchMedia('(max-width:820px)').addEventListener('change', () => { if (DZ.P && UI._built && !$('#app').hidden) { closeSheets(); UI.setLayout(DZ.settings.layout || '3d', true); renderLeft(); renderRight(); updTop(); } });
    addEventListener('hashchange', () => { if (/^#(order|zamer)=/.test(location.hash)) { if (DZ.P && !$('#app').hidden) { try { DZ.store.save(DZ.P); } catch (_) { } } UI.route(); } });
    UI.route();
  };
  UI.route = () => {
    const h = String(location.hash || '');
    if (/^#order=/.test(h) && DZ.importOrder) { DZ.importOrder(h.slice(7)); return; }
    if (/^#zamer=/.test(h)) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (_) { }
      try { let s = h.slice(7).replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - s.length % 4) % 4); const bytes = Uint8Array.from(atob(s), c => c.charCodeAt(0)); const Z = JSON.parse(new TextDecoder().decode(bytes)); UI.showStart(); if (UI.importZamer(Z)) return; }
      catch (_) { UI.showStart(); UI.toast('Ссылка на замер повреждена'); return; }
      return;
    }
    const last = new URLSearchParams(location.search).get('p');
    if (last) { const P = DZ.validate(DZ.store.load(last)); if (P) { UI.openProject(P); return; } }
    UI.showStart();
  };
})();

</script>

<script>/* client.js */
/* Эскиз — работа с клиентом: варианты проекта, КП клиенту (печать А4), ссылка для клиента (просмотр без правки).
   Встраивается снаружи: обёртки над DZ.ui.openProject / DZ.ui.modal / DZ.ui.route / DZ.store.save / DZ.v3.photo.
   Данные: P.variants = [{id, name, data:{items, mats}|null (у открытого — null, он живёт в P), thumb, price}], P.varCur — id открытого.
   P.clientOpts = {front:[id…], top:[…], body:[…], handle:[…]} — какие декоры клиент может перебирать в ссылке. */
'use strict';
(function () {
  if (!window.DZ || !DZ.ui) return;
  const UI = DZ.ui, CL = DZ.client = { viewMode: false, photos: {} };
  const SITE = 'https://khalyev92kirill-beep.github.io/cehqr/dizain/';
  const LINK_SOFT = 8000, LINK_STRIP = 30000, LINK_MAX = 1500000;
  const SLOTS = [{ key: 'front', name: 'Фасады', low: 'фасады' }, { key: 'top', name: 'Столешница', low: 'столешница' }, { key: 'body', name: 'Корпус', low: 'корпус' }, { key: 'handle', name: 'Ручки', low: 'ручки' }];
  const IC2 = {
    layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
    link: '<path d="M10 14a4.5 4.5 0 006.4 0l3-3a4.5 4.5 0 00-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 00-6.4 0l-3 3a4.5 4.5 0 006.4 6.4l1-1"/>',
    doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>'
  };
  const ic = n => IC2[n] ? `<svg class="i" viewBox="0 0 24 24">${IC2[n]}</svg>` : UI.ic(n);
  const deep = o => JSON.parse(JSON.stringify(o));
  const today = () => new Date().toLocaleDateString('ru-RU');
  const addDays = n => { const d = new Date(); d.setDate(d.getDate() + (+n || 0)); return d.toLocaleDateString('ru-RU'); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const isPhone = () => matchMedia('(max-width:820px)').matches;

  /* ---------- настройки КП (в этом браузере) ---------- */
  const DEF_TERMS = 'Предоплата {предоплата} % при заключении договора, остаток — по готовности, перед доставкой.\n' +
    'Срок изготовления — {срок} рабочих дней после предоплаты и утверждения проекта.\n' +
    'Окончательная цена — после контрольного замера.\n' +
    'Бытовая техника, мойка и смеситель в цену не входят, если не указано отдельно.';
  CL.settings = () => Object.assign({ name: 'Мебельное производство', phone: '+7 (___) ___-__-__', address: 'г. Якутск', terms: DEF_TERMS, prepay: 50, days: 30, valid: 14 }, LS.get('dz-client', {}) || {});
  CL.saveSettings = s => LS.set('dz-client', s);

  /* =========================================================
     ВАРИАНТЫ
     ========================================================= */
  const Vr = CL.var = {};
  Vr.ensure = P => {
    P = P || DZ.P; if (!P) return [];
    if (!Array.isArray(P.variants) || !P.variants.length) { P.variants = [{ id: uid(), name: 'Вариант 1', data: null }]; P.varCur = P.variants[0].id; }
    if (!P.variants.some(v => v.id === P.varCur)) { P.varCur = P.variants[0].id; P.variants[0].data = null; }
    return P.variants;
  };
  Vr.cur = P => { P = P || DZ.P; Vr.ensure(P); return P.variants.find(v => v.id === P.varCur); };
  Vr.data = (v, P) => { P = P || DZ.P; return v.id === P.varCur ? { items: P.items, mats: P.mats } : (v.data || { items: [], mats: {} }); };
  Vr.price = (v, P) => { try { return DZ.price ? DZ.price.project({ items: Vr.data(v, P).items }).total : 0; } catch (_) { return 0; } };
  const fixItems = items => (items || []).map(it => Object.assign({ params: {}, mats: {}, y: 0, rot: 0, mount: ((DZ.libItem(it.lib) || {}).mount) || 'floor' }, it, { id: it.id || uid() }));
  /* поставить данные варианта в проект без сохранения (для КП и просмотра) */
  function loadData(d) { DZ.P.items = fixItems(d.items); DZ.P.mats = Object.assign(DZ.defaultMats(), d.mats || {}); }
  function redraw(full) {
    if (DZ.v3.ok) { DZ.v3.buildRoom(); DZ.v3.syncItems(); DZ.v3.dirty(); }
    if (full) UI.changed({ room: true, items: true, all: true }); else if (DZ.plan && DZ.plan.render) DZ.plan.render();
  }
  function thumbNow() { try { return (DZ.v3.ok && !$('#app').hidden && !$('#views').classList.contains('l-plan') && DZ.v3.thumb()) || ''; } catch (_) { return ''; } }
  Vr.switchTo = (id, quiet) => {
    const P = DZ.P; Vr.ensure(P); if (id === P.varCur) return;
    const cur = Vr.cur(P), nx = P.variants.find(v => v.id === id); if (!nx || !nx.data) return;
    cur.data = deep({ items: P.items, mats: P.mats }); if (!CL.viewMode) { const t = thumbNow(); if (t) cur.thumb = t; }
    loadData(nx.data); nx.data = null; P.varCur = id;
    DZ.sel = []; DZ.selWall = -1; DZ.selOpen = null; DZ.selPt = null; DZ.hist = { u: [], r: [] };
    redraw(true); updBadge();
    if (!quiet) UI.toast('Открыт: ' + nx.name);
  };
  Vr.duplicate = () => {
    const P = DZ.P; Vr.ensure(P);
    const copy = deep({ items: P.items, mats: P.mats }); copy.items.forEach(it => it.id = uid());
    let n = P.variants.length + 1; while (P.variants.some(v => v.name === 'Вариант ' + n)) n++;
    const v = { id: uid(), name: 'Вариант ' + n, data: copy }; P.variants.push(v);
    Vr.switchTo(v.id, true); UI.toast(v.name + ' — копия. Меняйте фасады или расстановку, вариант 1 не изменится.');
    return v;
  };
  Vr.remove = id => {
    const P = DZ.P; Vr.ensure(P); if (P.variants.length < 2) return;
    if (id === P.varCur) Vr.switchTo(P.variants.find(v => v.id !== id).id, true);
    P.variants = P.variants.filter(v => v.id !== id); UI.changed({}); updBadge();
  };
  Vr.rename = (id, name) => { const v = (DZ.P.variants || []).find(x => x.id === id); if (!v) return; v.name = String(name || '').trim().slice(0, 40) || v.name; UI.changed({}); updBadge(); };

  function updBadge() {
    const b = $('#tVarN'); if (!b || !DZ.P) return;
    const n = (DZ.P.variants || []).length; const c = n ? Vr.cur() : null;
    b.textContent = n > 1 ? c.name + ' из ' + n : 'Варианты';
  }

  function matName(id) { const m = DZ.matById(id); return m ? m.name : (id ? String(id) : '—'); }
  function swHtml(id, cls) { const m = DZ.matById(id) || { color: '#ccc', kind: 'solid', name: id || '—' }; return `<span class="cl-sw sw k-${esc(m.kind)} ${cls || ''}" title="${esc(m.name)}"><i style="background-color:${esc(m.color)}"></i></span>`; }

  function variantsModal() {
    const P = DZ.P; Vr.ensure(P);
    const curThumb = thumbNow(); if (curThumb) Vr.cur(P).thumb = curThumb;
    const vs = P.variants, many = vs.length > 1;
    const card = v => {
      const d = Vr.data(v), on = v.id === P.varCur, pr = Vr.price(v);

  /* =========================================================
     КП КЛИЕНТУ
     ========================================================= */
  // последняя фотокартинка каждого варианта (в памяти, на время работы)
  const photoKey = () => DZ.P ? DZ.P.id + ':' + (DZ.P.varCur || '') : '';
  function shrink(canvas, max, q) {
    const k = Math.min(1, max / Math.max(canvas.width, canvas.height)); if (k >= 1) return canvas.toDataURL('image/jpeg', q || 0.86);
    const c = document.createElement('canvas'); c.width = Math.round(canvas.width * k); c.height = Math.round(canvas.height * k);
    c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q || 0.86);
  }
  if (DZ.v3 && DZ.v3.photo) {
    const orig = DZ.v3.photo;
    DZ.v3.photo = async function () { const c = await orig.apply(this, arguments); try { if (!CL._quick && c && DZ.P) CL.photos[photoKey()] = shrink(c, 1800); } catch (_) { } return c; };
  }
  async function quickRender() {
    const fr = DZ.photoFrames; CL._quick = true;
    try { DZ.photoFrames = DZ.weak ? 4 : 6; const c = await DZ.v3.photo(); return shrink(c, 1600); }
    finally { DZ.photoFrames = fr; CL._quick = false; }
  }
  const swCache = {};
  function swatchUrl(id) {
    if (id in swCache) return swCache[id];
    let url = '';
    try {
      const m = window.DZ_MAT && window.THREE && DZ_MAT.material(THREE, id, { quality: 'fast' }), mm = m && [].concat(m)[0], img = mm && mm.map && mm.map.image;
      if (img && img.width) { const c = document.createElement('canvas'); c.width = c.height = 120; const s = Math.min(img.width, img.height) * 0.5; c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 120, 120); url = c.toDataURL('image/jpeg', 0.85); }
    } catch (_) { url = ''; }
    return swCache[id] = url;
  }
  // упрощённая развёртка для клиента: картинка стены + общие размеры и ширины модулей
  function elevSvg(wi) {
    const e = DZ.v3.elevation(wi, 1300), L = e.L, H = e.H, on = DZ.itemsOnWall(wi, 90);
    const fs = Math.max(Math.min(Math.max(L, H) / 27, 130), 60), padX = e.M + fs * 2.4, padB = e.MT + fs * 4.6, padT = e.MT + fs * 3.4;
    const vb = [-padX, -padT, L + 2 * padX, H + padT + padB], Y = y => H - y, INK = '#1B2329', MUT = '#56636A', MOD = '#16448F';
    const dimH = (x1, x2, y, txt, c) => { const t = fs * .3, sw = fs / 14; return `<g stroke="${c}" stroke-width="${sw}" fill="none"><path d="M${x1} ${y - t * 2}V${y + t}M${x2} ${y - t * 2}V${y + t}M${x1} ${y}H${x2}M${x1 - t} ${y + t}L${x1 + t} ${y - t}M${x2 - t} ${y + t}L${x2 + t} ${y - t}"/></g>${x2 - x1 > fs * 1.8 ? `<text x="${(x1 + x2) / 2}" y="${y - fs * .3}" font-size="${fs}" text-anchor="middle" fill="${c}" font-weight="600">${txt}</text>` : ''}`; };
    let s = `<svg viewBox="${vb.join(' ')}" xmlns="http://www.w3.org/2000/svg" font-family="Fira Sans Extra Condensed, Arial Narrow, sans-serif"><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#fff"/>
      <image href="${e.url}" x="${-e.M}" y="${-e.MT}" width="${L + 2 * e.M}" height="${H + 2 * e.MT}" preserveAspectRatio="none"/><rect x="0" y="0" width="${L}" height="${H}" fill="none" stroke="${INK}" stroke-width="${fs / 7}"/>`;
    const low = on.filter(o => o.it.y < 500), up = on.filter(o => o.it.y >= 500);
    const chain = (list, y) => list.map(o => { const a = clamp(o.t0, 0, L), b = clamp(o.t1, 0, L); return b - a > 1 ? dimH(a, b, y, fmtMm(b - a), MOD) : ''; }).join('');
    s += chain(low, Y(0) + e.MT + fs * 1.4) + dimH(0, L, Y(0) + e.MT + fs * 3.4, fmtMm(L), INK) + chain(up, -e.MT - fs * 1.2);
    s += `<text x="${L + e.M + fs * .4}" y="${H / 2}" font-size="${fs}" fill="${MUT}" font-weight="600" transform="rotate(-90 ${L + e.M + fs * .4} ${H / 2})" text-anchor="middle">h ${fmtMm(H)}</text></svg>`;
    return s;
  }
  // описание модуля простыми словами
  function plainParams(it) {
    const p = it.params || {}, out = [];
    if (p.doors && p.doors !== 'авто') out.push('дверей: ' + p.doors);
    if (p.count) out.push('ящиков: ' + p.count);
    if (p.shelves != null && +p.shelves > 0) out.push('полок: ' + p.shelves);
    if (p.bowls && +p.bowls > 1) out.push('мойка на ' + p.bowls + ' чаши');
    SLOTS.forEach(s => { if (it.mats && it.mats[s.key] && DZ.matById(it.mats[s.key])) out.push(s.low + ' ' + DZ.matById(it.mats[s.key]).name); });
    return out.join(', ');
  }
  function clientRows(P) {
    let pj = null; try { pj = DZ.price ? DZ.price.project(P) : null; } catch (_) { pj = null; }
    const map = new Map();
    P.items.forEach((it, i) => {
      if (it.lib === '_ext') return;
      const pr = pj ? pj.items[i].p.total : 0, desc = plainParams(it);
      const k = [it.name, it.w, it.h, it.d, desc, pr].join('|');
      const r = map.get(k) || { name: it.name, w: it.w, h: it.h, d: it.d, desc, price: pr, n: 0 }; r.n++; map.set(k, r);
    });
    const rows = Array.from(map.values()), sum = rows.reduce((a, r) => a + r.price * r.n, 0);
    const total = pj ? pj.total : sum, rest = Math.max(0, total - sum);
    const restName = pj ? [].concat(pj.deliv ? ['доставка'] : [], pj.orderWorks.map(w => w.n.toLowerCase())).join(', ') : '';
    return { rows, total, rest, restName };
  }
  function matsBlock(P) {
    const list = [];
    SLOTS.concat([{ key: 'wall', name: 'Стены (для картинки)' }, { key: 'floor', name: 'Пол (для картинки)' }]).forEach(s => { const id = P.mats[s.key]; if (id && DZ.matById(id)) list.push({ name: s.name, id }); });
    const seen = new Set(list.map(x => x.id));
    P.items.forEach(it => SLOTS.forEach(s => { const id = it.mats && it.mats[s.key]; if (id && !seen.has(id) && DZ.matById(id)) { seen.add(id); list.push({ name: s.name + ' (часть модулей)', id }); } }));
    return list.map(x => { const m = DZ.matById(x.id), u = swatchUrl(x.id); return `<div class="kp-mat"><span class="kp-sw" style="background-color:${esc(m.color)}${u ? `;background-image:url(${u})` : ''}"></span><div><small>${esc(x.name)}</small><b>${esc(m.name)}</b></div></div>`; }).join('');
  }

    const prog = (k, t) => { const p = $('#kpP'), x = $('#kpT'); if (p) p.style.width = Math.round(k * 100) + '%'; if (x) x.textContent = t || ''; };
    const curId = P.varCur, keep = { items: P.items, mats: P.mats }, selKeep = DZ.sel; DZ.sel = []; DZ.v3.ok && DZ.v3.syncHelpers && DZ.v3.syncHelpers();

        let cover = CL.photos[P.id + ':' + v.id] || '';

   (рабочая зона ≥ 300 мм), пеналы по краям ряда с зазором 50 мм от стены, верхние шкафы над нижними, вытяжка над варочной,

  if (!window.DZ) return;

    for (let u = 1; u <= maxU; u++) {
      best[u] = Infinity; how[u] = 0;
      ws.forEach(w => { const k = w / ST; if (k <= u && best[u - k] + cost[w] < best[u]) { best[u] = best[u - k] + cost[w]; how[u] = w; } });
    }
    const split = u => { const r = []; while (u > 0 && how[u]) { r.push(how[u]); u -= how[u] / ST; } return u === 0 ? r : null; };
    return { best, split };
  }

  /* ---------- подготовка отрезков под конкретную расстановку пеналов ---------- */
  function tallW(t, o) { return t === 'pantry' ? 450 : 600; }
  function prepSegs(geo, ends, o) {
    const S = geo.segs, last = S.length - 1, out = [];
    for (let i = 0; i < S.length; i++) {
      const s = Object.assign({}, S[i]);
      s.tallS = i === 0 ? ends.start : []; s.tallE = i === last ? ends.end : [];
      const pre = [], post = [];      // куски от края к середине
      // начало
      if (s.e0 === 'open') pre.push({ k: 'gapx', w: 0 }, { k: 'panel', w: PANEL, tallEnd: s.tallS.length > 0 });
      if (s.e0 === 'wall' && s.tallS.length) pre.push({ k: 'filler', w: 50, tall: true });
      s.tallS.forEach(t => pre.push({ k: 'tall', tt: t, w: tallW(t, o) }));
      if (s.e1 === 'open') post.push({ k: 'gapx', w: 0 }, { k: 'panel', w: PANEL, tallEnd: s.tallE.length > 0 });
      if (s.e1 === 'wall' && s.tallE.length) post.push({ k: 'filler', w: 50, tall: true });
      s.tallE.forEach(t => post.push({ k: 'tall', tt: t, w: tallW(t, o) }));
      const used = pre.concat(post).reduce((a, p) => a + p.w, 0);
      let U = s.t1 - s.t0 - used;
      if (U < 0) return null;
      const R = U % ST; U -= R;
      if (R > 0) {   // остаток — доборная планка: у стены без пенала → у угла → у стены с пеналом → на открытом конце остаётся пустым
        const pick = (s.e0 === 'wall' && !s.tallS.length) ? 'S' : (s.e1 === 'wall' && !s.tallE.length) ? 'E' : s.e0 === 'corner' ? 'S' : s.e1 === 'corner' ? 'E'
          : s.e0 === 'open' ? 'SO' : s.e1 === 'open' ? 'EO' : s.e0 === 'wall' ? 'SM' : 'EM';
        if (pick === 'S') pre.push({ k: 'filler', w: R }); else if (pick === 'E') post.push({ k: 'filler', w: R });
        else if (pick === 'SO') pre[0].w = R; else if (pick === 'EO') post[0].w = R;
        else if (pick === 'SM') pre.find(p => p.k === 'filler').w += R; else post.find(p => p.k === 'filler').w += R;
      }
      s.pre = pre; s.post = post;
      s.base = s.t0 + pre.reduce((a, p) => a + p.w, 0);
      s.n = U / ST;
      // ограничения для варочной и окна (в единицах сетки)
      s.winU = geo.wins.filter(q => q.k === s.k).map(q => [(q.t0 - s.base) / ST, (q.t1 - s.base) / ST, q]);
      // пенал под окном нельзя
      let tt = s.t0; for (const p of pre) { if (p.k === 'tall' && geo.wins.some(q => q.k === s.k && q.t0 < tt + p.w && q.t1 > tt)) return null; tt += p.w; }
      tt = s.t1; for (const p of post) { if (p.k === 'tall' && geo.wins.some(q => q.k === s.k && q.t0 < tt && q.t1 > tt - p.w)) return null; tt -= p.w; }
      s.distS = (s.base - s.t0); s.distE = (s.t1 - (s.base + U));   // от края отрезка до сетки
      out.push(s);
    }
    return out;
  }

  /* ---------- варианты пеналов по концам ---------- */
  function tallConfigs(o, geo) {
    const T = [];
    if (o.fridge !== 'none') T.push('fridge');
    if (o.oven === 'tall') T.push('oven');
    if (o.pantry) T.push('pantry');
    if (!T.length) return [{ start: [], end: [], key: '-' }];
    const segs = geo.segs, sOpen = segs.length && segs[0].e0, out = [];
    for (let m = 0; m < (1 << T.length); m++) {
      const st = [], en = [];
      T.forEach((t, i) => (m & (1 << i) ? en : st).push(t));
      if (o.fridge !== 'none' && o.fridgeAt === 'start' && !st.includes('fridge')) continue;
      if (o.fridge !== 'none' && o.fridgeAt === 'end' && !en.includes('fridge')) continue;
      // холодильник — крайний к стене
      const ord = a => a.sort((x, y) => (x === 'fridge' ? -1 : y === 'fridge' ? 1 : 0));
      ord(st); ord(en);
      out.push({ start: st, end: en.slice(), key: st.join(',') + '|' + en.join(',') });
    }
    return out;
  }

  /* ---------- перебор и оценка ---------- */
  AF.solve = (P, o) => {
    const geo = buildGeo(P, o);
    if (!geo.segs.length) return { geo, variants: [], err: 'Здесь нет места для шкафов: проверьте длину и двери.' };
    const relax = [
      { o: {}, note: '' },
      { o: { dw: o.dw ? 450 : 0 }, note: 'Посудомойка 45 см — 60 не поместилась' },
      { o: { dw: 0 }, note: 'Посудомойка не поместилась' },
      { o: { dw: 0, pantry: false, oven: o.oven === 'tall' ? 'hob' : o.oven }, note: 'Без пенала — не поместился' },
      { o: { dw: 0, pantry: false, oven: o.oven === 'tall' ? 'hob' : o.oven, fridge: 'none' }, note: 'Холодильник в ряд не поместился' },
      { o: { dw: 0, pantry: false, oven: o.oven === 'tall' ? 'hob' : o.oven, fridge: 'none', sinkW: 600 }, note: 'Мало места: только мойка и варочная' }
    ];
    for (const r of relax) {
      const oo = Object.assign({}, o, r.o);
      if (r.note && JSON.stringify(r.o) !== '{}' && Object.keys(r.o).every(k => o[k] === r.o[k])) continue;
      const res = search(P, oo, geo);
      if (res.length) return { geo, variants: res.map(c => realize(P, oo, geo, c, r.note)), opts: oo };
    }
    return { geo, variants: [], err: 'Не получилось расставить: ряд слишком короткий для мойки и варочной с рабочей зоной.' };
  };

  function search(P, o, geo) {
    const pref = (o.widths && o.widths.length ? o.widths : PREF_ALL).map(Number);
    const maxU = Math.ceil(geo.total / ST) + 4, DP = dpTable(pref, maxU);
    const sw = +o.sinkW || 600, su = sw / ST, dwW = +o.dw || 0, du = dwW / ST, hu = 600 / ST;
    const dwSides = du ? ['L', 'R'] : ['-'];
    const cand = [];
    const cornerEdges = [];
    geo.segs.forEach(s => { if (s.e0 === 'corner') cornerEdges.push(geo.off[s.k] + CORNER); if (s.e1 === 'corner') cornerEdges.push(geo.off[s.k] + s.w.L - CORNER); });
    const segsAll = geo.segs;
    const chainEnds = segsAll.length ? [geo.off[segsAll[0].k] + segsAll[0].t0, geo.off[segsAll[segsAll.length - 1].k] + segsAll[segsAll.length - 1].t1] : [0, 0];
    const gapOK = g => g === 0 || g >= 3;
    const plan = (s, c) => { const t = c - geo.off[s.k], w = s.w; return [w.a[0] + w.ux * t + w.nx * 300, w.a[1] + w.uy * t + w.ny * 300]; };
    const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
    tallConfigs(o, geo).forEach(cfg => {
      const S = prepSegs(geo, cfg, o); if (!S) return;
      const fullCost = S.map(s => s.n >= 0 && (gapOK(s.n)) ? DP.best[s.n] : Infinity);
      // где пеналы на плане (для треугольника)
      let fridgeP = null;
      if (cfg.start.includes('fridge')) { const s = S[0]; const t = s.t0 + s.pre.filter(p => p.k !== 'tall').reduce((a, p) => a + p.w, 0) + 300; fridgeP = plan(s, geo.off[s.k] + t); }
      if (cfg.end.includes('fridge')) { const s = S[S.length - 1]; const t = s.t1 - s.post.filter(p => p.k !== 'tall').reduce((a, p) => a + p.w, 0) - 300; fridgeP = plan(s, geo.off[s.k] + t); }
      const fridgeC = cfg.start.includes('fridge') ? chainEnds[0] : cfg.end.includes('fridge') ? chainEnds[1] : null;
      for (let si = 0; si < S.length; si++) {
        const A = S[si], bl = su + du;
        for (let p = 0; p + bl <= A.n; p++) {
          for (const side of dwSides) {
            const sp = side === 'L' ? p + du : p;           // мойка
            const sc = A.base + (sp + su / 2) * ST, sC = geo.off[A.k] + sc;
            // мойка под окном — можно; мойка не должна перекрывать край ряда пеналом — уже учтено
            let base = 0;
            // цель для мойки
            if (o.sink === 'custom' && o.sinkT != null) base += Math.abs(sC - o.sinkT) * 0.05;
            else if (o.sink === 'window' && geo.wins.length) base += Math.min(...geo.wins.map(q => Math.abs(q.c - sC))) * 0.03;
            else if (o.sink === 'corner') {
              const tg = cornerEdges.length ? cornerEdges : chainEnds;
              const sEdge0 = geo.off[A.k] + A.base + sp * ST, sEdge1 = sEdge0 + sw;
              base += Math.min(...tg.map(e => Math.min(Math.abs(e - sEdge0), Math.abs(e - sEdge1)))) * 0.04;
            } else if (geo.waterC != null) base += Math.abs(sC - geo.waterC) * 0.025;
            else if (geo.wins.length) base += Math.min(...geo.wins.map(q => Math.abs(q.c - sC))) * 0.008;
            // посудомойка у угла — дверь углового модуля мешает
            if (du) { const dp = side === 'L' ? p : sp + su; if ((dp === 0 && A.e0 === 'corner' && !A.pre.some(q => q.k === 'filler')) || (dp + du === A.n && A.e1 === 'corner' && !A.post.some(q => q.k === 'filler'))) base += 3; }
            const sinkP = plan(A, sC);
            for (let hi = 0; hi < S.length; hi++) {
              const B = S[hi];
              for (let q = 0; q + hu <= B.n; q++) {
                let sc2 = base;
                const h0 = B.base + q * ST, h1 = h0 + 600, hC = geo.off[B.k] + (h0 + h1) / 2;
                if (hi === si && q < p + bl && q + hu > p) continue;           // перекрытие
                // зазоры в отрезке
                let fill = 0, okk = true;
                for (let k = 0; k < S.length; k++) {
                  if (k !== si && k !== hi) { if (!isFinite(fullCost[k])) { okk = false; break; } fill += fullCost[k]; continue; }
                  const els = [];
                  if (k === si) els.push([p, p + bl]); if (k === hi) els.push([q, q + hu]);
                  els.sort((a, b) => a[0] - b[0]);
                  let cur = 0;
                  for (const e of els) { const g = e[0] - cur; if (!gapOK(g)) { okk = false; break; } fill += DP.best[g]; cur = e[1]; }
                  if (!okk) break; const g = S[k].n - cur; if (!gapOK(g)) { okk = false; break; } fill += DP.best[g];
                }
                if (!okk || !isFinite(fill)) continue;
                sc2 += fill;
                // варочная: от мойки ≥ 300, от пенала ≥ 300, от стены ≥ 200, не под окном
                if (hi === si) {
                  const s0 = sp, s1 = sp + su, gap = (q >= s1 ? q - s1 : s0 - (q + hu)) * ST;
                  if (gap < 300) continue;
                  if (gap < 600) sc2 += (600 - gap) * 0.03; else if (gap > 1500) sc2 += (gap - 1500) * 0.006;
                } else {
                  const gap = Math.abs(hC - sC) - 300 - sw / 2;
                  if (gap > 2400) sc2 += (gap - 2400) * 0.004;
                }
                const dS = q * ST + B.distS, dE = (B.n - q - hu) * ST + B.distE;   // до края отрезка
                const tallS = B.tallS.length, tallE = B.tallE.length;
                if (tallS && q * ST < 300) continue; if (tallE && (B.n - q - hu) * ST < 300) continue;
                if (!tallS) { if (B.e0 === 'wall' && dS < 200) continue; if (B.e0 === 'wall' && dS < 300) sc2 += 4; if (B.e0 === 'open' && dS < 150) continue; if (B.e0 === 'open' && dS < 300) sc2 += 6; if (B.e0 === 'corner' && dS < 200) continue; if (B.e0 === 'corner' && dS < 300) sc2 += 4; }
                if (!tallE) { if (B.e1 === 'wall' && dE < 200) continue; if (B.e1 === 'wall' && dE < 300) sc2 += 4; if (B.e1 === 'open' && dE < 150) continue; if (B.e1 === 'open' && dE < 300) sc2 += 6; if (B.e1 === 'corner' && dE < 200) continue; if (B.e1 === 'corner' && dE < 300) sc2 += 4; }
                if (B.winU.some(w => w[0] * ST < (q + hu) * ST + 100 && w[1] * ST > q * ST - 100)) continue;   // под окном — нет
                if (o.hob === 'custom' && o.hobT != null) sc2 += Math.abs(hC - o.hobT) * 0.05;
                else { if (geo.gasC != null) sc2 += Math.abs(hC - geo.gasC) * 0.02; if (geo.ventC != null) sc2 += Math.abs(hC - geo.ventC) * 0.003; }
                // рабочий треугольник
                const hobP = plan(B, hC);
                if (fridgeP) {
                  const legs = [dist(fridgeP, sinkP), dist(sinkP, hobP), dist(hobP, fridgeP)];
                  legs.forEach(x => { if (x < 1200) sc2 += (1200 - x) * 0.008; if (x > 2700) sc2 += (x - 2700) * 0.008; });
                  const sum = legs[0] + legs[1] + legs[2]; if (sum > 7000) sc2 += (sum - 7000) * 0.01;
                  if ((fridgeC < sC && sC < hC) || (fridgeC > sC && sC > hC)) sc2 -= 4;   // холодильник → мойка → плита
                }
                cand.push({ sc: sc2, cfg, S, si, p, side, sp, hi, q, sC, hC, sw, dwW });
              }
            }
          }
        }
      }
    });
    cand.sort((a, b) => a.sc - b.sc);
    // 2–3 разных варианта
    const sig = c => c.cfg.key + '|' + (c.hC < c.sC ? 'HS' : 'SH');
    const pickd = [];
    for (const c of cand) { if (!pickd.length) { pickd.push(c); continue; } if (pickd.every(x => sig(x) !== sig(c))) { pickd.push(c); if (pickd.length >= 3) break; } }
    if (pickd.length < 3) for (const c of cand) { if (pickd.length >= 3) break; if (pickd.includes(c)) continue; if (pickd.every(x => Math.abs(x.sC - c.sC) >= 450 || Math.abs(x.hC - c.hC) >= 450 || x.side !== c.side && Math.abs(x.sC - c.sC) >= 300)) pickd.push(c); }
    return pickd.map(c => Object.assign(c, { DP }));
  }

  /* ---------- превращаем вариант в модули ---------- */
  function realize(P, o, geo, c, relaxNote) {
    const pref = (o.widths && o.widths.length ? o.widths : PREF_ALL).map(Number);
    const DP = c.DP, S = c.S, items = [], notes = [], warn = [];
    if (relaxNote) warn.push(relaxNote);
    const upOn = !!o.uppers && hasLib('up_door');
    let upH = +o.upH || 720; const wallH = geo.wallH;
    if (UP_Y + upH > wallH - 20) upH = Math.max(300, wallH - 20 - UP_Y);
    const upTop = UP_Y + upH;
    const tallH = clamp(upOn ? upTop : 2100, 1900, Math.max(1900, wallH - 20));
    const mk = (id, ex) => { if (!hasLib(id)) return null; const it = DZ.makeItem(id, ex); return it; };
    const put = (it, w, t, back) => { if (!it) return null; it.rot = w.rot; const al = t + it.w / 2, s = (back || 0) + it.d / 2; it.x = w.a[0] + w.ux * al + w.nx * s; it.z = w.a[1] + w.uy * al + w.ny * s; it._af = 1; items.push(it); return it; };
    const segRows = [];
    // угловые модули
    for (let k = 0; k < geo.corners.length; k++) if (geo.corners[k]) {
      const A = geo.walls[k], B = geo.walls[k + 1];
      const sB = Math.cos(B.rot) * B.ux + (-Math.sin(B.rot)) * B.uy;   // ось модуля вдоль стены?
      const host = sB > 0 ? { w: B, t: 0 } : { w: A, t: A.L - CORNER };
      put(mk('low_corner_l', { w: CORNER, d: CORNER, h: LOW_H }), host.w, host.t, 0);
      if (upOn && hasLib('up_corner')) {
        const blocked = [k, k + 1].some(kk => geo.wins.some(q => q.k === kk && winHitsUp(q, kk === k ? A.L - CORNER : 0, kk === k ? A.L : CORNER, upTop)));
        if (!blocked) put(mk('up_corner', { w: CORNER, d: CORNER, h: upH, y: UP_Y, params: Object.assign({}, (lib('up_corner').params || []).reduce((a, p) => (a[p.key] = p.def, a), {}), { cd: UP_D }) }), host.w, host.t, 0);
      }
    }
    // отрезки
    S.forEach((s, k) => {
      const mids = [];   // [start unit, len units, kind]
      if (k === c.si) {
        if (c.side === 'L') mids.push([c.p, c.dwW / ST, 'dw']);
        mids.push([c.sp, c.sw / ST, 'sink']);
        if (c.side === 'R') mids.push([c.sp + c.sw / ST, c.dwW / ST, 'dw']);
      }
      if (k === c.hi) mids.push([c.q, 600 / ST, 'hob']);
      mids.sort((a, b) => a[0] - b[0]);
      const row = [];   // по порядку от t0
      s.pre.forEach(p => row.push(Object.assign({}, p)));
      let cur = 0;
      const gapFill = (g, leftKind, rightKind) => {
        let ws = DP.split(g) || []; ws.sort((a, b) => b - a);
        // широкие — к варочной, узкие — к краю
        if (rightKind === 'hob' && leftKind !== 'hob') ws.reverse();
        ws.forEach((w, i) => {
          const nextHob = (i === 0 && leftKind === 'hob') || (i === ws.length - 1 && rightKind === 'hob');
          const nextCorner = (i === 0 && leftKind === 'corner') || (i === ws.length - 1 && rightKind === 'corner');
          let id = w <= 250 ? 'low_bottle' : w <= 350 ? 'low_door' : nextHob ? 'low_drawers' : nextCorner || w >= 800 ? 'low_door' : 'low_drawer_door';
          if (w <= 250 && !hasLib('low_bottle')) id = 'low_door';
          row.push({ k: 'mod', id, w });
        });
      };
      const kindAt = side => side === 'S' ? (s.e0 === 'corner' && !s.pre.some(q => q.k === 'filler') ? 'corner' : 'edge') : (s.e1 === 'corner' && !s.post.some(q => q.k === 'filler') ? 'corner' : 'edge');
      let lastKind = kindAt('S');
      mids.forEach(m => { gapFill(m[0] - cur, lastKind, m[2]); row.push({ k: m[2], w: m[1] * ST }); cur = m[0] + m[1]; lastKind = m[2]; });
      gapFill(s.n - cur, lastKind, kindAt('E'));
      s.post.slice().reverse().forEach(p => row.push(Object.assign({}, p)));
      // ставим нижние
      let t = s.t0; const w = s.w;
      row.forEach((r, i) => {
        r.t = t;
        const prev = row[i - 1], next = row[i + 1];
        if (r.k === 'gapx') { }
        else if (r.k === 'panel') {
          put(mk('side_panel', { w: PANEL, h: r.tallEnd ? tallH : LOW_H - TOP_T, d: LOW_D, name: 'Торцевая панель' }), w, t, 0);
        }
        else if (r.k === 'filler') { if (r.w >= 5) put(mk('side_panel', { w: r.w, h: r.tall ? tallH : LOW_H - TOP_T, d: LOW_D, name: 'Доборная планка ' + r.w + ' мм' }), w, t, 0); }
        else if (r.k === 'tall') {
          if (r.tt === 'fridge') {
            if (o.fridge === 'free') put(mk('fridge', { w: 600, d: 650 }), w, t, 0);
            else { const it = put(mk('tall_fridge', { w: 600, h: tallH }), w, t, 0); if (it) it.params.hinge = i < row.length / 2 ? 'слева' : 'справа'; }
          } else if (r.tt === 'oven') put(mk('tall_oven', { w: 600, h: tallH }), w, t, 0);
          else put(mk('tall_pantry', { w: 450, h: tallH }), w, t, 0);
        }
        else if (r.k === 'sink') put(mk('low_sink', { w: r.w }), w, t, 0);
        else if (r.k === 'dw') put(mk('low_dishwasher', { w: r.w }), w, t, 0);
        else if (r.k === 'hob') {
          put(mk(o.oven === 'hob' && hasLib('low_oven') ? 'low_oven' : 'low_drawers', { w: r.w }), w, t, 0);
          const hb = mk('hob', { w: r.w - 20 }); if (hb) { hb.y = LOW_H; put(hb, w, t + 10, 40); }
        }
        else if (r.k === 'mod') put(mk(r.id, { w: r.w }), w, t, 0);
        t += r.w;
      });
      r_sum(row, s, warn);
      segRows.push({ s, row });
    });
    // верхние
    if (upOn) segRows.forEach(({ s, row }) => uppersFor(s, row, o, geo, upH, upTop, put, mk));
    // вытяжка-купол (если нет верхних или выбран купол)
    segRows.forEach(({ s, row }) => row.forEach(r => {
      if (r.k !== 'hob') return;
      if (upOn && o.hood === 'cab' && hasLib('up_hood')) return;
      const y = LOW_H + 750, h = clamp((upOn ? upTop : Math.min(wallH - 100, 2500)) - y, 500, 1300);
      put(mk('hood', { w: r.w, d: 500, y, h }), s.w, r.t, 0);
    }));
    // сводка
    const triangle = triangleOf(items);
    const wt = worktops(geo, segRows);
    const fillers = items.filter(i => /^Доборная/.test(i.name) && i.y < 100).map(i => i.w);
    const sinkRow = segRows.find(x => x.row.some(r => r.k === 'sink'));
    let sinkWhy = '';
    if (o.sink === 'custom') sinkWhy = 'Мойка — где вы указали';
    else if (o.sink === 'window') sinkWhy = geo.wins.length ? 'Мойка у окна' : 'Окна нет — мойка по месту';
    else if (o.sink === 'corner') sinkWhy = 'Мойка у угла';
    else if (geo.waterC != null) sinkWhy = 'Мойка у воды (' + Math.round(Math.abs(c.sC - geo.waterC)) + ' мм от точки)';
    else if (geo.wins.length) sinkWhy = 'Мойка у окна (воды в замере нет)';
    else sinkWhy = 'Мойка по месту (воды в замере нет)';
    notes.push(sinkWhy);
    if (c.dwW) notes.push('Посудомойка ' + (c.dwW / 10) + ' см рядом с мойкой');
    const sameSeg = c.si === c.hi; if (sameSeg) { const gap = Math.abs(c.hC - c.sC) - 300 - c.sw / 2; notes.push('Рабочая зона между мойкой и плитой ' + Math.round(gap) + ' мм'); }
    if (triangle) notes.push('Треугольник: ' + triangle.map(x => (x / 1000).toFixed(1)).join(' + ') + ' м');
    notes.push('Столешница: ' + wt.text);
    if (fillers.length) notes.push('Доборные планки: ' + fillers.join(', ') + ' мм');
    if (wt.long) warn.push('Столешница длиннее 4100 мм — нужен стык или заказ под размер');
    let name = variantName(c, geo);
    if (geo.ws.length > 1) name += ', мойка на стене ' + DZ.wallName(c.S[c.si].wi);
    if (c.dwW) name += ', посудомойка ' + (c.side === 'L' ? 'слева' : 'справа');
    return { items, notes, warn, name, sc: c.sc, c, triangle, segRows: segRows.map(x => ({ k: x.s.k, wi: x.s.wi, t0: x.s.t0, t1: x.s.t1, row: x.row.map(r => ({ k: r.k, w: r.w, t: r.t, id: r.id, tt: r.tt })) })), upTop, tallH };
  }
  function r_sum(row, s, warn) {
    const sum = row.reduce((a, r) => a + r.w, 0);
    if (Math.abs(sum - (s.t1 - s.t0)) > 0.5) warn.push('Сумма ширин не сошлась на стене ' + DZ.wallName(s.wi));
  }
  function winHitsUp(q, t0, t1, upTop) { return q.t0 - 30 < t1 && q.t1 + 30 > t0 && q.y < upTop && q.y + q.h > UP_Y; }
  function uppersFor(s, row, o, geo, upH, upTop, put, mk) {
    const wins = geo.wins.filter(q => q.k === s.k);
    const blocked = (t0, t1) => wins.some(q => winHitsUp(q, t0, t1, upTop));
    // кандидаты: каждый нижний модуль → верхний такой же ширины
    const U = [];
    row.forEach(r => {
      if (['mod', 'sink', 'dw', 'hob'].includes(r.k)) U.push({ t: r.t, w: r.w, k: r.k });
      else if (r.k === 'filler' && !r.tall) U.push({ t: r.t, w: r.w, k: 'filler' });
      else U.push({ t: r.t, w: r.w, k: 'none', src: r.k });
    });
    // узкие (< 200) сливаем с соседом
    for (let i = 0; i < U.length; i++) {
      const u = U[i]; if (u.k === 'none' || u.k === 'filler' || u.w >= 200) continue;
      const L = U[i - 1], R = U[i + 1], okN = x => x && (x.k === 'mod' || x.k === 'dw' || x.k === 'sink') && x.w + u.w <= 1000;
      const nb = okN(R) ? R : okN(L) ? L : null;
      if (nb) { if (nb === L) { L.w += u.w; } else { R.t = u.t; R.w += u.w; } u.k = 'merged'; } else u.k = 'open';
    }
    const list = U.filter(u => u.k !== 'merged');
    let lastUp = null;
    list.forEach((u, i) => {
      if (u.k === 'none') { lastUp = null; return; }
      if (blocked(u.t, u.t + u.w)) { lastUp = null; u.blocked = true; return; }
      if (u.k === 'filler') { if (u.w >= 5) put(mk('side_panel', { w: u.w, h: upH, d: UP_D, y: UP_Y, name: 'Доборная планка ' + u.w + ' мм' }), s.w, u.t, 0); return; }
      if (u.k === 'hob') {
        if (o.hood === 'cab' && hasLib('up_hood')) { const hh = Math.min(360, upH); put(mk('up_hood', { w: u.w, h: hh, d: UP_D, y: upTop - hh }), s.w, u.t, 0); }
        return;
      }
      if (u.k === 'open') { if (u.w >= 200 && hasLib('up_open')) put(mk('up_open', { w: u.w, h: upH, d: 300, y: UP_Y }), s.w, u.t, 0); return; }
      let id = 'up_door';
      if (u.k === 'sink' && hasLib('up_dryer') && u.w >= 400) id = 'up_dryer';
      put(mk(id, { w: u.w, h: upH, d: UP_D, y: UP_Y }), s.w, u.t, 0);
    });
    // торцевые панели верхних на открытых концах
    const ends = [];
    if (s.e0 === 'open') ends.push(0); if (s.e1 === 'open') ends.push(1);
    ends.forEach(e => {
      const pIdx = row.findIndex(r => r.k === 'panel' && (e === 0 ? r.t <= s.t0 + 50 : r.t >= s.t1 - 70));
      if (pIdx < 0) return; const p = row[pIdx], nb = row[e === 0 ? pIdx + 1 : pIdx - 1];
      if (!nb || nb.k === 'tall' || blocked(nb.t, nb.t + nb.w) || nb.k === 'hob') return;

    });
  }
  function triangleOf(items) {
    const f = items.find(i => i.lib === 'tall_fridge' || i.lib === 'fridge'), s = items.find(i => i.lib === 'low_sink'), h = items.find(i => i.lib === 'hob');

  function worktops(geo, segRows) {
    // кусок = подряд идущие нижние на одной стене; угол объединяет стены стыком
    const pieces = [];
    segRows.forEach(({ s, row }) => {
      let a = null, b = null;
      row.forEach(r => { if (['mod', 'sink', 'dw', 'hob', 'filler'].includes(r.k) && !r.tall) { if (a == null) a = r.t; b = r.t + r.w; } });
      if (a == null) return;

    });
    // на второй стене угла кусок короче на глубину столешницы первой (600)
    pieces.forEach(p => { if (p.e0 === 'corner') p.len -= 600; });
    const joints = pieces.filter(p => p.e1 === 'corner').length;
    const text = pieces.length === 1 ? 'одним куском ' + pieces[0].len + ' мм' : pieces.length + ' части — ' + pieces.map(p => p.len).join(' и ') + ' мм' + (joints ? ', стык' + (joints > 1 ? 'и' : '') + ' только в угл' + (joints > 1 ? 'ах' : 'у') : '');

  }
  function variantName(c, geo) {
    const parts = [];

    parts.push(c.hC < c.sC ? 'плита → мойка' : 'мойка → плита');
    return parts.join(', ');
  }

  /* ---------- применить ---------- */
  function zoneItems(P, ws) {
    return P.items.filter(it => ws.some(wi => {
      const w = GG.wall(P.room, wi), c = GG.local(w, it.x, it.z);
      if (c.t < -50 || c.t > w.L + 50) return false;

  AF.apply = (P, v, o) => {

  /* =========================================================
     ОКНО «ЗАПОЛНИТЬ СТЕНУ»

  let O = null, RES = null, vSel = 0, tm = 0;
  const ic = n => (DZ.ui && DZ.ui.ic) ? DZ.ui.ic(n) : '';
  const SHAPES = [['line', 'Прямая'], ['corner', 'Угловая'], ['u', 'П-образная']];
  function pickWalls(P, shape) {
    const ch = AF.chains(P.room, shape); if (!ch.length) return null;

    const score = ws => {
      let s = ws.reduce((a, i) => a + GG.wall(P.room, i).L, 0);
      ws.forEach(i => { if (P.room.openings.some(o => o.wall === i && o.type !== 'окно' && o.type !== 'ниша')) s -= 1500; });
      if (sw >= 0) { const mid = ws[Math.floor((ws.length - 1) / 2)]; if (ws.includes(sw)) s += 4000; if (shape === 'corner' && ws[0] === sw) s += 500; if (mid === sw) s += 800; }
      for (let k = 0; k < ws.length - 1; k++) if (!cornerOK(GG.wall(P.room, ws[k]), GG.wall(P.room, ws[k + 1]))) s -= 3000;
      return s;
    };

  }
  AF.open = () => {

  const segBtns = (name, list, val) => `<div class="seg af-seg" data-af-k="${name}">${list.map(([v, t]) => `<button type="button" data-v="${v}" class="${String(val) === String(v) ? 'on' : ''}">${t}</button>`).join('')}</div>`;

        <label class="fld">Вытяжка<select data-af-sel="hood"><option value="cab" ${O.hood === 'cab' ? 'selected' : ''}>В шкафу</option><option value="dome" ${O.hood === 'dome' ? 'selected' : ''}>Купольная</option></select></label></div>` : ''}

  }
  function render(first) {

  function renderResult() {

    }

  /* полоса-развёртка ряда с маркерами мойки и плиты */
  function stripSvg(v) {

    let s = `<svg class="af-strip" id="afStrip" viewBox="${-pad} 0 ${L + 2 * pad} ${H + top + 70 + 120 * ks}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ряд шкафов в развёртке">`;
    // стены
    g.walls.forEach((w, k) => {
      const x0 = g.off[k]; s += `<rect x="${x0}" y="${Y(H)}" width="${w.L}" height="${H}" class="af-wall"/>`;
      const r = g.ranges[k]; s += `<rect x="${x0 + r[0]}" y="${Y(0) + 10}" width="${Math.max(0, r[1] - r[0])}" height="26" class="af-rng-b"/>`;
      s += `<text x="${x0 + w.L / 2}" y="${Y(0) + 40 + 100 * ks}" class="af-t" style="font-size:${110 * ks}px" text-anchor="middle">Стена ${esc(DZ.wallName(g.ws[k]))} · ${Math.round(w.L)}</text>`;
      if (k) s += `<line x1="${x0}" x2="${x0}" y1="${Y(H)}" y2="${Y(0)}" class="af-cor"/>`;

        let cls = it.lib === 'low_sink' ? 'sink' : it.lib === 'low_oven' || it.lib === 'hood' || it.lib === 'up_hood' ? 'hob' : /^tall|^fridge/.test(it.lib) ? 'tall' : it.lib === 'side_panel' ? 'pan' : it.lib === 'low_dishwasher' ? 'dw' : /corner/.test(it.lib) ? 'cor' : 'mod';

'use strict';

  const AR = DZ.ar = { supported: null };

    // точка проекта (мм) → мир AR (м): hit + Ry(yaw)·K·(p − центр)

    if (!sel) return h + '</div>';
    if (e.type === 'slope') {
      h += `<div class="grid2">${num('d', 'Ширина скоса', e.d || 1200)}${num('h', 'Высота у стены', e.h || 1500)}</div><p class="hint" style="margin:0">Потолок опускается от ${fmtMm(rm.h)} до ${fmtMm(e.h)} мм к стене ${esc(DZ.wallName(e.wall))}.</p>`;
      return h + '</div>';
    }
    const an = R.anchor(e), circ = t.shape === 'circ';
    h += `<div class="grid2">${circ ? num('w', 'Диаметр', e.w) : num('w', 'Ширина', e.w) + num('d', 'Глубина', e.d)}`;
    if (an !== 'full') h += num('h', 'Высота', R.yr(e)[1] - R.yr(e)[0]);
    if (an === 'floor') h += num('y', 'От пола', e.y || 0);
    if (!circ) h += num('a', 'Поворот', +e.a || 0, '°');
    R.wallGaps(e).forEach(g => { h += num('gap' + g.w.i, 'До стены ' + esc(DZ.wallName(g.w.i)), Math.max(0, g.s)); });
    h += `</div><label class="fld" style="margin-top:4px">Где стоит<select class="inp" data-rmk="anchor">${Object.keys(ANCH).map(k => `<option value="${k}" ${k === an ? 'selected' : ''}>${ANCH[k]}</option>`).join('')}</select></label>`;
    return h + '</div>';
  };
  function trash() { return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'; }
  R.panelHtml = () => {
    const E = els();
    let h = `<h3>Колонны, короба, ступени</h3><div class="grid2" style="margin-bottom:10px">${Object.keys(EL).filter(k => k !== 'slope').map(k => `<button class="b" data-rmadd="${k}" title="${EL[k].name}" style="min-width:0;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">+ ${EL[k].btn}</button>`).join('')}</div>`;
    h += E.filter(e => e.type !== 'slope').map(R.elCard).join('');
    h += `<p class="hint">Элемент встаёт в угол выбранной стены. Двигайте его на плане — у стены он прилипает. Шкафы, которые на него налезают, станут красными.</p>`;
    return h;
  };
  R.wallHtml = (w) => {
    const rm = DZ.P.room, i = w.i, s = R.sag(rm, i), ang = R.innerAng(rm, i), slope = els().find(e => e.type === 'slope' && e.wall === i);
    let h = `<h3>Форма стены ${esc(DZ.wallName(i))}</h3><div class="grid2">`;
    if (ang != null) h += R.angEditable(rm, i) ? `<label class="fld">Угол в начале<span class="unit" data-u="°"><input type="number" step="1" data-rmw="ang" data-wi="${i}" value="${Math.round(ang * 10) / 10}"></span></label>` : `<label class="fld">Угол в начале<span class="unit" data-u="°"><input type="number" value="${Math.round(ang * 10) / 10}" disabled></span></label>`;
    h += `<label class="fld">Дуга (прогиб)<span class="unit"><input type="number" step="10" data-rmw="arc" data-wi="${i}" value="${Math.round(s)}"></span></label></div>`;
    h += `<p class="hint" style="margin:6px 0">Дуга: плюс — выгнута наружу, минус — внутрь, 0 — прямая.${s ? ' Длина по дуге ' + fmtMm(R.arcLen(rm, i)) + ' мм. Окна и двери на дуговой стене не рисуются.' : ''} Угол между стенами меняет направление этой стены, последняя стена подстраивается.</p>`;
    h += `<div class="grid2" style="margin-bottom:8px"><button class="b" data-rmact="split" data-wi="${i}">+ Угол посередине</button>${rm.pts.length > 3 ? `<button class="b" data-rmact="unsplit" data-wi="${i}">Убрать угол в начале</button>` : ''}</div>`;
    h += `<h3>Скос потолка</h3>` + (slope ? R.elCard(slope) : `<button class="b" style="width:100%" data-rmadd="slope">+ Скос потолка у этой стены</button><p class="hint" style="margin-top:4px">Мансарда: потолок опускается к этой стене.</p>`);
    return h;
  };
  R.propsHtml = () => {
    const e = R.get(DZ.selEl); if (!e) return '';
    return `<div class="title"><span style="flex:1">${esc((EL[e.type] || {}).name || '')}</span></div>` + R.elCard(e).replace(/^<div class="op-card on"/, '<div class="op-card on" style="border:0;padding:0;background:none"');
  };
  R.drawBarHtml = () => {
    setTimeout(() => { const b = document.getElementById('drawbar'); if (b) { b.style.width = 'max-content'; b.style.rowGap = '6px'; } }, 0);
    const st = DZ.plan.angStep == null ? (DZ.plan.ortho ? 90 : 0) : DZ.plan.angStep;
    return `<label style="white-space:nowrap">Угол <select id="drStep" class="inp" style="height:32px;width:auto;padding:0 6px">${[[90, '90°'], [45, '45°'], [15, '15°'], [0, 'любой']].map(([v, n]) => `<option value="${v}" ${v === st ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <input id="drLen" class="inp" type="number" step="10" placeholder="Длина" aria-label="Длина стены, мм" style="height:32px;width:84px" ${DZ.plan.draw.length ? '' : 'disabled'}>
      <input id="drAng" class="inp" type="number" step="1" placeholder="Угол°" aria-label="Направление, градусы" style="height:32px;width:70px" ${DZ.plan.draw.length ? '' : 'disabled'}>
      <button class="b" data-rmdraw="put" ${DZ.plan.draw.length ? '' : 'disabled'}>Поставить</button>`;
  };

  /* ---------- события панелей ---------- */
  document.addEventListener('click', ev => {
    const t = ev.target.closest && ev.target.closest('[data-rmadd],[data-rmdel],[data-rmsel],[data-rmact],[data-rmdraw]'); if (!t || !DZ.P) return;
    const rm = DZ.P.room;
    if (t.dataset.rmadd) R.add(t.dataset.rmadd);
    else if (t.dataset.rmdel) R.del(t.dataset.rmdel);
    else if (t.dataset.rmsel) { DZ.selEl = DZ.selEl === t.dataset.rmsel ? null : t.dataset.rmsel; if (DZ.selEl) { DZ.sel = []; DZ.selOpen = null; DZ.selPt = null; const e = R.get(DZ.selEl); DZ.selWall = e && e.type === 'slope' ? e.wall : -1; } DZ.ui.selChanged(); }
    else if (t.dataset.rmact === 'split') { DZ.push(); R.splitWall(rm, +t.dataset.wi); DZ.selWall = +t.dataset.wi; DZ.ui.changed({ room: true }); DZ.ui.toast('Стена разделена — двигайте новый угол на плане'); }
    else if (t.dataset.rmact === 'unsplit') { DZ.push(); if (R.removeCorner(rm, +t.dataset.wi)) { DZ.selWall = -1; DZ.ui.changed({ room: true }); DZ.ui.selChanged(); } }
    else if (t.dataset.rmdraw) putTyped();
  });
  document.addEventListener('change', ev => {
    const t = ev.target; if (!DZ.P || !t.dataset) return; const rm = DZ.P.room;
    if (t.id === 'drStep') { DZ.plan.angStep = +t.value; DZ.plan.ortho = +t.value === 90; DZ.plan.render(); return; }
    if (t.dataset.rmw) {
      const i = +t.dataset.wi, v = +t.value; DZ.push();
      if (t.dataset.rmw === 'arc') { const w = G.wall(rm, i); rm.arcs = rm.arcs || {}; const s = clamp(Math.round(v || 0), -Math.floor(w.L / 2) + 10, Math.floor(w.L / 2) - 10); if (Math.abs(s) < 10) delete rm.arcs[i]; else rm.arcs[i] = s; if (!Object.keys(rm.arcs).length) delete rm.arcs; }
      else if (t.dataset.rmw === 'ang' && v > 5 && v < 355) R.setInnerAng(rm, i, v);
      DZ.ui.changed({ room: true }); return;
    }
    if (t.dataset.rmk) {
      const e = R.get(DZ.selEl); if (!e) return; const k = t.dataset.rmk, v = +t.value; DZ.push();
      if (k === 'anchor') { e.anchor = t.value; if (t.value !== 'full' && !(+e.h > 0)) e.h = (EL[e.type] || {}).h || 300; }
      else if (k === 'w') { e.w = clamp(Math.round(v || 100), 20, 20000); if ((EL[e.type] || {}).shape === 'circ') e.d = e.w; }
      else if (k === 'd') e.d = e.type === 'slope' ? clamp(Math.round(v || 100), 100, 10000) : clamp(Math.round(v || 100), 20, 20000);
      else if (k === 'h') e.h = e.type === 'slope' ? clamp(Math.round(v || 1500), 300, rm.h - 10) : clamp(Math.round(v || 100), 10, rm.h);
      else if (k === 'y') e.y = clamp(Math.round(v || 0), 0, rm.h - 10);
      else if (k === 'a') e.a = ((Math.round(v || 0) % 360) + 360) % 360;
      else if (k.startsWith('gap')) { const w = G.wall(rm, +k.slice(3)), g = R.wallGaps(e).find(q => q.w.i === w.i); if (g) { const d = Math.max(0, v || 0) - g.s; e.x = Math.round(e.x + w.nx * d); e.z = Math.round(e.z + w.ny * d); } }
      DZ.ui.changed({ room: true }); return;
    }
  });
  document.addEventListener('keydown', ev => {
    if (!DZ.P || !DZ.plan) return; const tag = (ev.target.tagName || '').toLowerCase();
    if (ev.target.id === 'drLen' || ev.target.id === 'drAng') { if (ev.key === 'Enter') { ev.preventDefault(); putTyped(); } return; }
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    const modal = document.getElementById('modal'); if (modal && !modal.hidden) return;
    if (DZ.selEl && !DZ.sel.length && (ev.key === 'Delete' || ev.key === 'Backspace')) { ev.preventDefault(); R.del(DZ.selEl); }
    else if (DZ.selEl && ev.key === 'Escape') { DZ.selEl = null; DZ.ui.selChanged(); }
    else if (DZ.selEl && !DZ.sel.length && ev.key.startsWith('Arrow')) {
      const e = R.get(DZ.selEl); if (!e || e.type === 'slope') return; ev.preventDefault(); const st = ev.shiftKey ? 100 : 10;
      if (!ev.repeat) DZ.push(); e.x += ev.key === 'ArrowLeft' ? -st : ev.key === 'ArrowRight' ? st : 0; e.z += ev.key === 'ArrowUp' ? -st : ev.key === 'ArrowDown' ? st : 0;
      clearTimeout(R._kt); DZ.ui.live('room'); R._kt = setTimeout(() => DZ.ui.changed({ room: true }), 300);
    }
  });
  function putTyped() {
    const L = +(document.getElementById('drLen') || {}).value, A = (document.getElementById('drAng') || {}).value;
    if (!(L >= 100)) { DZ.ui.toast('Введите длину стены, мм'); return; }
    DZ.plan.typeSeg(L, A === '' || A == null ? null : +A);
    setTimeout(() => { const i = document.getElementById('drLen'); if (i) { i.focus(); } }, 30);
  }

  /* выбор других объектов снимает выбор элемента */
  const baseSel = DZ.ui.selChanged;
  DZ.ui.selChanged = function () { const se = DZ.selEl && R.get(DZ.selEl), keep = se && se.type === 'slope' && DZ.selWall === se.wall; if (DZ.selEl && !keep && (DZ.sel.length || DZ.selOpen || DZ.selPt || DZ.selWall >= 0)) DZ.selEl = null; if (DZ.selEl && !R.get(DZ.selEl)) DZ.selEl = null; return baseSel.apply(this, arguments); };
})();

</script>

<script>
try { DZ.ui.start(); } catch (e) { console.error(e); document.body.innerHTML = '<p style="padding:24px;font:16px system-ui">Ошибка запуска: ' + String(e && e.message || e) + '</p>'; }
</script>
</body>
</html>
